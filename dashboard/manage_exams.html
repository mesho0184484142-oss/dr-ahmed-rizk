<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الامتحانات والأرشيف - المنصة التعليمية</title>
    
    <!-- إعدادات تطبيق الويب (PWA) مع المسارات الصحيحة للرجوع للخلف -->
    <link rel="manifest" href="../manifest.json">
    
    <!-- لدعم أندرويد -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4318FF">

    <!-- لدعم آيفون (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="المنصة التعليمية">
    <link rel="apple-touch-icon" href="../images/logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --primary: #4318FF;
            --secondary: #a3aed1;
            --success: #05CD99;
            --danger: #EE5D50;
            --warning: #ffce20;
            --dark-text: #2b3674;
            --bg-light: #f4f7fe;
            --card-bg: #ffffff;
            --border-color: #e0e5f2;
        }

        body { font-family: 'Cairo', sans-serif; background: var(--bg-light); color: var(--dark-text); }

        .tabs-container {
            display: flex; gap: 15px; margin-bottom: 30px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px;
        }
        
        .tab-btn {
            background: transparent; border: none; padding: 10px 25px; font-size: 18px; font-weight: 800;
            color: var(--secondary); cursor: pointer; transition: 0.3s; border-radius: 12px; font-family: 'Cairo';
        }
        
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 5px 15px rgba(67, 24, 255, 0.2); }
        .tab-btn:hover:not(.active) { background: rgba(67, 24, 255, 0.05); color: var(--primary); }

        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .exams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }

        .exam-card {
            background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid var(--border-color);
            box-shadow: 0 5px 20px rgba(0,0,0,0.03); transition: 0.3s; position: relative;
        }
        .exam-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(67,24,255,0.08); }

        .exam-card h3 { margin: 0 0 10px 0; color: var(--primary); font-size: 20px; }
        .exam-card p { margin: 5px 0; font-size: 14px; font-weight: 700; color: var(--secondary); display: flex; justify-content: space-between;}
        .exam-card p strong { color: var(--dark-text); }

        .badge { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; }
        .badge-target { background: rgba(67, 24, 255, 0.1); color: var(--primary); }
        
        .actions-row { display: flex; gap: 10px; margin-top: 20px; padding-top: 15px; border-top: 1px dashed var(--border-color); }
        
        .btn-small {
            flex: 1; padding: 10px; border: none; border-radius: 10px; font-family: 'Cairo'; font-weight: 800; font-size: 13px;
            cursor: pointer; transition: 0.3s;
        }
        .btn-edit { background: rgba(255, 206, 32, 0.2); color: #c29d00; }
        .btn-edit:hover { background: var(--warning); color: white; }
        .btn-archive { background: rgba(163, 174, 209, 0.2); color: var(--secondary); }
        .btn-archive:hover { background: var(--secondary); color: white; }
        .btn-restore { background: rgba(5, 205, 153, 0.2); color: var(--success); }
        .btn-restore:hover { background: var(--success); color: white; }
        .btn-delete { background: rgba(238, 93, 80, 0.1); color: var(--danger); }
        .btn-delete:hover { background: var(--danger); color: white; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(5px);
        }
        .modal-box {
            background: var(--card-bg); padding: 30px; border-radius: 20px; width: 90%; max-width: 450px;
            max-height: 85vh; overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); animation: scaleUp 0.3s ease;
        }
        @keyframes scaleUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 800; margin-bottom: 8px; color: var(--dark-text); }
        .form-group input {
            width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 12px;
            font-family: 'Cairo'; font-size: 15px; outline: none; transition: 0.3s; box-sizing: border-box;
        }
        .form-group input:focus { border-color: var(--primary); }

        .modal-actions { display: flex; gap: 15px; margin-top: 30px; }
        .btn-save { background: var(--primary); color: white; flex: 2; padding: 12px; border: none; border-radius: 12px; font-weight: 800; font-family: 'Cairo'; cursor: pointer; }
        .btn-cancel { background: #eee; color: #555; flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: 800; font-family: 'Cairo'; cursor: pointer; }

    </style>
</head>
<body>

    <script>
        const savedColor = localStorage.getItem('primaryColor') || "#4318FF";
        document.documentElement.style.setProperty('--primary', savedColor);
    </script>

    <div class="sidebar">
        <h3>👨‍🏫 لوحة الإدارة</h3>
        <ul>
            <li><a href="index.html">🏠 الرئيسية والإحصائيات</a></li>
            <li><a href="add_exam.html">📝 بناء امتحان جديد</a></li>
            <li><a href="manage_exams.html" class="active">📂 إدارة الامتحانات</a></li>
            <li><a href="center_report.html">📊 تقارير الدرجات</a></li>
            <li><a href="manage_students.html">👥 إدارة الطلاب</a></li>
            <li><a href="settings.html">⚙️ إعدادات المنصة</a></li>
            <li><a href="../auth/login.html" style="color: var(--danger);">🚪 تسجيل الخروج</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>📂 إدارة الامتحانات والأرشيف</h2>
            <button onclick="window.location.href='add_exam.html'" class="tab-btn active" style="font-size: 15px; padding: 10px 20px;">➕ امتحان جديد</button>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('activeExams')">🟢 الامتحانات النشطة</button>
            <button class="tab-btn" onclick="switchTab('archivedExams')">📦 الأرشيف</button>
        </div>

        <div id="activeExams" class="tab-content active">
            <div class="exams-grid" id="activeGrid">
                <p style="color: var(--secondary); font-weight: 700;">جاري تحميل الامتحانات...</p>
            </div>
        </div>

        <div id="archivedExams" class="tab-content">
            <div class="exams-grid" id="archiveGrid"></div>
        </div>
    </div>

    <div class="modal-overlay" id="datesModal">
        <div class="modal-box">
            <h3 style="color: var(--primary); margin-top: 0;">📅 جدولة الامتحان</h3>
            <p style="color: var(--secondary); font-size: 13px; font-weight: 600; margin-bottom: 20px;">حدد متى يظهر الامتحان للطلاب ومتى يختفي</p>
            
            <input type="hidden" id="editingExamId">
            
            <div id="globalDatesContainer">
                <div class="form-group">
                    <label>تاريخ ووقت الفتح (البداية):</label>
                    <input type="datetime-local" id="modalStartDate">
                </div>
                
                <div class="form-group">
                    <label>تاريخ ووقت الإغلاق (النهاية):</label>
                    <input type="datetime-local" id="modalEndDate">
                </div>
            </div>

            <div id="centerDatesContainer" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <label style="margin: 0; font-weight: 800; color: var(--primary);">مواعيد السناتر:</label>
                    <button class="btn-small" style="background: var(--primary); color: white; padding: 5px 10px;" onclick="addModalCenterAssignment()">➕ إضافة سنتر</button>
                </div>
                <div id="modalCentersList"></div>
            </div>

            <div class="modal-actions">
                <button class="btn-save" onclick="saveExamDates()">💾 حفظ التعديلات</button>
                <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allExams = {};
        let availableCenters = [];

        const uniTranslations = {
            'alex_uni': 'الإسكندرية', 'damanhour_uni': 'دمنهور', 
            'bachelor': 'بكالوريا', 'baccalaureate': 'بكالوريا'
        };
        const gradeTranslations = { 'year_1': 'فرقة 1', 'year_2': 'فرقة 2', 'year_3': 'فرقة 3', 'year_4': 'فرقة 4' };

        window.onload = () => {
            database.ref('centers').once('value').then(snapshot => {
                if (snapshot.exists()) {
                    const centers = snapshot.val();
                    availableCenters = Array.isArray(centers) ? centers : Object.values(centers);
                }
            });

            database.ref('exams').on('value', snapshot => {
                allExams = snapshot.val() || {};
                renderExams();
            });
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function formatDateTime(isoString) {
            if(!isoString) return "غير محدد";
            const d = new Date(isoString);
            return d.toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' });
        }

        function renderExams() {
            const activeGrid = document.getElementById('activeGrid');
            const archiveGrid = document.getElementById('archiveGrid');
            activeGrid.innerHTML = ''; archiveGrid.innerHTML = '';

            let activeCount = 0, archiveCount = 0;
            const examsArray = Object.keys(allExams).map(key => ({ id: key, ...allExams[key] })).reverse();

            examsArray.forEach(exam => {
                let targetText = uniTranslations[exam.university] || exam.university;
                if(exam.university === 'baccalaureate' || exam.university === 'bachelor') {
                    if (exam.center === 'multiple') {
                        targetText += ` - متعدد السناتر`;
                    } else {
                        targetText += ` - ${exam.center === 'all' ? 'كل السناتر' : exam.center}`;
                    }
                } else {
                    targetText += ` - ${gradeTranslations[exam.grade] || exam.grade}`;
                }

                let datesDisplay = '';
                if (exam.university === 'baccalaureate' || exam.university === 'bachelor') {
                    datesDisplay = `<p style="margin:0; font-size:12px; color:var(--primary); font-weight:bold; text-align:center;">مواعيد مخصصة للسناتر 📅</p>`;
                } else {
                    datesDisplay = `
                        <p style="margin:0 0 5px 0; font-size:12px;">يفتح: <strong style="color:var(--success);">${formatDateTime(exam.startDate)}</strong></p>
                        <p style="margin:0; font-size:12px;">يُغلق: <strong style="color:var(--danger);">${formatDateTime(exam.endDate)}</strong></p>
                    `;
                }

                let cardHTML = `
                    <div class="exam-card">
                        <span class="badge badge-target" style="position:absolute; top:20px; left:20px;">${targetText}</span>
                        <h3 style="padding-left: 80px;">📝 ${exam.name}</h3>
                        <p>مدة الامتحان: <strong>${exam.duration} دقيقة</strong></p>
                        <p>الدرجة النهائية: <strong>${exam.totalScore || exam.totalQuestions || '--'} درجة</strong></p>
                        
                        <div style="background: var(--bg-light); padding: 10px; border-radius: 10px; margin-top: 15px;">
                            ${datesDisplay}
                        </div>
                        
                        <div class="actions-row">
                            <button class="btn-small btn-edit" onclick="openModal('${exam.id}')">📅 المواعيد</button>
                `;

                if (exam.isArchived) {
                    cardHTML += `
                            <button class="btn-small btn-restore" onclick="toggleArchive('${exam.id}', false)">🔙 استعادة</button>
                            <button class="btn-small btn-delete" onclick="deleteExam('${exam.id}')">🗑️ حذف</button>
                        </div></div>`;
                    archiveGrid.innerHTML += cardHTML;
                    archiveCount++;
                } else {
                    cardHTML += `
                            <button class="btn-small btn-archive" onclick="toggleArchive('${exam.id}', true)">📦 أرشفة</button>
                            <button class="btn-small btn-delete" onclick="deleteExam('${exam.id}')">🗑️ حذف</button>
                        </div></div>`;
                    activeGrid.innerHTML += cardHTML;
                    activeCount++;
                }
            });

            if (activeCount === 0) activeGrid.innerHTML = '<p style="color:var(--secondary); font-weight:700;">لا توجد امتحانات نشطة حاليا</p>';
            if (archiveCount === 0) archiveGrid.innerHTML = '<p style="color:var(--secondary); font-weight:700;">الأرشيف فارغ</p>';
        }

        function toggleArchive(examId, status) {
            database.ref(`exams/${examId}/isArchived`).set(status);
        }

        function deleteExam(examId) {
            database.ref(`exams/${examId}`).remove();
        }

        function openModal(examId) {
            const exam = allExams[examId];
            document.getElementById('editingExamId').value = examId;
            
            const globalContainer = document.getElementById('globalDatesContainer');
            const centerContainer = document.getElementById('centerDatesContainer');
            const modalCentersList = document.getElementById('modalCentersList');
            
            if (exam.university === 'baccalaureate' || exam.university === 'bachelor') {
                globalContainer.style.display = 'none';
                centerContainer.style.display = 'block';
                modalCentersList.innerHTML = '';
                
                if (exam.assignments && exam.assignments.length > 0) {
                    exam.assignments.forEach(assign => {
                        addModalCenterAssignment(assign.centerName, assign.startDate, assign.endDate);
                    });
                } else {
                    addModalCenterAssignment();
                }
            } else {
                globalContainer.style.display = 'block';
                centerContainer.style.display = 'none';
                document.getElementById('modalStartDate').value = exam.startDate || '';
                document.getElementById('modalEndDate').value = exam.endDate || '';
            }
            
            document.getElementById('datesModal').style.display = 'flex';
        }

        function addModalCenterAssignment(selectedCenter = '', start = '', end = '') {
            const container = document.getElementById('modalCentersList');
            let optionsHTML = '<option value="" disabled selected>-- اختر السنتر --</option>';
            availableCenters.forEach(c => { 
                optionsHTML += `<option value="${c}" ${c === selectedCenter ? 'selected' : ''}>${c}</option>`; 
            });

            const div = document.createElement('div');
            div.className = 'modal-center-block';
            div.style = "background: rgba(67, 24, 255, 0.03); padding: 12px; border-radius: 12px; border: 1px dashed var(--border-color); margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px;";

            div.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <select class="modal-center-select" style="padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); font-family: 'Cairo'; width: 75%; font-weight: bold;">${optionsHTML}</select>
                    <button type="button" onclick="this.parentElement.parentElement.remove()" style="background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-size: 12px;">🗑️ حذف</button>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label style="font-size: 11px; color: var(--success); font-weight: bold;">يفتح:</label>
                        <input type="datetime-local" class="modal-assign-start" value="${start}" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); font-family: 'Cairo'; font-size: 12px; box-sizing: border-box;">
                    </div>
                    <div style="flex: 1;">
                        <label style="font-size: 11px; color: var(--danger); font-weight: bold;">يغلق:</label>
                        <input type="datetime-local" class="modal-assign-end" value="${end}" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); font-family: 'Cairo'; font-size: 12px; box-sizing: border-box;">
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        function closeModal() {
            document.getElementById('datesModal').style.display = 'none';
        }

        function saveExamDates() {
            const examId = document.getElementById('editingExamId').value;
            const exam = allExams[examId];

            if (exam.university === 'baccalaureate' || exam.university === 'bachelor') {
                const assignBlocks = document.querySelectorAll('.modal-center-block');
                let newAssignments = [];
                let isValid = true;
                
                assignBlocks.forEach(block => {
                    const centerName = block.querySelector('.modal-center-select').value;
                    const cStart = block.querySelector('.modal-assign-start').value;
                    const cEnd = block.querySelector('.modal-assign-end').value;

                    if (!centerName) isValid = false;
                    
                    if (cStart && cEnd && new Date(cStart) >= new Date(cEnd)) {
                        isValid = false;
                    }

                    newAssignments.push({ centerName: centerName, startDate: cStart || "", endDate: cEnd || "" });
                });

                if (!isValid) return;

                database.ref(`exams/${examId}/assignments`).set(newAssignments).then(() => {
                    closeModal();
                });

            } else {
                const sDate = document.getElementById('modalStartDate').value;
                const eDate = document.getElementById('modalEndDate').value;

                if(sDate && eDate && new Date(sDate) >= new Date(eDate)) {
                    return;
                }

                database.ref(`exams/${examId}/startDate`).set(sDate);
                database.ref(`exams/${examId}/endDate`).set(eDate).then(() => {
                    closeModal();
                });
            }
        }
    </script>
</body>
</html>
