<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الامتحانات والأرشيف - المنصة التعليمية</title>
    
    <!-- إعدادات تطبيق الويب (PWA) -->
    <link rel="manifest" href="../manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4318FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="المنصة التعليمية">
    <link rel="apple-touch-icon" href="../images/logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- استدعاء فايربيز -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root {
            --primary: #4318FF;
            --secondary: #a3aed1;
            --success: #05CD99;
            --danger: #EE5D50;
            --warning: #ffce20;
            --dark-text: #2b3674;
            --bg-light: #f4f7fe;
            --card-bg: #ffffff;
            --border-color: #e0e5f2;
            --sidebar-width: 280px;
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background: var(--bg-light); 
            color: var(--dark-text); 
            margin: 0; 
            display: flex;
            overflow-x: hidden;
        }

        /* تصميم القائمة الجانبية المحدث */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--card-bg);
            height: 100vh;
            position: fixed;
            right: 0;
            top: 0;
            box-shadow: -5px 0 25px rgba(0,0,0,0.03);
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h3 { text-align: center; color: var(--primary); font-size: 22px; margin-bottom: 30px; }
        .sidebar ul { list-style: none; padding: 0; margin: 0; }
        .sidebar ul li { margin-bottom: 8px; }
        .sidebar ul li a {
            display: flex; align-items: center; gap: 10px; padding: 15px 20px; 
            text-decoration: none; color: var(--secondary); font-weight: 700; 
            border-radius: 15px; transition: all 0.3s ease; font-size: 16px;
        }
        .sidebar ul li a:hover, .sidebar ul li a.active { 
            background: var(--primary); color: white; box-shadow: 0 8px 20px rgba(67, 24, 255, 0.25); 
        }

        /* المحتوى الرئيسي */
        .main-content {
            flex: 1;
            margin-right: var(--sidebar-width);
            padding: 30px;
            transition: margin 0.4s ease;
            width: 100%;
            box-sizing: border-box;
        }

        /* زر القائمة للموبايل */
        .menu-toggle-btn {
            display: none; background: var(--primary); color: white; border: none; 
            padding: 10px 15px; border-radius: 12px; font-size: 20px; 
            cursor: pointer; box-shadow: 0 5px 15px rgba(67, 24, 255, 0.2);
        }

        .header-actions {
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 30px; flex-wrap: wrap; gap: 15px;
        }

        .tabs-container {
            display: flex; gap: 15px; margin-bottom: 30px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            background: transparent; border: none; padding: 12px 25px; font-size: 16px; font-weight: 800;
            color: var(--secondary); cursor: pointer; transition: 0.3s; border-radius: 12px; font-family: 'Cairo';
            flex: 1; text-align: center; min-width: 150px;
        }
        
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 5px 15px rgba(67, 24, 255, 0.2); }
        .tab-btn:hover:not(.active) { background: rgba(67, 24, 255, 0.05); color: var(--primary); }

        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .exams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }

        .exam-card {
            background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid var(--border-color);
            box-shadow: 0 5px 20px rgba(0,0,0,0.03); transition: 0.3s; position: relative;
        }
        .exam-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 12px 30px rgba(67,24,255,0.1); }

        .exam-card h3 { margin: 0 0 15px 0; color: var(--primary); font-size: 20px; line-height: 1.4; }
        .exam-card p { margin: 8px 0; font-size: 14px; font-weight: 700; color: var(--secondary); display: flex; justify-content: space-between; align-items: center;}
        .exam-card p strong { color: var(--dark-text); }

        .badge { padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 800; }
        .badge-target { background: rgba(67, 24, 255, 0.1); color: var(--primary); margin-bottom: 15px; display: inline-block; }
        
        .actions-row { display: flex; gap: 8px; margin-top: 20px; padding-top: 15px; border-top: 1px dashed var(--border-color); flex-wrap: wrap; }
        
        .btn-small {
            flex: 1; min-width: 80px; padding: 10px; border: none; border-radius: 12px; font-family: 'Cairo'; font-weight: 800; font-size: 13px;
            cursor: pointer; transition: 0.3s; text-align: center;
        }
        .btn-edit { background: rgba(255, 206, 32, 0.15); color: #c29d00; }
        .btn-edit:hover { background: var(--warning); color: white; }
        .btn-print { background: rgba(67, 24, 255, 0.1); color: var(--primary); }
        .btn-print:hover { background: var(--primary); color: white; }
        .btn-archive { background: rgba(163, 174, 209, 0.2); color: var(--secondary); }
        .btn-archive:hover { background: var(--secondary); color: white; }
        .btn-restore { background: rgba(5, 205, 153, 0.15); color: var(--success); }
        .btn-restore:hover { background: var(--success); color: white; }
        .btn-delete { background: rgba(238, 93, 80, 0.1); color: var(--danger); }
        .btn-delete:hover { background: var(--danger); color: white; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6);
            display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(5px);
        }
        .modal-box {
            background: var(--card-bg); padding: 30px; border-radius: 24px; width: 90%; max-width: 500px;
            max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.2); animation: scaleUp 0.3s ease;
        }
        @keyframes scaleUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 800; margin-bottom: 8px; color: var(--dark-text); }
        .form-group input, .form-group select {
            width: 100%; padding: 14px; border: 2px solid var(--border-color); border-radius: 14px;
            font-family: 'Cairo'; font-size: 15px; outline: none; transition: 0.3s; box-sizing: border-box; background: var(--bg-light);
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); background: white; }

        .modal-actions { display: flex; gap: 15px; margin-top: 30px; }
        .btn-save { background: var(--primary); color: white; flex: 2; padding: 14px; border: none; border-radius: 14px; font-weight: 800; font-size: 16px; font-family: 'Cairo'; cursor: pointer; transition: 0.3s;}
        .btn-save:hover { box-shadow: 0 8px 20px rgba(67, 24, 255, 0.3); transform: translateY(-2px); }
        .btn-cancel { background: #f0f0f0; color: #555; flex: 1; padding: 14px; border: none; border-radius: 14px; font-weight: 800; font-size: 16px; font-family: 'Cairo'; cursor: pointer; transition: 0.3s;}
        .btn-cancel:hover { background: #e4e4e4; }

        /* الشاشات المتوسطة والصغيرة (الموبايل) */
        @media (max-width: 992px) {
            .sidebar { transform: translateX(100%); } /* إخفاء القائمة الجانبية */
            .sidebar.active { transform: translateX(0); } /* إظهارها عند الضغط */
            .main-content { margin-right: 0; padding: 15px; }
            .menu-toggle-btn { display: flex; align-items: center; gap: 8px; }
            .exams-grid { grid-template-columns: 1fr; } /* كارت واحد في الصف للموبايل */
            .header-actions h2 { font-size: 20px; margin: 0; }
            
            /* خلفية سوداء شفافة لما المنيو تفتح ع الموبايل */
            .sidebar-overlay {
                display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.5); z-index: 999; backdrop-filter: blur(3px);
            }
            .sidebar-overlay.active { display: block; }
        }
    </style>
</head>
<body>

    <script>
        const savedColor = localStorage.getItem('primaryColor') || "#4318FF";
        document.documentElement.style.setProperty('--primary', savedColor);
    </script>

    <!-- غطاء الشاشة للموبايل عند فتح القائمة -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <h3>👨‍🏫 لوحة الإدارة</h3>
        <ul>
            <li><a href="index.html">🏠 الرئيسية والإحصائيات</a></li>
            <li><a href="add_exam.html">📝 بناء امتحان جديد</a></li>
            <li><a href="manage_exams.html" class="active">📂 إدارة الامتحانات</a></li>
            <li><a href="center_report.html">📊 تقارير الدرجات</a></li>
            <li><a href="manage_students.html">👥 إدارة الطلاب</a></li>
            <li><a href="settings.html">⚙️ إعدادات المنصة</a></li>
            <li><a href="../auth/login.html" style="color: var(--danger); margin-top: 20px; background: rgba(238,93,80,0.05);">🚪 تسجيل الخروج</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header-actions">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="menu-toggle-btn" onclick="toggleSidebar()">☰ القائمة</button>
                <h2>📂 إدارة الامتحانات والأرشيف</h2>
            </div>
            <button onclick="window.location.href='add_exam.html'" class="tab-btn active" style="font-size: 15px; padding: 12px 25px; flex: none;">➕ امتحان جديد</button>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('activeExams')">🟢 الامتحانات النشطة</button>
            <button class="tab-btn" onclick="switchTab('archivedExams')">📦 الأرشيف</button>
        </div>

        <div id="activeExams" class="tab-content active">
            <div class="exams-grid" id="activeGrid">
                <p style="color: var(--secondary); font-weight: 700; text-align: center; width: 100%;">جاري تحميل الامتحانات...</p>
            </div>
        </div>

        <div id="archivedExams" class="tab-content">
            <div class="exams-grid" id="archiveGrid"></div>
        </div>
    </div>

    <div class="modal-overlay" id="datesModal">
        <div class="modal-box">
            <h3 style="color: var(--primary); margin-top: 0;">📅 جدولة الامتحان</h3>
            <p style="color: var(--secondary); font-size: 14px; font-weight: 600; margin-bottom: 25px;">حدد متى يظهر الامتحان للطلاب ومتى يختفي</p>
            
            <input type="hidden" id="editingExamId">
            
            <div id="globalDatesContainer">
                <div class="form-group">
                    <label>تاريخ ووقت الفتح (البداية):</label>
                    <input type="datetime-local" id="modalStartDate">
                </div>
                
                <div class="form-group">
                    <label>تاريخ ووقت الإغلاق (النهاية):</label>
                    <input type="datetime-local" id="modalEndDate">
                </div>
            </div>

            <div id="centerDatesContainer" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <label style="margin: 0; font-weight: 800; color: var(--primary);">مواعيد السناتر:</label>
                    <button class="btn-small" style="background: var(--primary); color: white; padding: 8px 15px;" onclick="addModalCenterAssignment()">➕ إضافة سنتر</button>
                </div>
                <div id="modalCentersList"></div>
            </div>

            <div class="modal-actions">
                <button class="btn-save" onclick="saveExamDates()">💾 حفظ التعديلات</button>
                <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // إعدادات فايربيز (تأكد من صحتها بمشروعك)
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allExams = {};
        let availableCenters = [];

        const uniTranslations = {
            'alex_uni': 'الإسكندرية', 'damanhour_uni': 'دمنهور', 
            'bachelor': 'بكالوريا', 'baccalaureate': 'بكالوريا'
        };
        const gradeTranslations = { 'year_1': 'فرقة 1', 'year_2': 'فرقة 2', 'year_3': 'فرقة 3', 'year_4': 'فرقة 4' };

        window.onload = () => {
            database.ref('centers').once('value').then(snapshot => {
                if (snapshot.exists()) {
                    const centers = snapshot.val();
                    availableCenters = Array.isArray(centers) ? centers : Object.values(centers);
                }
            });

            database.ref('exams').on('value', snapshot => {
                allExams = snapshot.val() || {};
                renderExams();
            });
        };

        // دالة لفتح وإغلاق القائمة الجانبية في الموبايل
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function formatDateTime(isoString) {
            if(!isoString) return "غير محدد";
            const d = new Date(isoString);
            return d.toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' });
        }

        function renderExams() {
            const activeGrid = document.getElementById('activeGrid');
            const archiveGrid = document.getElementById('archiveGrid');
            activeGrid.innerHTML = ''; archiveGrid.innerHTML = '';

            let activeCount = 0, archiveCount = 0;
            const examsArray = Object.keys(allExams).map(key => ({ id: key, ...allExams[key] })).reverse();

            examsArray.forEach(exam => {
                let targetText = uniTranslations[exam.university] || exam.university;
                if(exam.university === 'baccalaureate' || exam.university === 'bachelor') {
                    if (exam.center === 'multiple') {
                        targetText += ` - متعدد السناتر`;
                    } else {
                        targetText += ` - ${exam.center === 'all' ? 'كل السناتر' : exam.center}`;
                    }
                } else {
                    targetText += ` - ${gradeTranslations[exam.grade] || exam.grade}`;
                }

                let datesDisplay = '';
                if (exam.university === 'baccalaureate' || exam.university === 'bachelor') {
                    datesDisplay = `<p style="margin:0; font-size:13px; color:var(--primary); font-weight:bold; text-align:center; display:block;">مواعيد مخصصة للسناتر 📅</p>`;
                } else {
                    datesDisplay = `
                        <p style="margin:0 0 8px 0; font-size:13px;">يفتح: <strong style="color:var(--success);">${formatDateTime(exam.startDate)}</strong></p>
                        <p style="margin:0; font-size:13px;">يُغلق: <strong style="color:var(--danger);">${formatDateTime(exam.endDate)}</strong></p>
                    `;
                }

                let cardHTML = `
                    <div class="exam-card">
                        <span class="badge badge-target">${targetText}</span>
                        <h3>📝 ${exam.name}</h3>
                        <p>مدة الامتحان: <strong>${exam.duration} دقيقة</strong></p>
                        <p>الدرجة النهائية: <strong>${exam.totalScore || exam.totalQuestions || '--'} درجة</strong></p>
                        
                        <div style="background: var(--bg-light); padding: 15px; border-radius: 12px; margin-top: 15px;">
                            ${datesDisplay}
                        </div>
                        
                        <div class="actions-row">
                            <button class="btn-small btn-edit" onclick="openModal('${exam.id}')">📅 المواعيد</button>
                            <button class="btn-small btn-print" onclick="printExam('${exam.id}')">🖨️ طباعة</button>
                `;

                if (exam.isArchived) {
                    cardHTML += `
                            <button class="btn-small btn-restore" onclick="toggleArchive('${exam.id}', false)">🔙 استعادة</button>
                            <button class="btn-small btn-delete" onclick="deleteExam('${exam.id}')">🗑️ حذف</button>
                        </div></div>`;
                    archiveGrid.innerHTML += cardHTML;
                    archiveCount++;
                } else {
                    cardHTML += `
                            <button class="btn-small btn-archive" onclick="toggleArchive('${exam.id}', true)">📦 أرشفة</button>
                            <button class="btn-small btn-delete" onclick="deleteExam('${exam.id}')">🗑️ حذف</button>
                        </div></div>`;
                    activeGrid.innerHTML += cardHTML;
                    activeCount++;
                }
            });

            if (activeCount === 0) activeGrid.innerHTML = '<p style="color:var(--secondary); font-weight:700; grid-column: 1/-1; text-align:center;">لا توجد امتحانات نشطة حاليا</p>';
            if (archiveCount === 0) archiveGrid.innerHTML = '<p style="color:var(--secondary); font-weight:700; grid-column: 1/-1; text-align:center;">الأرشيف فارغ</p>';
        }

     // دالة الطباعة باستخدام مسار المشروع الداخلي عبر نافذة مخفية (Iframe)
        function printExam(examId) {
            const exam = allExams[examId];
            if (!exam) return;

            // مسار اللوجو العادي جداً جوه ملفات مشروعك
            const logoPath = '../images/logo.png'; 

            // إنشاء نافذة وهمية مخفية جوه نفس الصفحة بدل فتح تاب جديد
            let iframe = document.getElementById('print-iframe');
            if (!iframe) {
                iframe = document.createElement('iframe');
                iframe.id = 'print-iframe';
                // إخفاء النافذة تماماً عشان متأثرش على شكل المنصة
                iframe.style.position = 'absolute';
                iframe.style.width = '0';
                iframe.style.height = '0';
                iframe.style.border = 'none';
                document.body.appendChild(iframe);
            }

            let html = `
                <html lang="ar" dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <title>طباعة امتحان: ${exam.name}</title>
                    <style>
                        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
                        
                        * {
                            -webkit-print-color-adjust: exact !important;
                            print-color-adjust: exact !important;
                            color-adjust: exact !important;
                        }

                        :root {
                            --primary: #4318FF;
                            --secondary: #a3aed1;
                            --dark-text: #2b3674;
                            --bg-light: #f4f7fe;
                        }

                        body { 
                            font-family: 'Cairo', sans-serif; 
                            padding: 40px; 
                            color: var(--dark-text); 
                            direction: rtl; 
                            max-width: 800px; 
                            margin: auto; 
                            position: relative; 
                            min-height: 100vh;
                        }

                        /* العلامة المائية تستخدم مسار الصورة المباشر */
                        body::before {
                            content: "";
                            position: fixed;
                            top: 50%;
                            left: 50%;
                            transform: translate(-50%, -50%);
                            width: 60%;
                            height: 60%;
                            background-image: url('${logoPath}');
                            background-size: contain;
                            background-repeat: no-repeat;
                            background-position: center;
                            opacity: 0.08; 
                            z-index: -1;
                            pointer-events: none;
                        }

                        .header { 
                            text-align: center; 
                            border-bottom: 3px solid var(--primary); 
                            padding-bottom: 20px; 
                            margin-bottom: 35px; 
                        }
                        
                        .header-logo {
                            width: 100px;
                            height: auto;
                            margin-bottom: 15px;
                        }
                        
                        .header h1 { 
                            margin: 0 0 15px 0; 
                            font-size: 32px; 
                            color: var(--primary);
                            font-weight: 800;
                        }
                        
                        .header-info {
                            background: var(--bg-light);
                            color: var(--primary);
                            padding: 10px 20px;
                            border-radius: 12px;
                            display: inline-block;
                            font-size: 16px;
                            font-weight: 700;
                            border: 1px solid rgba(67, 24, 255, 0.1);
                        }

                        .question-block { 
                            margin-bottom: 35px; 
                            page-break-inside: avoid; 
                            background: transparent;
                        }

                        .question-title { 
                            font-size: 20px; 
                            font-weight: 800; 
                            margin-bottom: 15px;
                            color: var(--dark-text);
                            line-height: 1.6;
                        }
                        
                        .question-number {
                            color: var(--primary);
                            background: rgba(67, 24, 255, 0.1);
                            padding: 2px 10px;
                            border-radius: 8px;
                            margin-left: 8px;
                        }

                        .options-list { 
                            list-style-type: none; 
                            padding: 0; 
                            margin: 0; 
                        }
                        
                        .options-list li { 
                            margin-bottom: 12px; 
                            font-size: 17px; 
                            display: flex; 
                            align-items: center; 
                            font-weight: 600;
                            color: #444;
                        }

                        .options-list li::before { 
                            content: ""; 
                            display: inline-block; 
                            width: 16px; 
                            height: 16px; 
                            border: 2px solid var(--primary);
                            background: rgba(67, 24, 255, 0.05);
                            border-radius: 50%; 
                            margin-left: 12px; 
                        }

                        .essay-space { 
                            border: 2px dashed var(--secondary); 
                            background: rgba(244, 247, 254, 0.7); 
                            border-radius: 15px; 
                            height: 150px; 
                            margin-top: 15px; 
                        }

                        @media print {
                            body { padding: 10px 20px; }
                        }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <!-- اللوجو الرئيسي باستخدام مسار المشروع -->
                        <img src="${logoPath}" alt="لوجو المنصة" class="header-logo" id="mainLogo">
                        
                        <h1>${exam.name}</h1>
                        <div class="header-info">
                            مدة الامتحان: ${exam.duration} دقيقة &nbsp;&nbsp;|&nbsp;&nbsp; الدرجة النهائية: ${exam.totalScore || exam.totalQuestions || '--'} درجة
                        </div>
                    </div>
            `;

            if (exam.questions && Array.isArray(exam.questions) && exam.questions.length > 0) {
                exam.questions.forEach((q, index) => {
                    let questionTitle = q.questionText || 'سؤال بدون عنوان';
                    
                    html += `
                        <div class="question-block">
                            <div class="question-title"><span class="question-number">${index + 1}</span> ${questionTitle}</div>
                    `;
                    
                    if (q.options && Array.isArray(q.options)) {
                        html += `<ul class="options-list">`;
                        q.options.forEach(opt => {
                            html += `<li>${opt}</li>`;
                        });
                        html += `</ul>`;
                    } 
                    else if (q.type === 'essay') {
                        html += `<div class="essay-space"></div>`;
                    }
                    
                    html += `</div>`;
                });
            } else {
                html += `<p style="text-align: center; font-size: 20px; font-weight: bold; color: var(--secondary);">لا توجد أسئلة مسجلة في هذا الامتحان.</p>`;
            }

            html += `
                    <script>
                        window.onload = function() {
                            const logo = document.getElementById('mainLogo');
                            if (logo.complete) {
                                window.print();
                            } else {
                                logo.onload = function() { window.print(); };
                                logo.onerror = function() { window.print(); }; 
                            }
                        }
                    <\/script>
                </body>
                </html>
            `;

            // كتابة الكود جوه النافذة المخفية وتشغيل الطباعة منها
            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(html);
            doc.close();
        }
        

        function toggleArchive(examId, status) {
            database.ref(`exams/${examId}/isArchived`).set(status);
        }

        function deleteExam(examId) {
            if(confirm('هل أنت متأكد من حذف الامتحان نهائياً؟')) {
                database.ref(`exams/${examId}`).remove();
            }
        }

        function openModal(examId) {
            const exam = allExams[examId];
            document.getElementById('editingExamId').value = examId;
            
            const globalContainer = document.getElementById('globalDatesContainer');
            const centerContainer = document.getElementById('centerDatesContainer');
            const modalCentersList = document.getElementById('modalCentersList');
            
            if (exam.university === 'baccalaureate' || exam.university === 'bachelor') {
                globalContainer.style.display = 'none';
                centerContainer.style.display = 'block';
                modalCentersList.innerHTML = '';
                
                if (exam.assignments && exam.assignments.length > 0) {
                    exam.assignments.forEach(assign => {
                        addModalCenterAssignment(assign.centerName, assign.startDate, assign.endDate);
                    });
                } else {
                    addModalCenterAssignment();
                }
            } else {
                globalContainer.style.display = 'block';
                centerContainer.style.display = 'none';
                document.getElementById('modalStartDate').value = exam.startDate || '';
                document.getElementById('modalEndDate').value = exam.endDate || '';
            }
            
            document.getElementById('datesModal').style.display = 'flex';
        }

        function addModalCenterAssignment(selectedCenter = '', start = '', end = '') {
            const container = document.getElementById('modalCentersList');
            let optionsHTML = '<option value="" disabled selected>-- اختر السنتر --</option>';
            availableCenters.forEach(c => { 
                optionsHTML += `<option value="${c}" ${c === selectedCenter ? 'selected' : ''}>${c}</option>`; 
            });

            const div = document.createElement('div');
            div.className = 'modal-center-block';
            div.style = "background: rgba(67, 24, 255, 0.03); padding: 15px; border-radius: 15px; border: 1px dashed var(--border-color); margin-bottom: 15px; display: flex; flex-direction: column; gap: 15px;";

            div.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                    <select class="modal-center-select" style="padding: 10px; border-radius: 10px; border: 1px solid var(--border-color); font-family: 'Cairo'; flex: 1; font-weight: bold;">${optionsHTML}</select>
                    <button type="button" onclick="this.parentElement.parentElement.remove()" style="background: rgba(238,93,80,0.1); color: var(--danger); border: none; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; transition: 0.3s;">🗑️ حذف</button>
                </div>
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 140px;">
                        <label style="font-size: 12px; color: var(--success); font-weight: bold; display: block; margin-bottom: 5px;">يفتح:</label>
                        <input type="datetime-local" class="modal-assign-start" value="${start}" style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border-color); font-family: 'Cairo'; font-size: 13px; box-sizing: border-box;">
                    </div>
                    <div style="flex: 1; min-width: 140px;">
                        <label style="font-size: 12px; color: var(--danger); font-weight: bold; display: block; margin-bottom: 5px;">يغلق:</label>
                        <input type="datetime-local" class="modal-assign-end" value="${end}" style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border-color); font-family: 'Cairo'; font-size: 13px; box-sizing: border-box;">
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        function closeModal() {
            document.getElementById('datesModal').style.display = 'none';
        }

        function saveExamDates() {
            const examId = document.getElementById('editingExamId').value;
            const exam = allExams[examId];

            if (exam.university === 'baccalaureate' || exam.university === 'bachelor') {
                const assignBlocks = document.querySelectorAll('.modal-center-block');
                let newAssignments = [];
                let isValid = true;
                
                assignBlocks.forEach(block => {
                    const centerName = block.querySelector('.modal-center-select').value;
                    const cStart = block.querySelector('.modal-assign-start').value;
                    const cEnd = block.querySelector('.modal-assign-end').value;

                    if (!centerName) isValid = false;
                    if (cStart && cEnd && new Date(cStart) >= new Date(cEnd)) isValid = false;

                    newAssignments.push({ centerName: centerName, startDate: cStart || "", endDate: cEnd || "" });
                });

                if (!isValid) {
                    alert('الرجاء التأكد من اختيار السنتر وأن تاريخ الإغلاق بعد تاريخ الفتح.');
                    return;
                }

                database.ref(`exams/${examId}/assignments`).set(newAssignments).then(() => closeModal());

            } else {
                const sDate = document.getElementById('modalStartDate').value;
                const eDate = document.getElementById('modalEndDate').value;

                if(sDate && eDate && new Date(sDate) >= new Date(eDate)) {
                    alert('تاريخ الإغلاق يجب أن يكون بعد تاريخ الفتح.');
                    return;
                }

                database.ref(`exams/${examId}/startDate`).set(sDate);
                database.ref(`exams/${examId}/endDate`).set(eDate).then(() => closeModal());
            }
        }
    </script>
</body>
</html>
