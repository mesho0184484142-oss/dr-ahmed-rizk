<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلاب - منصة د. أحمد رزق</title>
    <!-- استدعاء الخطوط وتنسيقات لوحة التحكم الأساسية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        .search-container {
            position: relative;
            margin-bottom: 30px;
        }

        .search-box { 
            width: 100%; 
            padding: 18px 50px 18px 20px; 
            border-radius: 15px; 
            border: 2px solid var(--border-color); 
            font-size: 16px; 
            font-family: 'Cairo', sans-serif; 
            font-weight: 600;
            color: var(--dark-text);
            background: var(--card-bg);
            outline: none; 
            transition: all 0.3s ease; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            box-sizing: border-box;
        }

        .search-box:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1); 
        }

        .search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: var(--secondary);
            pointer-events: none;
        }

        /* 🚀 حل مشكلة الجدول في الموبايل */
        .table-responsive {
            width: 100%;
            overflow-x: auto; /* السماح بالتمرير الأفقي */
            -webkit-overflow-scrolling: touch; /* تمرير سلس في الموبايل */
            border-radius: 15px; /* للحفاظ على انحناء الحواف */
        }

        /* ضمان عدم تداخل الأعمدة في الموبايل */
        table {
            min-width: 650px; 
        }

        .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 800;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
            box-shadow: 0 5px 10px rgba(238, 93, 80, 0.2);
            white-space: nowrap; /* يمنع الزر من الانقسام لسطرين */
        }

        .delete-btn:hover {
            background: #d94b3e;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(238, 93, 80, 0.3);
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <h3>👨‍🏫 منصة د. أحمد رزق</h3>
        <ul>
            <li><a href="index.html">🏠 الرئيسية والإحصائيات</a></li>
            <li><a href="add_exam.html">📝 رفع امتحان جديد</a></li>
            <li><a href="center_report.html">📊 تقارير السناتر التفصيلية</a></li>
            <li><a href="manage_students.html" class="active">👥 إدارة الطلاب</a></li>
            <li><a href="settings.html">⚙️ إعدادات المنصة</a></li>
            <li><a href="../auth/login.html">🚪 تسجيل الخروج</a></li>
        </ul>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <h2>👥 إدارة بيانات الطلاب</h2>
        
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-box" placeholder="ابحث برقم الهاتف أو اسم الطالب..." oninput="filterStudents()">
        </div>
        
        <div class="card" style="padding: 0;">
            <!-- إضافة الحاوية المسؤولة عن التمرير الأفقي في الموبايل -->
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>الاسم بالكامل</th>
                            <th>رقم الطالب (المعرف)</th>
                            <th>السنتر</th>
                            <th style="text-align: center;">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <tr><td colspan="4" style="text-align:center; padding:30px; color:var(--secondary);">⏳ جاري تحميل بيانات الطلاب...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allStudents = {};

        // جلب الطلاب لحظياً من السيرفر
        database.ref('students').on('value', snapshot => {
            allStudents = snapshot.val() || {};
            const currentSearch = document.getElementById('searchInput').value.trim();
            renderTable(currentSearch);
        });

        function renderTable(searchTerm = "") {
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '';
            
            let hasResults = false;
            const term = searchTerm.toLowerCase();

            for (let phone in allStudents) {
                const st = allStudents[phone];
                const studentName = (st.name || "").toLowerCase();
                
                if (studentName.includes(term) || phone.includes(term)) {
                    hasResults = true;
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${st.name}</strong></td>
                            <td style="color: var(--primary); font-weight: 800; direction: ltr; text-align: right;">${phone}</td>
                            <td>${st.center}</td>
                            <td style="text-align: center;">
                                <button class="delete-btn" onclick="deleteStudent('${phone}', '${st.name}')">🗑️ حذف الطالب</button>
                            </td>
                        </tr>
                    `;
                }
            }

            if (!hasResults) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px; color:var(--danger); font-weight:700;">❌ لا يوجد طالب يطابق عملية البحث.</td></tr>`;
            }
        }

        function filterStudents() {
            const term = document.getElementById('searchInput').value.trim();
            renderTable(term);
        }

        function deleteStudent(phone, name) {
            const confirmDelete = confirm(`⚠️ هل أنت متأكد من حذف الطالب (${name}) نهائياً؟\nسيتم مسح جميع بياناته ونتائجه ولا يمكن التراجع عن هذا الإجراء!`);
            
            if (confirmDelete) {
                database.ref('students/' + phone).remove()
                .then(() => {
                    alert("✅ تم مسح الطالب من النظام بنجاح!");
                })
                .catch(err => {
                    alert("❌ حدث خطأ أثناء الحذف. تأكد من اتصالك بالإنترنت.");
                });
            }
        }
    </script>
</body>
</html>
