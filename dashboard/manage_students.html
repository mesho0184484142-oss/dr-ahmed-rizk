<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلاب - المنصة التعليمية</title>
    <!-- استدعاء الخطوط وتنسيقات لوحة التحكم الأساسية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary: #4318FF;
            --secondary: #a3aed1;
            --success: #05CD99;
            --danger: #EE5D50;
            --warning: #ffce20;
            --dark-text: #2b3674;
            --bg-light: #f4f7fe;
            --card-bg: #ffffff;
            --border-color: #e0e5f2;
        }

        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-light); color: var(--dark-text); }

        /* منطقة البحث والفلاتر */
        .controls-section {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-container {
            flex: 2;
            position: relative;
            min-width: 300px;
        }

        .filter-container {
            flex: 1;
            min-width: 200px;
        }

        .search-box, .filter-box { 
            width: 100%; 
            padding: 16px 20px; 
            border-radius: 15px; 
            border: 2px solid var(--border-color); 
            font-size: 15px; 
            font-family: 'Cairo', sans-serif; 
            font-weight: 700;
            color: var(--dark-text);
            background: var(--card-bg);
            outline: none; 
            transition: all 0.3s ease; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            box-sizing: border-box;
        }

        .search-box { padding-right: 50px; }
        
        .search-box:focus, .filter-box:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1); 
        }

        .search-icon {
            position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
            font-size: 20px; color: var(--secondary); pointer-events: none;
        }

        /* 🚀 حل مشكلة الجدول في الموبايل */
        .table-responsive {
            width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; 
            border-radius: 20px; background: var(--card-bg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid var(--border-color);
        }

        table { width: 100%; border-collapse: collapse; min-width: 800px; text-align: right; }
        th, td { padding: 18px 20px; border-bottom: 1px solid var(--border-color); font-size: 15px; }
        th { background: #f9fbfd; color: var(--secondary); font-weight: 800; }
        tr:hover td { background: #f4f7fe; }

        /* الشارات (Badges) للمرحلة */
        .badge {
            padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 13px; display: inline-block;
        }
        .badge-uni { background: rgba(67, 24, 255, 0.1); color: var(--primary); }
        .badge-bac { background: rgba(5, 205, 153, 0.1); color: var(--success); }

        /* الأزرار */
        .action-btns-group { display: flex; gap: 10px; justify-content: center; }

        .btn-small {
            padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 13px;
            cursor: pointer; transition: 0.3s; border: none; font-family: 'Cairo';
        }
        
        .delete-btn { background: rgba(238, 93, 80, 0.1); color: var(--danger); }
        .delete-btn:hover { background: var(--danger); color: white; transform: translateY(-2px); }

        .pass-btn { background: rgba(255, 206, 32, 0.2); color: #d4a000; }
        .pass-btn:hover { background: var(--warning); color: #fff; transform: translateY(-2px); }

        @media (max-width: 768px) {
            .controls-section { flex-direction: column; }
            .search-container, .filter-container { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <h3>👨‍🏫 لوحة الإدارة</h3>
        <ul>
            <li><a href="index.html">🏠 الرئيسية للإحصائيات</a></li>
            <li><a href="add_exam.html">📝 بناء امتحان جديد</a></li>
            <li><a href="center_report.html">📊 تقارير الدرجات</a></li>
            <li><a href="manage_students.html" class="active">👥 إدارة الطلاب</a></li>
            <li><a href="../auth/login.html">🚪 تسجيل الخروج</a></li>
        </ul>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <h2>👥 إدارة بيانات الطلاب</h2>
        
        <div class="controls-section">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-box" placeholder="ابحث برقم الهاتف أو اسم الطالب..." oninput="filterStudents()">
            </div>
            
            <div class="filter-container">
                <select id="stageFilter" class="filter-box" onchange="filterStudents()">
                    <option value="all">كل المراحل الدراسية</option>
                    <option value="alex_uni">جامعة الإسكندرية</option>
                    <option value="damanhour_uni">جامعة دمنهور</option>
                    <option value="bachelor">بكالوريا</option>
                </select>
            </div>
        </div>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>الاسم بالكامل</th>
                        <th>رقم الهاتف (المعرف)</th>
                        <th>المرحلة الدراسية</th>
                        <th>السنتر التابع له</th>
                        <th style="text-align: center;">إجراءات الإدارة</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr><td colspan="5" style="text-align:center; padding:40px; color:var(--secondary); font-weight:700;">⏳ جاري تحميل بيانات الطلاب من الخادم...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allStudents = {};

        // قواميس الترجمة
        const uniTranslations = {
            'alex_uni': 'جامعة الإسكندرية',
            'damanhour_uni': 'جامعة دمنهور',
            'bachelor': 'بكالوريا',
            'baccalaureate': 'بكالوريا'
        };

        const gradeTranslations = {
            'year_1': 'الفرقة الأولى',
            'year_2': 'الفرقة الثانية',
            'year_3': 'الفرقة الثالثة',
            'year_4': 'الفرقة الرابعة'
        };

        // جلب الطلاب لحظياً من السيرفر
        database.ref('students').on('value', snapshot => {
            allStudents = snapshot.val() || {};
            filterStudents(); // تشغيل الفلترة بعد جلب البيانات
        });

        function filterStudents() {
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
            const stageFilter = document.getElementById('stageFilter').value;
            
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '';
            
            let hasResults = false;

            for (let phone in allStudents) {
                const st = allStudents[phone];
                const studentName = (st.name || "").toLowerCase();
                const studentUni = st.university || "none";
                
                // 1. فلترة المرحلة
                let stageMatch = true;
                if (stageFilter !== 'all') {
                    if (stageFilter === 'bachelor' && (studentUni !== 'bachelor' && studentUni !== 'baccalaureate')) {
                        stageMatch = false;
                    } else if (stageFilter !== 'bachelor' && studentUni !== stageFilter) {
                        stageMatch = false;
                    }
                }

                // 2. فلترة البحث
                let searchMatch = (studentName.includes(searchTerm) || phone.includes(searchTerm));

                if (stageMatch && searchMatch) {
                    hasResults = true;
                    
                    // تنسيق المرحلة
                    let stageBadge = '';
                    let centerDisplay = st.center || "غير محدد";

                    if (studentUni === 'bachelor' || studentUni === 'baccalaureate') {
                        stageBadge = `<span class="badge badge-bac">بكالوريا</span>`;
                    } else if (studentUni === 'alex_uni' || studentUni === 'damanhour_uni') {
                        let uniName = uniTranslations[studentUni];
                        let gradeName = gradeTranslations[st.grade] || st.grade;
                        stageBadge = `<span class="badge badge-uni">${uniName} - ${gradeName}</span>`;
                        centerDisplay = `<span style="color:#a3aed1;">--</span>`; // طالب الجامعة ليس له سنتر
                    } else {
                        stageBadge = `<span class="badge" style="background:#eee;">بيانات قديمة</span>`;
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td><strong style="color:var(--dark-text);">${st.name}</strong></td>
                            <td style="color: var(--primary); font-weight: 800; font-family: monospace; font-size: 16px;">${phone}</td>
                            <td>${stageBadge}</td>
                            <td><strong style="color:#555;">${centerDisplay}</strong></td>
                            <td>
                                <div class="action-btns-group">
                                    <button class="btn-small pass-btn" onclick="showPassword('${st.password}')">🔑 الباسورد</button>
                                    <button class="btn-small delete-btn" onclick="deleteStudent('${phone}', '${st.name}')">🗑️ حذف</button>
                                </div>
                            </td>
                        </tr>
                    `;
                }
            }

            if (!hasResults) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px; color:var(--danger); font-weight:800; font-size: 16px;">❌ لا يوجد طالب يطابق معايير البحث الحالية.</td></tr>`;
            }
        }

        // دالة كشف الباسورد
        function showPassword(pass) {
            alert(`🔑 الرقم السري الخاص بالطالب هو:\n\n${pass}`);
        }

        function deleteStudent(phone, name) {
            const confirmDelete = confirm(`⚠️ تنبيه أمني:\nهل أنت متأكد من حذف الطالب (${name}) نهائياً؟\nسيتم مسح جميع بياناته ونتائجه ولا يمكن التراجع عن هذا الإجراء!`);
            
            if (confirmDelete) {
                database.ref('students/' + phone).remove()
                .then(() => {
                    alert("✅ تم مسح بيانات الطالب من النظام بنجاح.");
                })
                .catch(err => {
                    alert("❌ حدث خطأ أثناء الحذف. تأكد من اتصالك بالإنترنت.");
                });
            }
        }
    </script>
</body>
</html>
