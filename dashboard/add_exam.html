<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع امتحان جديد - لوحة التحكم</title>
    <!-- استدعاء الخطوط وتنسيقات لوحة التحكم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* =========================================
           تنسيقات احترافية لصفحة بناء الامتحانات 
           ========================================= */
        :root {
            --card-bg: #ffffff;
            --bg-light: #f4f7fe;
            --border-color: #e0e5f2;
            --primary: #4318FF;
            --secondary: #a3aed1;
            --success: #05CD99;
            --danger: #EE5D50;
            --dark-text: #2b3674;
            --warning: #ffce20;
        }

        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-light); color: var(--dark-text); }

        .form-container { 
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
            margin-bottom: 30px; 
            border: 1px solid var(--border-color);
        }

        .form-group { margin-bottom: 20px; transition: all 0.3s; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 15px; }
        .form-group input, .form-group select { 
            width: 100%; padding: 14px; border: 1.5px solid var(--border-color); 
            border-radius: 12px; font-family: 'Cairo'; font-size: 15px; background: #fcfcfc; transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); outline: none; }

        /* الحقول المخفية ديناميكياً */
        .dynamic-field { display: none; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* ترويسة الأسئلة وأزرار الإضافة */
        .questions-header { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--bg-light); padding-bottom: 15px; 
            margin-bottom: 25px; margin-top: 40px; flex-wrap: wrap; gap: 15px;
        }
        
        .action-buttons { display: flex; gap: 10px; }
        .btn-add-mcq { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-add-tf { background: var(--secondary); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-add-mcq:hover { background: #3210cc; }
        .btn-add-tf:hover { background: #8291be; }

        /* كارت السؤال */
        .question-card { 
            background: #fdfdfe; border: 2px solid var(--border-color); padding: 25px; 
            border-radius: 15px; margin-bottom: 25px; transition: all 0.3s ease;
            position: relative;
        }
        .question-card:hover { border-color: var(--primary); box-shadow: 0 5px 20px rgba(67, 24, 255, 0.05); }

        .question-header-row { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px dashed var(--border-color); padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
        }
        
        .q-title { font-size: 18px; font-weight: 800; color: var(--primary); margin: 0; display: flex; align-items: center; gap: 10px; }
        .q-badge { background: var(--bg-light); color: var(--dark-text); font-size: 13px; padding: 4px 10px; border-radius: 6px; font-weight: 600;}
        
        .q-controls { display: flex; align-items: center; gap: 15px; }
        .q-score-wrapper { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
        .q-score-input { width: 70px; padding: 8px; border: 2px solid var(--border-color); border-radius: 8px; text-align: center; font-weight: bold; color: var(--primary); }
        
        .delete-q-btn { background: rgba(238, 93, 80, 0.1); color: var(--danger); border: none; padding: 8px 15px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .delete-q-btn:hover { background: var(--danger); color: white; }

        .q-text-input { width: 100%; padding: 15px; border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 20px; font-family: 'Cairo'; font-weight: 600; font-size: 16px; outline: none; }
        .q-text-input:focus { border-color: var(--primary); }

        /* شبكة الخيارات */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .options-grid.tf-grid { grid-template-columns: 1fr 1fr; } /* لأسئلة صح وغلط */

        .option-item { 
            display: flex; align-items: center; gap: 15px; background: var(--bg-light); 
            padding: 12px 20px; border-radius: 12px; border: 2px solid transparent; transition: 0.3s;
        }
        .option-item.correct-selected { border-color: var(--success); background: #f4fff9; }

        .option-item input[type="radio"] { width: 22px; height: 22px; accent-color: var(--success); cursor: pointer; }
        .option-item input[type="text"] { flex: 1; border: none; outline: none; background: transparent; font-family: 'Cairo'; font-weight: 600; font-size: 15px; color: var(--dark-text); }
        .option-item input[type="text"]:read-only { color: var(--primary); font-weight: 800; cursor: default; }

        /* زر النشر */
        .submit-btn { width: 100%; background: var(--success); color: white; font-size: 18px; font-weight: 800; padding: 18px; border: none; border-radius: 15px; cursor: pointer; transition: 0.3s; margin-top: 20px; font-family: 'Cairo'; }
        .submit-btn:hover { background: #04b082; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(5, 205, 153, 0.2); }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        @media (max-width: 768px) {
            .options-grid { grid-template-columns: 1fr; }
            .questions-header { flex-direction: column; align-items: stretch; }
            .action-buttons { flex-direction: column; }
            .question-header-row { flex-direction: column; align-items: flex-start; }
            .q-controls { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>👨‍🏫 لوحة الإدارة</h3>
        <ul>
            <li><a href="index.html">🏠 الرئيسية للإحصائيات</a></li>
            <li><a href="add_exam.html" class="active">📝 بناء امتحان جديد</a></li>
            <li><a href="center_report.html">📊 تقارير الدرجات</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h2>📝 بناء ورفع امتحان جديد</h2>
        
        <div class="form-container">
            <!-- 1. إعدادات الامتحان والتوجيه -->
            <div class="form-group">
                <label>اسم الامتحان:</label>
                <input type="text" id="examName" placeholder="مثال: امتحان شامل الباب الأول" required>
            </div>

            <div class="form-group">
                <label>تخصيص الامتحان للمرحلة:</label>
                <select id="examUniversity" required onchange="handleTargetChange()">
                    <option value="" disabled selected>-- اختر الجامعة أو المرحلة --</option>
                    <option value="damanhour_uni">جامعة دمنهور</option>
                    <option value="alex_uni">جامعة الإسكندرية</option>
                    <option value="baccalaureate">بكالوريا</option>
                </select>
            </div>

            <!-- يظهر للجامعات فقط -->
            <div class="form-group dynamic-field" id="gradeWrapper">
                <label>الفرقة الدراسية المستهدفة:</label>
                <select id="examGrade">
                    <option value="year_1">الفرقة الأولى</option>
                    <option value="year_2">الفرقة الثانية</option>
                    <option value="year_3">الفرقة الثالثة</option>
                    <option value="year_4">الفرقة الرابعة</option>
                </select>
            </div>

            <!-- يظهر للبكالوريا فقط -->
            <div class="form-group dynamic-field" id="centerWrapper">
                <label>السنتر المستهدف (بكالوريا):</label>
                <select id="examCenter">
                    <option value="all" selected>كل السناتر (عام)</option>
                    <!-- سيتم تعبئة السناتر بالـ JS -->
                </select>
            </div>

            <div class="form-group">
                <label>وقت الامتحان (بالدقائق):</label>
                <input type="number" id="examDuration" min="5" placeholder="مثال: 60" required>
            </div>

            <!-- 2. محرك بناء الأسئلة -->
            <div class="questions-header">
                <h3 style="margin: 0; color: var(--dark-text);">🧩 هيكلة الأسئلة وتوزيع الدرجات</h3>
                <div class="action-buttons">
                    <button type="button" class="btn-add-mcq" onclick="addQuestion('mcq')">➕ سؤال اختياري</button>
                    <button type="button" class="btn-add-tf" onclick="addQuestion('tf')">➕ سؤال صح/خطأ</button>
                </div>
            </div>

            <div id="questionsContainer"></div>

            <button type="button" class="submit-btn" id="publishBtn" onclick="publishExam()">🚀 اعتماد ونشر الامتحان</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform",
            storageBucket: "dr-ahmed-rizk-platform.appspot.com",
            messagingSenderId: "117735726313",
            appId: "1:117735726313:web:2a58aa1c4be7137b53e478"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- 1. إدارة الحقول الديناميكية (الجامعة والفرقة والسنتر) ---
        function handleTargetChange() {
            const uni = document.getElementById('examUniversity').value;
            const gradeWrapper = document.getElementById('gradeWrapper');
            const centerWrapper = document.getElementById('centerWrapper');

            if (uni === 'alex_uni' || uni === 'damanhour_uni') {
                gradeWrapper.style.display = 'block';
                centerWrapper.style.display = 'none';
            } else if (uni === 'baccalaureate') {
                gradeWrapper.style.display = 'none';
                centerWrapper.style.display = 'block';
            }
        }

        // جلب السناتر لحقل البكالوريا
        database.ref('centers').once('value').then(snapshot => {
            if (snapshot.exists()) {
                const centerSelect = document.getElementById('examCenter');
                const centers = snapshot.val();
                const centersArray = Array.isArray(centers) ? centers : Object.values(centers);
                centersArray.forEach(c => { centerSelect.innerHTML += `<option value="${c}">${c}</option>`; });
            }
        });

        // --- 2. محرك الأسئلة المتقدم ---
        let questionCounter = 0;

        function addQuestion(type) {
            questionCounter++;
            const container = document.getElementById('questionsContainer');
            
            let optionsHTML = '';
            let badgeText = '';

            // تصميم سؤال الاختيار من متعدد
            if (type === 'mcq') {
                badgeText = 'اختيار من متعدد';
                optionsHTML = `
                    <div class="options-grid">
                        ${[0, 1, 2, 3].map(i => `
                        <div class="option-item" id="opt-wrap-${questionCounter}-${i}">
                            <input type="radio" name="correct-${questionCounter}" value="${i}" ${i===0?'checked':''} onchange="highlightCorrect(this, ${questionCounter})">
                            <input type="text" class="q-opt" placeholder="الاختيار رقم ${i+1}" required>
                        </div>
                        `).join('')}
                    </div>
                `;
            } 
            // تصميم سؤال الصح والخطأ
            else if (type === 'tf') {
                badgeText = 'صح أو خطأ';
                optionsHTML = `
                    <div class="options-grid tf-grid">
                        <div class="option-item" id="opt-wrap-${questionCounter}-0">
                            <input type="radio" name="correct-${questionCounter}" value="0" checked onchange="highlightCorrect(this, ${questionCounter})">
                            <input type="text" class="q-opt" value="صح" readonly>
                        </div>
                        <div class="option-item" id="opt-wrap-${questionCounter}-1">
                            <input type="radio" name="correct-${questionCounter}" value="1" onchange="highlightCorrect(this, ${questionCounter})">
                            <input type="text" class="q-opt" value="خطأ" readonly>
                        </div>
                    </div>
                `;
            }

            const qCard = document.createElement('div');
            qCard.className = 'question-card';
            qCard.id = `q-card-${questionCounter}`;
            qCard.setAttribute('data-qtype', type);
            
            qCard.innerHTML = `
                <div class="question-header-row">
                    <h4 class="q-title">
                        <span>سؤال <span class="q-num"></span></span>
                        <span class="q-badge">${badgeText}</span>
                    </h4>
                    <div class="q-controls">
                        <div class="q-score-wrapper">
                            الدرجة: <input type="number" class="q-score-input" value="1" min="1" max="100">
                        </div>
                        <button type="button" class="delete-q-btn" onclick="removeQuestion(${questionCounter})">🗑️ مسح</button>
                    </div>
                </div>
                <input type="text" class="q-text-input q-text" placeholder="اكتب نص السؤال بوضوح هنا..." required>
                <p style="margin: 0 0 15px 0; font-size: 14px; color: var(--secondary);">حدد الإجابة الصحيحة بالنقر على الدائرة المجاورة لها:</p>
                ${optionsHTML}
            `;
            
            container.appendChild(qCard);
            updateQuestionNumbers();
            
            // تفعيل التظليل المبدئي
            highlightCorrect(qCard.querySelector('input[type="radio"]:checked'), questionCounter);
        }

        // دالة لتظليل الإجابة الصحيحة بصرياً لتسهيل المراجعة على الدكتور
        function highlightCorrect(radioBtn, qId) {
            const wrappers = document.querySelectorAll(`#q-card-${qId} .option-item`);
            wrappers.forEach(w => w.classList.remove('correct-selected'));
            radioBtn.closest('.option-item').classList.add('correct-selected');
        }

        function removeQuestion(id) {
            const card = document.getElementById(`q-card-${id}`);
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';
                setTimeout(() => { card.remove(); updateQuestionNumbers(); }, 250);
            }
        }

        function updateQuestionNumbers() {
            document.querySelectorAll('.question-card').forEach((card, index) => {
                card.querySelector('.q-num').innerText = index + 1;
            });
        }

        window.onload = () => { addQuestion('mcq'); };

        // --- 3. معالجة البيانات ورفعها (Validation & Upload) ---
        function publishExam() {
            const publishBtn = document.getElementById('publishBtn');
            const name = document.getElementById('examName').value.trim();
            const uni = document.getElementById('examUniversity').value;
            const duration = document.getElementById('examDuration').value;

            if (!name || !uni || !duration) return alert('⚠️ يرجى إكمال بيانات الامتحان الأساسية (الاسم، المرحلة، الوقت).');

            let grade = "none";
            let center = "none";

            if (uni === 'baccalaureate') {
                center = document.getElementById('examCenter').value;
            } else {
                grade = document.getElementById('examGrade').value;
            }

            const qCards = document.querySelectorAll('.question-card');
            if (qCards.length === 0) return alert('⚠️ لا يمكن نشر امتحان فارغ. أضف سؤالاً واحداً على الأقل.');

            let questionsList = [];
            let isValid = true;
            let totalExamScore = 0; // حساب الدرجة النهائية للامتحان

            qCards.forEach((card) => {
                const text = card.querySelector('.q-text').value.trim();
                const score = parseInt(card.querySelector('.q-score-input').value) || 1;
                const qType = card.getAttribute('data-qtype');
                
                const optsInputs = Array.from(card.querySelectorAll('.q-opt'));
                const opts = optsInputs.map(opt => opt.value.trim());
                const correctRadio = card.querySelector('input[type="radio"]:checked');
                
                if (!text || opts.some(o => o === "")) isValid = false;

                questionsList.push({
                    type: qType,
                    questionText: text,
                    options: opts,
                    correctAnswerIndex: parseInt(correctRadio.value),
                    points: score // حفظ وزن السؤال
                });

                totalExamScore += score; // تجميع درجات الامتحان
            });

            if (!isValid) return alert('⚠️ هناك نصوص أسئلة أو اختيارات فارغة. يرجى مراجعتها.');

            publishBtn.innerText = "⏳ جاري تشفير ورفع البيانات...";
            publishBtn.disabled = true;

            const newExamRef = database.ref('exams').push();
            
            const examData = {
                id: newExamRef.key,
                name: name,
                university: uni,
                grade: grade,
                center: center,
                duration: parseInt(duration),
                questions: questionsList,
                totalQuestions: questionsList.length,
                totalScore: totalExamScore, // حفظ الدرجة النهائية
                publishDate: new Date().toLocaleString('ar-EG'),
                status: "active" 
            };

            newExamRef.set(examData).then(() => {
                alert(`🎉 تم رفع الامتحان بنجاح!\nإجمالي الدرجات: ${totalExamScore} درجة.`);
                window.location.href = 'index.html'; 
            }).catch(error => {
                alert('❌ حدث خطأ أثناء الاتصال بالقاعدة. يرجى المحاولة مرة أخرى.');
                publishBtn.innerText = "🚀 اعتماد ونشر الامتحان";
                publishBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
