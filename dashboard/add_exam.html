<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع امتحان جديد - منصة د. أحمد رزق</title>
    <!-- استدعاء الخطوط وتنسيقات لوحة التحكم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* =========================================
           تنسيقات إضافية خاصة بصفحة رفع الامتحان 
           ========================================= */
        .form-container { 
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
            margin-bottom: 30px; 
            border: 1px solid var(--border-color);
        }
        
        .questions-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--bg-light); 
            padding-bottom: 15px; 
            margin-bottom: 25px; 
            margin-top: 50px; 
        }

        .add-q-btn { 
            background: var(--success); 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 12px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            font-family: 'Cairo', sans-serif; 
            box-shadow: 0 5px 15px rgba(5, 205, 153, 0.2);
        }
        .add-q-btn:hover { 
            background: #04b082; 
            transform: translateY(-2px); 
        }
        
        .question-card { 
            background: #fdfdfe; 
            border: 1px solid var(--border-color); 
            padding: 25px; 
            border-radius: 15px; 
            margin-bottom: 25px; 
            position: relative; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .question-card:hover {
            border-color: var(--primary);
        }

        .question-card h4 { 
            margin-top: 0; 
            color: var(--primary); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 18px;
            font-weight: 800;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .delete-q-btn { 
            background: rgba(238, 93, 80, 0.1); 
            color: var(--danger); 
            border: none; 
            padding: 8px 15px; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 700;
            cursor: pointer; 
            font-family: 'Cairo', sans-serif; 
            transition: 0.3s;
        }
        .delete-q-btn:hover {
            background: var(--danger);
            color: white;
        }
        
        .q-input { 
            width: 100%; 
            padding: 15px; 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            margin-bottom: 20px; 
            font-family: 'Cairo', sans-serif; 
            font-weight: 600; 
            font-size: 16px;
            background: var(--card-bg);
            color: var(--dark-text);
            outline: none;
            transition: 0.3s;
        }
        .q-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 24, 255, 0.1);
        }
        
        .options-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
        }

        .option-item { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            background: var(--bg-light); 
            padding: 12px 20px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            transition: 0.3s;
        }
        .option-item:hover, .option-item:focus-within {
            border-color: var(--secondary);
            background: var(--card-bg);
        }

        .option-item input[type="radio"] { 
            width: 22px; 
            height: 22px; 
            accent-color: var(--success); 
            cursor: pointer; 
        }

        .option-item input[type="text"] { 
            flex: 1; 
            border: none; 
            outline: none; 
            background: transparent; 
            font-family: 'Cairo', sans-serif; 
            font-weight: 600; 
            font-size: 15px;
            color: var(--dark-text);
        }

        @media (max-width: 768px) {
            .options-grid { grid-template-columns: 1fr; }
            .questions-header { flex-direction: column; gap: 15px; align-items: stretch; text-align: center; }
            .question-card h4 { flex-direction: column; gap: 15px; align-items: flex-start; }
            .delete-q-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <h3>👨‍🏫 منصة د. أحمد رزق</h3>
        <ul>
            <li><a href="index.html">🏠 الرئيسية والإحصائيات</a></li>
            <li><a href="add_exam.html" class="active">📝 رفع امتحان جديد</a></li>
            <li><a href="center_report.html">📊 تقارير السناتر</a></li>
            <li><a href="settings.html">⚙️ إعدادات المنصة</a></li>
            <li><a href="../auth/login.html">🚪 تسجيل الخروج</a></li>
        </ul>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <h2>📝 إعداد امتحان جديد</h2>
        
        <div class="form-container">
            <!-- الجزء الأول: بيانات الامتحان -->
            <div class="form-group">
                <label>اسم الامتحان:</label>
                <input type="text" id="examName" placeholder="مثال: امتحان الباب الأول - محاسبة مالية" required>
            </div>

            <div class="form-group">
                <label>السنتر المستهدف:</label>
                <select id="examCenter" required>
                    <option value="" disabled selected>جاري تحميل السناتر...</option>
                </select>
            </div>

            <div class="form-group">
                <label>وقت الامتحان (بالدقائق):</label>
                <input type="number" id="examDuration" min="5" placeholder="مثال: 60" required>
            </div>

            <!-- الجزء الثاني: أداة بناء الأسئلة -->
            <div class="questions-header">
                <h3 style="margin: 0; color: var(--dark-text);">أسئلة الامتحان</h3>
                <button type="button" class="add-q-btn" onclick="addQuestion()">➕ إضافة سؤال جديد</button>
            </div>

            <div id="questionsContainer">
                <!-- الأسئلة سيتم إضافتها هنا برمجياً -->
            </div>

            <button type="button" class="submit-btn" id="publishBtn" onclick="publishExam()">🚀 نشر الامتحان الآن</button>
        </div>
    </div>

    <!-- أكواد فايربيز والمنطق البرمجي -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform",
            storageBucket: "dr-ahmed-rizk-platform.appspot.com",
            messagingSenderId: "117735726313",
            appId: "1:117735726313:web:2a58aa1c4be7137b53e478"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 1. جلب السناتر من السيرفر
        database.ref('centers').once('value').then(snapshot => {
            const centers = snapshot.val() || ["سنتر ألفا", "سنتر المجد"];
            const centerSelect = document.getElementById('examCenter');
            centerSelect.innerHTML = '<option value="all">كل السناتر</option>';
            centers.forEach(center => {
                centerSelect.innerHTML += `<option value="${center}">${center}</option>`;
            });
        });

        // 2. أداة بناء الأسئلة ديناميكياً
        let questionCounter = 0; // لضمان عدم تكرار الـ ID أبداً حتى بعد المسح

        function addQuestion() {
            questionCounter++;
            const container = document.getElementById('questionsContainer');
            
            const questionHTML = `
                <div class="question-card" id="q-card-${questionCounter}">
                    <h4>
                        <span>السؤال رقم <span class="q-num"></span></span>
                        <button type="button" class="delete-q-btn" onclick="removeQuestion(${questionCounter})">🗑️ حذف السؤال</button>
                    </h4>
                    <input type="text" class="q-input q-text" placeholder="اكتب نص السؤال هنا بوضوح..." required>
                    
                    <p style="margin: 0 0 15px 0; font-size: 15px; color: var(--secondary); font-weight: 700;">اختر الدائرة بجوار الإجابة الصحيحة:</p>
                    <div class="options-grid">
                        <div class="option-item">
                            <input type="radio" name="correct-${questionCounter}" value="0" checked>
                            <input type="text" class="q-opt" placeholder="الاختيار الأول" required>
                        </div>
                        <div class="option-item">
                            <input type="radio" name="correct-${questionCounter}" value="1">
                            <input type="text" class="q-opt" placeholder="الاختيار الثاني" required>
                        </div>
                        <div class="option-item">
                            <input type="radio" name="correct-${questionCounter}" value="2">
                            <input type="text" class="q-opt" placeholder="الاختيار الثالث" required>
                        </div>
                        <div class="option-item">
                            <input type="radio" name="correct-${questionCounter}" value="3">
                            <input type="text" class="q-opt" placeholder="الاختيار الرابع" required>
                        </div>
                    </div>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', questionHTML);
            updateQuestionNumbers();
        }

        function removeQuestion(id) {
            const card = document.getElementById(`q-card-${id}`);
            if (card) {
                // إضافة حركة ناعمة قبل المسح
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    card.remove();
                    updateQuestionNumbers();
                }, 300);
            }
        }

        function updateQuestionNumbers() {
            const cards = document.querySelectorAll('.question-card');
            cards.forEach((card, index) => {
                card.querySelector('.q-num').innerText = index + 1;
            });
        }

        // إضافة سؤال افتراضي أول ما الصفحة تفتح
        window.onload = () => { addQuestion(); };

        // 3. تجميع البيانات ورفع الامتحان لفايربيز
        function publishExam() {
            const publishBtn = document.getElementById('publishBtn');
            const name = document.getElementById('examName').value.trim();
            const center = document.getElementById('examCenter').value;
            const duration = document.getElementById('examDuration').value;

            if (!name || !duration) return alert('⚠️ يرجى كتابة اسم الامتحان وتحديد وقته (بالدقائق).');

            const qCards = document.querySelectorAll('.question-card');
            if (qCards.length === 0) return alert('⚠️ يجب إضافة سؤال واحد على الأقل للامتحان.');

            let questions = [];
            let isValid = true;

            qCards.forEach((card) => {
                const text = card.querySelector('.q-text').value.trim();
                const opts = Array.from(card.querySelectorAll('.q-opt')).map(opt => opt.value.trim());
                const correctRadio = card.querySelector('input[type="radio"]:checked');
                
                if (!text || opts.some(o => o === "")) {
                    isValid = false;
                }

                questions.push({
                    questionText: text,
                    options: opts,
                    correctAnswerIndex: parseInt(correctRadio.value)
                });
            });

            if (!isValid) return alert('⚠️ يرجى إكمال جميع نصوص الأسئلة والاختيارات الفارغة قبل النشر.');

            publishBtn.innerText = "⏳ جاري الرفع والتشفير...";
            publishBtn.disabled = true;

            const newExamRef = database.ref('exams').push();
            
            const examData = {
                id: newExamRef.key,
                name: name,
                center: center,
                duration: parseInt(duration),
                questions: questions,
                totalQuestions: questions.length,
                publishDate: new Date().toLocaleString('ar-EG'),
                status: "active" 
            };

            newExamRef.set(examData).then(() => {
                alert('🎉 تم رفع الامتحان بنجاح وهو الآن متاح للطلاب بالسنتر المحدد!');
                window.location.href = 'index.html'; 
            }).catch(error => {
                alert('❌ حدث خطأ أثناء الرفع، تأكد من اتصالك بالإنترنت.');
                publishBtn.innerText = "🚀 نشر الامتحان الآن";
                publishBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
