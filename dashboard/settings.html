<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات المنصة والمظهر</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <style>
        /* تنسيقات كارت الإعدادات */
        .settings-card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 600px; margin: 20px auto; }
        .setting-group { margin-bottom: 25px; }
        .setting-group label { display: block; font-weight: bold; margin-bottom: 10px; color: #2c3e50; }
        .setting-group input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        
        /* شكل اختيار اللون */
        .color-picker-container { display: flex; align-items: center; gap: 15px; }
        input[type="color"] { border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; padding: 0; background: none; }
        
        /* شكل زر التبديل (Toggle Switch) للوضع الداكن */
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2c3e50; }
        input:checked + .slider:before { transform: translateX(26px); }

        /* دعم الوضع الداكن للوحة الدكتور نفسها */
        body.dark-mode { background-color: #0f172a; color: #f1f5f9; }
        body.dark-mode .settings-card { background: #1e293b; color: #f1f5f9; }
        body.dark-mode .setting-group label { color: #f1f5f9; }
        body.dark-mode .sidebar { background: #1e293b; border-left: 1px solid #334155; }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <h3 id="sidebarTitle">👨‍🏫 منصة د. أحمد رزق</h3>
        <ul>
            <li><a href="index.html">🏠 الرئيسية والإحصائيات</a></li>
            <li><a href="add_exam.html">📝 رفع امتحان جديد</a></li>
            <li><a href="center_report.html">📊 تقارير السناتر التفصيلية</a></li>
            <li><a href="settings.html" class="active">⚙️ إعدادات المنصة والمظهر</a></li>
            <li><a href="../auth/login.html">🚪 تسجيل الخروج</a></li>
        </ul>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <h2>⚙️ تخصيص إعدادات المنصة</h2>
        
        <div class="settings-card">
            
            <!-- تغيير اسم المنصة -->
            <div class="setting-group">
                <label>اسم المنصة (يظهر للطلاب في كل مكان):</label>
                <input type="text" id="platformNameInput" placeholder="مثال: منصة د. أحمد رزق للفيزياء">
            </div>

            <!-- تغيير اللون الأساسي -->
            <div class="setting-group">
                <label>اللون الأساسي للمنصة (الأزرار والروابط):</label>
                <div class="color-picker-container">
                    <input type="color" id="primaryColorInput" value="#2563eb">
                    <span id="colorHexCode" style="font-family: monospace; font-size: 16px;">#2563eb</span>
                </div>
            </div>

            <!-- تفعيل الوضع الداكن -->
            <div class="setting-group" style="display: flex; align-items: center; justify-content: space-between;">
                <label style="margin: 0;">🌙 تفعيل الوضع الداكن (Dark Mode):</label>
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <button class="upload-btn" onclick="saveSettings()" style="width: 100%; margin-top: 20px; font-size: 18px;">💾 حفظ الإعدادات</button>
        </div>
    </div>

    <script>
        // 1. تحميل الإعدادات القديمة أول ما الصفحة تفتح
        window.onload = function() {
            const savedName = localStorage.getItem('platformName') || "منصة د. أحمد رزق";
            const savedColor = localStorage.getItem('primaryColor') || "#2563eb";
            const savedMode = localStorage.getItem('themeMode');

            document.getElementById('platformNameInput').value = savedName;
            document.getElementById('sidebarTitle').innerText = `👨‍🏫 ${savedName}`;
            
            document.getElementById('primaryColorInput').value = savedColor;
            document.getElementById('colorHexCode').innerText = savedColor;
            
            if (savedMode === 'dark') {
                document.getElementById('darkModeToggle').checked = true;
                document.body.classList.add('dark-mode');
            }
        };

        // تحديث كود اللون بمجرد اختياره
        document.getElementById('primaryColorInput').addEventListener('input', function() {
            document.getElementById('colorHexCode').innerText = this.value;
        });

        // 2. دالة حفظ الإعدادات
        function saveSettings() {
            const newName = document.getElementById('platformNameInput').value.trim();
            const newColor = document.getElementById('primaryColorInput').value;
            const isDark = document.getElementById('darkModeToggle').checked;

            // حفظ في الذاكرة
            if (newName) localStorage.setItem('platformName', newName);
            localStorage.setItem('primaryColor', newColor);
            localStorage.setItem('themeMode', isDark ? 'dark' : 'light');

            // تطبيق فوري على الصفحة الحالية لتجربة الشكل
            document.documentElement.style.setProperty('--primary-color', newColor);
            document.getElementById('sidebarTitle').innerText = `👨‍🏫 ${newName}`;
            
            if (isDark) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }

            alert("✅ تم حفظ الإعدادات وتطبيقها بنجاح! ستظهر هذه التعديلات في الصفحة الرئيسية للمنصة.");
        }
    </script>
</body>
</html>
