<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة د. أحمد رزق</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @media (max-width: 768px) {
            .container { width: 90% !important; margin: 40px auto !important; }
        }
    </style>
</head>
<body>

    <div class="container" style="max-width: 400px; margin: 80px auto;">
        <h2 style="text-align: center; color: #2c3e50; margin-bottom: 20px;">🔐 تسجيل الدخول</h2>
        
        <form onsubmit="handleLogin(event)">
            <div>
                <label>نوع الحساب:</label>
                <select id="loginType" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px;">
                    <option value="student">👨‍🎓 طالب</option>
                    <option value="parent">👨‍👩‍👦 ولي أمر</option>
                    <option value="admin">👨‍🏫 إدارة (دكتور / مساعد)</option>
                </select>
            </div>

            <div>
                <label>رقم الهاتف (أو اسم المستخدم للإدارة):</label>
                <input type="text" id="loginUsername" placeholder="أدخل رقم الهاتف" required>
            </div>

            <div>
                <label>الرقم السري (لولي الأمر: أدخل رقم هاتفك):</label>
                <input type="password" id="loginPassword" placeholder="أدخل الرقم السري" required>
            </div>

            <div style="text-align: left; margin-bottom: 15px;">
                <a href="#" onclick="forgotPassword()" style="color: #dc3545; font-size: 14px; text-decoration: none;">هل نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" id="loginBtn">دخول</button>
            
            <p style="text-align: center; margin-top: 15px;">
                ليس لديك حساب؟ <a href="../register.html" style="color: #0056b3; font-weight: bold;">إنشاء حساب طالب</a>
            </p>
        </form>
    </div>

    <script>
        // إعدادات فايربيز الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform",
            storageBucket: "dr-ahmed-rizk-platform.appspot.com",
            messagingSenderId: "117735726313",
            appId: "1:117735726313:web:2a58aa1c4be7137b53e478"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        function handleLogin(event) {
            event.preventDefault(); 
            const loginBtn = document.getElementById('loginBtn');
            const originalText = loginBtn.innerText;
            loginBtn.innerText = "جاري التحقق...";
            loginBtn.disabled = true;

            const loginType = document.getElementById('loginType').value;
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            // 1. دخول الإدارة
            if (loginType === "admin") {
                if (username === "01145114388" && password === "Ahmed987654321") {
                    // الدخول الرئيسي للدكتور
                    window.location.href = "../dashboard/index.html";
                    return;
                }
                
                // البحث في المساعدين (سنربطها بفايربيز لاحقاً، حالياً تبحث في الـ local)
                const savedAdmins = JSON.parse(localStorage.getItem('admins')) || {};
                if (savedAdmins[username] && savedAdmins[username] === password) {
                    window.location.href = "../dashboard/index.html";
                } else {
                    alert("❌ بيانات الإدارة غير صحيحة!");
                    resetBtn();
                }
                return;
            }

            // 2. دخول الطالب وولي الأمر (التحقق من فايربيز)
            database.ref('students/' + username).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    const studentData = snapshot.val();
                    
                    if (loginType === "student") {
                        if (studentData.password === password) {
                            // حفظ رقم الطالب الحالي لمعرفة من قام بالدخول
                            localStorage.setItem('currentLoggedInStudent', username);
                            window.location.href = "../student/index.html";
                        } else {
                            alert("❌ الرقم السري للطالب غير صحيح!");
                            resetBtn();
                        }
                    } 
                    else if (loginType === "parent") {
                        if (studentData.parentPhone === password) {
                            localStorage.setItem('currentLoggedInStudent', username);
                            alert(`مرحباً بك يا ولي أمر الطالب (${studentData.name}). سيتم تحويلك لصفحة النتيجة.`);
                            window.location.href = "../student/result.html";
                        } else {
                            alert("❌ بيانات ولي الأمر غير صحيحة! تأكد أن اسم المستخدم هو رقم الطالب، وكلمة السر هي رقم هاتفك.");
                            resetBtn();
                        }
                    }
                } else {
                    alert("❌ رقم الهاتف غير مسجل لدينا في النظام.");
                    resetBtn();
                }
            }).catch((error) => {
                alert("❌ حدث خطأ في الاتصال بالخادم.");
                resetBtn();
            });

            function resetBtn() {
                loginBtn.innerText = originalText;
                loginBtn.disabled = false;
            }
        }

        // 3. استرجاع كلمة المرور باستخدام فايربيز
        function forgotPassword() {
            const phone = prompt("أدخل رقم هاتف الطالب للبحث عن الحساب:");
            if (!phone) return;

            database.ref('students/' + phone).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    const studentData = snapshot.val();
                    const email = prompt("تم العثور على الحساب. يرجى إدخال البريد الإلكتروني المرتبط به للتحقق:");
                    
                    if (email === studentData.email) {
                        const newPassword = prompt("البريد الإلكتروني صحيح ✅\nأدخل كلمة المرور الجديدة:");
                        if (newPassword && newPassword.trim() !== "") {
                            // تحديث الباسورد في فايربيز
                            database.ref('students/' + phone).update({
                                password: newPassword
                            }).then(() => {
                                alert("🎉 تم تغيير كلمة المرور بنجاح! يمكنك الآن تسجيل الدخول.");
                            });
                        } else {
                            alert("⚠️ لم يتم إدخال كلمة مرور. تم إلغاء العملية.");
                        }
                    } else {
                        alert("❌ البريد الإلكتروني غير متطابق مع الحساب المسجل!");
                    }
                } else {
                    alert("❌ رقم الهاتف غير مسجل لدينا في النظام.");
                }
            });
        }
    </script>
</body>
</html>
