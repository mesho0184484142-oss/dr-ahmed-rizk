<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استعادة كلمة المرور - المنصة التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- مكتبة EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){ emailjs.init("VEo02s7LwqIyYPG7i"); })(); 
    </script>

    <style>
        :root {
            --primary: #4318FF;
            --primary-hover: #3311cc;
            --secondary: #a3aed1;
            --success: #05CD99;
            --danger: #EE5D50;
            --dark-text: #2b3674;
            --bg-light: #f4f7fe;
            --card-bg: #ffffff;
            --border-color: #e0e5f2;
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background: var(--bg-light); 
            color: var(--dark-text); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px; 
            box-sizing: border-box;
        }

        .container { 
            background: var(--card-bg); 
            padding: 40px 30px; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
            animation: fadeUp 0.5s ease-out forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            color: var(--primary); 
            margin: 0 0 15px 0;
            font-weight: 800; 
            font-size: 1.5rem;
        }

        .hint-text {
            color: var(--secondary); 
            font-weight: 600; 
            margin-bottom: 25px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        input[type="tel"], input[type="password"] { 
            width: 100%; 
            padding: 16px; 
            border-radius: 14px; 
            border: 2px solid var(--border-color); 
            margin-bottom: 20px; 
            outline: none; 
            font-family: 'Cairo', sans-serif; 
            font-size: 1rem; 
            box-sizing: border-box; 
            background: #fcfcfc;
            color: var(--dark-text);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        input:focus { 
            border-color: var(--primary); 
            background: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1);
        }

        button { 
            width: 100%; 
            padding: 16px; 
            background: var(--primary);
            color: white; 
            border: none; 
            border-radius: 14px; 
            font-weight: 700; 
            font-family: 'Cairo', sans-serif;
            font-size: 1rem; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 8px 16px rgba(67, 24, 255, 0.2);
        }

        button:hover:not(:disabled) { 
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(67, 24, 255, 0.3);
        }

        button:disabled {
            background: var(--secondary);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .step { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .active-step { display: block; opacity: 1; }

        /* تعديل احترافي لمربعات الكود OTP */
        .otp-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 25px;
            direction: ltr; /* لضمان ترتيب الأرقام من اليسار لليمين */
        }

        .otp-box {
            width: 100%;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            border-radius: 14px;
            border: 2px solid var(--border-color);
            background: #fcfcfc;
            color: var(--primary);
            outline: none;
            transition: all 0.3s ease;
        }

        .otp-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1);
            background: var(--card-bg);
        }

        .back-link {
            display: inline-block; 
            margin-top: 20px; 
            color: var(--secondary); 
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            transition: 0.3s;
        }
        
        .back-link:hover { color: var(--primary); }
        .success-text { color: var(--success); font-weight: 800; font-size: 1.1rem; display: block; margin-top: 10px; direction: ltr;}

        /* تجاوب إضافي لشاشات الموبايل الصغيرة جداً */
        @media (max-width: 400px) {
            .container { padding: 30px 20px; }
            .otp-box { height: 50px; font-size: 20px; }
            h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <script>
        const savedColor = localStorage.getItem('primaryColor') || "#4318FF";
        const savedName = localStorage.getItem('platformName') || "المنصة التعليمية";
        document.documentElement.style.setProperty('--primary', savedColor);
        document.title = `استعادة كلمة المرور - ${savedName}`;
    </script>

    <div class="container">
        <!-- الخطوة 1: طلب الرقم -->
        <div id="step1" class="step active-step">
            <h2>🔒 استعادة كلمة المرور</h2>
            <p class="hint-text">أدخل رقم هاتف الطالب المسجل لدينا للبحث عن الحساب وإرسال كود التحقق.</p>
            
            <form onsubmit="checkPhone(event)">
                <input type="tel" id="searchPhone" placeholder="أدخل رقم الهاتف..." required pattern="[0-9]{10,11}">
                <button type="submit" id="btn1">بحث وإرسال الكود ✉️</button>
            </form>
            
            <a href="login.html" class="back-link">العودة لتسجيل الدخول</a>
        </div>

        <!-- الخطوة 2: إدخال الكود -->
        <div id="step2" class="step">
            <h2>✉️ كود التحقق</h2>
            <p id="emailHint" class="hint-text"></p>
            
            <form onsubmit="verifyOTP(event)">
                <div class="otp-container">
                    <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                </div>
                <button type="submit" id="btn2" style="background: var(--success); box-shadow: 0 8px 16px rgba(5, 205, 153, 0.2);">تأكيد الكود ✅</button>
            </form>
            
            <a href="javascript:void(0)" onclick="resetProcess()" class="back-link">إلغاء وتعديل الرقم</a>
        </div>

        <!-- الخطوة 3: كلمة مرور جديدة -->
        <div id="step3" class="step">
            <h2>🔑 كلمة مرور جديدة</h2>
            <p class="hint-text">قم بتعيين كلمة مرور جديدة وقوية لحسابك لتتمكن من تسجيل الدخول.</p>
            
            <form onsubmit="updatePassword(event)">
                <input type="password" id="newPassword" placeholder="كلمة المرور (6 أحرف أو أرقام على الأقل)" required minlength="6">
                <button type="submit" id="btn3">حفظ وتسجيل الدخول 🚀</button>
            </form>
        </div>
    </div>

    <script>
        // إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let targetStudentPhone = "";
        let targetStudentData = null;
        let generatedOTP = "";

        function showStep(stepId) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active-step'));
            document.getElementById(stepId).classList.add('active-step');
        }

        function resetProcess() {
            showStep('step1');
            document.getElementById('searchPhone').value = "";
            document.querySelectorAll('.otp-box').forEach(box => box.value = "");
            document.getElementById('newPassword').value = "";
            targetStudentPhone = "";
            generatedOTP = "";
        }

        // منطق مربعات الكود (OTP) للانتقال التلقائي
        const otpBoxes = document.querySelectorAll('.otp-box');
        otpBoxes.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1); // يمنع لصق أكثر من رقم في المربع
                }
                if (e.target.value !== '' && index < otpBoxes.length - 1) {
                    otpBoxes[index + 1].focus(); // الانتقال للمربع التالي
                }
            });
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    otpBoxes[index - 1].focus(); // الرجوع للمربع السابق عند الحذف
                }
            });
        });

        function checkPhone(e) {
            e.preventDefault();
            const phone = document.getElementById('searchPhone').value.trim();
            const btn = document.getElementById('btn1');
            
            btn.innerText = "⏳ جاري البحث..."; 
            btn.disabled = true;

            database.ref('students/' + phone).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    targetStudentData = snapshot.val();
                    
                    if (!targetStudentData.email) {
                        alert("❌ عذراً، لا يوجد بريد إلكتروني مسجل لهذا الحساب.");
                        btn.innerText = "بحث وإرسال الكود ✉️"; btn.disabled = false;
                        return;
                    }

                    targetStudentPhone = phone;
                    generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();
                    
                    const templateParams = {
                        to_name: targetStudentData.name || "طالب",
                        to_email: targetStudentData.email,
                        otp_code: generatedOTP
                    };

                    emailjs.send('service_y9671et', 'template_wv4fjtc', templateParams)
                        .then(() => {
                            showStep('step2');
                            let hiddenEmail = targetStudentData.email.replace(/(.{2})(.*)(?=@)/,
                                (gp1, gp2, gp3) => { return gp1 + gp3.replace(/./g, '*') });
                            
                            document.getElementById('emailHint').innerHTML = `أرسلنا كود التحقق إلى الإيميل:<br><strong class="success-text">${hiddenEmail}</strong>`;
                            otpBoxes[0].focus();
                        })
                        .catch(err => {
                            alert("❌ فشل إرسال كود التحقق! تأكد من اتصالك بالإنترنت.");
                        })
                        .finally(() => {
                            btn.innerText = "بحث وإرسال الكود ✉️"; btn.disabled = false;
                        });
                } else {
                    alert("❌ هذا الرقم غير مسجل لدينا!");
                    btn.innerText = "بحث وإرسال الكود ✉️"; btn.disabled = false;
                }
            }).catch(error => {
                alert("❌ حدث خطأ في الاتصال.");
                btn.innerText = "بحث وإرسال الكود ✉️"; btn.disabled = false;
            });
        }

        function verifyOTP(e) {
            e.preventDefault();
            // تجميع الأرقام من المربعات الأربعة
            let enteredOTP = "";
            otpBoxes.forEach(box => enteredOTP += box.value);
            
            if (enteredOTP === generatedOTP) {
                showStep('step3');
                document.getElementById('newPassword').focus();
            } else {
                alert("❌ الكود غير صحيح!");
                otpBoxes.forEach(box => box.value = ""); // مسح المربعات
                otpBoxes[0].focus(); // إعادة التركيز للمربع الأول
            }
        }

        function updatePassword(e) {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value.trim();
            const btn = document.getElementById('btn3');
            
            btn.innerText = "⏳ جاري الحفظ..."; btn.disabled = true;

            database.ref('students/' + targetStudentPhone + '/password').set(newPass)
                .then(() => {
                    alert("🎉 تم تغيير كلمة المرور بنجاح.");
                    window.location.href = "login.html";
                })
                .catch(error => {
                    alert("❌ حدث خطأ أثناء الحفظ.");
                    btn.innerText = "حفظ وتسجيل الدخول 🚀"; btn.disabled = false;
                });
        }
    </script>
</body>
</html>
