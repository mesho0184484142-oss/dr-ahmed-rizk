<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - المنصة التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- مكتبة EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){ emailjs.init("VEo02s7LwqIyYPG7i"); })(); 
    </script>

    <style>
        :root {
            --primary: #4318FF;
            --secondary: #a3aed1;
            --success: #05CD99;
            --danger: #EE5D50;
            --dark-text: #2b3674;
            --bg-light: #f4f7fe;
            --card-bg: #ffffff;
            --border-color: #e0e5f2;
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background: var(--bg-light); 
            color: var(--dark-text); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        .container { 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            border: 1px solid var(--border-color);
            animation: fadeUp 0.5s ease-out forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            color: var(--primary); 
            margin-bottom: 20px; 
            margin-top: 0;
            font-weight: 800; 
            font-size: 24px;
        }

        input { 
            width: 100%; 
            padding: 15px; 
            border-radius: 12px; 
            border: 2px solid var(--border-color); 
            margin-bottom: 20px; 
            outline: none; 
            font-family: 'Cairo', sans-serif; 
            font-size: 15px; 
            box-sizing: border-box; 
            background: var(--bg-light);
            color: var(--dark-text);
            font-weight: 700;
            transition: all 0.3s ease;
        }

        input:focus { 
            border-color: var(--primary); 
            background: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1);
        }

        button { 
            width: 100%; 
            padding: 16px; 
            background: var(--primary);
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 800; 
            font-family: 'Cairo', sans-serif;
            font-size: 16px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 10px 20px rgba(67, 24, 255, 0.2);
        }

        button:hover:not(:disabled) { 
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(67, 24, 255, 0.3);
        }

        button:disabled {
            background: var(--secondary);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .step { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .active-step { display: block; opacity: 1; }

        /* تعديل احترافي لمركزة الـ OTP */
        .otp-input { 
            font-size: 32px; 
            letter-spacing: 20px; 
            text-align: center; 
            background: var(--bg-light); 
            color: var(--primary); 
            font-weight: 800; 
            padding-left: 35px; /* يوازن المسافة الإضافية الناتجة عن letter-spacing */
            border-style: dashed;
        }
        .otp-input:focus { border-style: solid; }

        .back-link {
            display: inline-block; 
            margin-top: 20px; 
            color: var(--secondary); 
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
        }
        .back-link:hover { color: var(--primary); }

        .hint-text {
            color: var(--secondary); 
            font-weight: 600; 
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .success-text { color: var(--success); font-weight: 800; font-size: 18px; display: inline-block; margin-top: 10px; }

        @media (max-width: 768px) {
            .container { padding: 30px 20px; border-radius: 15px; }
            .otp-input { font-size: 26px; letter-spacing: 15px; padding-left: 30px; }
        }
    </style>
</head>
<body>

    <!-- تطبيق الألوان الديناميكية -->
    <script>
        const savedColor = localStorage.getItem('primaryColor') || "#4318FF";
        const savedName = localStorage.getItem('platformName') || "المنصة التعليمية";
        
        document.documentElement.style.setProperty('--primary', savedColor);
        document.title = `استعادة كلمة المرور - ${savedName}`;
    </script>

    <div class="container">
        <!-- الخطوة 1: طلب الرقم -->
        <div id="step1" class="step active-step">
            <h2>🔒 استعادة كلمة المرور</h2>
            <p class="hint-text">أدخل رقم هاتف الطالب المسجل لدينا للبحث عن الحساب وإرسال كود التحقق.</p>
            
            <form onsubmit="checkPhone(event)">
                <input type="tel" id="searchPhone" placeholder="أدخل رقم الهاتف..." required pattern="[0-9]{10,11}">
                <button type="submit" id="btn1">بحث وإرسال الكود ✉️</button>
            </form>
            
            <a href="login.html" class="back-link">العودة لتسجيل الدخول</a>
        </div>

        <!-- الخطوة 2: إدخال الكود -->
        <div id="step2" class="step">
            <h2>✉️ كود التحقق</h2>
            <p id="emailHint" class="hint-text"></p>
            
            <form onsubmit="verifyOTP(event)">
                <input type="text" id="otpInput" class="otp-input" maxlength="4" placeholder="----" autocomplete="off" inputmode="numeric" required>
                <button type="submit" id="btn2" style="background: var(--success);">تأكيد الكود ✅</button>
            </form>
            
            <a href="javascript:void(0)" onclick="resetProcess()" class="back-link">إلغاء وتعديل الرقم</a>
        </div>

        <!-- الخطوة 3: كلمة مرور جديدة -->
        <div id="step3" class="step">
            <h2>🔑 كلمة مرور جديدة</h2>
            <p class="hint-text">قم بتعيين كلمة مرور جديدة وقوية لحسابك لتتمكن من تسجيل الدخول.</p>
            
            <form onsubmit="updatePassword(event)">
                <input type="password" id="newPassword" placeholder="اكتب كلمة المرور (6 أحرف أو أرقام كحد أدنى)" required minlength="6">
                <button type="submit" id="btn3">حفظ وتسجيل الدخول 🚀</button>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let targetStudentPhone = "";
        let targetStudentData = null;
        let generatedOTP = "";

        // التنقل بين الخطوات بنعومة
        function showStep(stepId) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active-step'));
            document.getElementById(stepId).classList.add('active-step');
        }

        function resetProcess() {
            showStep('step1');
            document.getElementById('searchPhone').value = "";
            document.getElementById('otpInput').value = "";
            document.getElementById('newPassword').value = "";
            targetStudentPhone = "";
            generatedOTP = "";
        }

        // الخطوة 1: التحقق وإرسال الإيميل
        function checkPhone(e) {
            e.preventDefault();
            const phone = document.getElementById('searchPhone').value.trim();
            const btn = document.getElementById('btn1');
            
            btn.innerText = "⏳ جاري البحث والتأمين..."; 
            btn.disabled = true;

            database.ref('students/' + phone).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    targetStudentData = snapshot.val();
                    
                    if (!targetStudentData.email) {
                        alert("❌ عذراً، لا يوجد بريد إلكتروني مسجل لهذا الحساب. يرجى التواصل مع الدعم الفني أو السنتر.");
                        btn.innerText = "بحث وإرسال الكود ✉️"; btn.disabled = false;
                        return;
                    }

                    targetStudentPhone = phone;
                    generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();
                    
                    const templateParams = {
                        to_name: targetStudentData.name,
                        to_email: targetStudentData.email,
                        otp_code: generatedOTP
                    };

                    emailjs.send('service_y9671et', 'template_wv4fjtc', templateParams)
                        .then(() => {
                            showStep('step2');
                            let hiddenEmail = targetStudentData.email.replace(/(.{2})(.*)(?=@)/,
                                (gp1, gp2, gp3) => { return gp1 + gp3.replace(/./g, '*') });
                            
                            document.getElementById('emailHint').innerHTML = `لقد أرسلنا كود التحقق المكون من 4 أرقام إلى الإيميل الخاص بك:<br><strong class="success-text">${hiddenEmail}</strong>`;
                            document.getElementById('otpInput').focus();
                        })
                        .catch(err => {
                            alert("❌ فشل إرسال كود التحقق! يرجى التأكد من اتصالك بالإنترنت.");
                            console.error(err);
                        })
                        .finally(() => {
                            btn.innerText = "بحث وإرسال الكود ✉️"; btn.disabled = false;
                        });
                } else {
                    alert("❌ هذا الرقم غير مسجل لدينا في المنصة كطالب!");
                    btn.innerText = "بحث وإرسال الكود ✉️"; btn.disabled = false;
                }
            }).catch(error => {
                alert("❌ حدث خطأ في الاتصال بخوادم المنصة.");
                btn.innerText = "بحث وإرسال الكود ✉️"; btn.disabled = false;
            });
        }

        // الخطوة 2: مراجعة الكود
        function verifyOTP(e) {
            e.preventDefault();
            const input = document.getElementById('otpInput').value.trim();
            
            if (input === generatedOTP) {
                showStep('step3');
                document.getElementById('newPassword').focus();
            } else {
                alert("❌ الكود غير صحيح! تأكد من الأرقام المرسلة لك وحاول مجدداً.");
                document.getElementById('otpInput').value = "";
                document.getElementById('otpInput').focus();
            }
        }

        // الخطوة 3: تغيير الباسورد
        function updatePassword(e) {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value.trim();
            const btn = document.getElementById('btn3');
            
            btn.innerText = "⏳ جاري التشفير والحفظ..."; btn.disabled = true;

            database.ref('students/' + targetStudentPhone + '/password').set(newPass)
                .then(() => {
                    alert("🎉 تهانينا! تم تعيين كلمة المرور الجديدة بنجاح.");
                    // تنظيف البيانات الحساسة
                    targetStudentPhone = "";
                    generatedOTP = "";
                    window.location.href = "login.html";
                })
                .catch(error => {
                    alert("❌ حدث خطأ أثناء تحديث كلمة المرور في قاعدة البيانات.");
                    btn.innerText = "حفظ وتسجيل الدخول 🚀"; btn.disabled = false;
                });
        }
    </script>
</body>
</html>
