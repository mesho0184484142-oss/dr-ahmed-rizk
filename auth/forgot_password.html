<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <script>
        (function(){ emailjs.init("VEo02s7LwqIyYPG7i"); })(); // الـ Public Key بتاعك
    </script>

    <style>
        body { font-family: 'Cairo'; background: #f4f7fe; color: #2b3674; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #4318FF; margin-bottom: 20px; font-weight: 800; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #e0e5f2; margin-bottom: 20px; outline: none; font-family: 'Cairo'; font-size: 15px; box-sizing: border-box; }
        input:focus { border-color: #4318FF; }
        button { width: 100%; padding: 15px; background: #4318FF; color: white; border: none; border-radius: 12px; font-weight: 800; font-family: 'Cairo'; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2b3674; }
        .step { display: none; }
        .active-step { display: block; }
        .otp-input { font-size: 24px; letter-spacing: 15px; text-align: center; background: #f4f7fe; color: #4318FF; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- الخطوة 1: طلب الرقم -->
        <div id="step1" class="step active-step">
            <h2>🔒 نسيت كلمة المرور</h2>
            <p style="color:#a3aed1; font-weight:600; margin-bottom:20px;">أدخل رقم هاتف الطالب المسجل به الحساب للبحث عنه.</p>
            <input type="tel" id="searchPhone" placeholder="رقم هاتف الطالب">
            <button id="btn1" onclick="checkPhone()">بحث وإرسال الكود ✉️</button>
            <a href="login.html" style="display:block; margin-top:20px; color:#a3aed1; font-weight:700;">العودة لتسجيل الدخول</a>
        </div>

        <!-- الخطوة 2: إدخال الكود -->
        <div id="step2" class="step">
            <h2>✉️ كود التحقق</h2>
            <p id="emailHint" style="color:#a3aed1; font-weight:600; margin-bottom:20px;"></p>
            <input type="text" id="otpInput" class="otp-input" maxlength="4" placeholder="----" autocomplete="off">
            <button id="btn2" onclick="verifyOTP()">تأكيد الكود</button>
        </div>

        <!-- الخطوة 3: كلمة مرور جديدة -->
        <div id="step3" class="step">
            <h2>🔑 كلمة مرور جديدة</h2>
            <input type="password" id="newPassword" placeholder="اكتب كلمة المرور الجديدة">
            <button id="btn3" onclick="updatePassword()">حفظ وتسجيل الدخول ✅</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let targetStudentPhone = "";
        let targetStudentData = null;
        let generatedOTP = "";

        // الخطوة 1: التحقق وإرسال الإيميل
        function checkPhone() {
            const phone = document.getElementById('searchPhone').value.trim();
            if(!phone) return alert("يرجى كتابة رقم الهاتف!");
            
            const btn = document.getElementById('btn1');
            btn.innerText = "⏳ جاري البحث..."; btn.disabled = true;

            database.ref('students/' + phone).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    targetStudentPhone = phone;
                    targetStudentData = snapshot.val();
                    
                    // توليد كود وإرساله بنفس إعداداتك اللي شغالة!
                    generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();
                    const templateParams = {
                        to_name: targetStudentData.name,
                        to_email: targetStudentData.email,
                        otp_code: generatedOTP
                    };

                    emailjs.send('service_y9671et', 'template_wv4fjtc', templateParams)
                        .then(() => {
                            document.getElementById('step1').classList.remove('active-step');
                            document.getElementById('step2').classList.add('active-step');
                            // إخفاء جزء من الإيميل للأمان
                            let hiddenEmail = targetStudentData.email.replace(/(.{2})(.*)(?=@)/,
                                (gp1, gp2, gp3) => { return gp2 + gp3.replace(/./g, '*') });
                            document.getElementById('emailHint').innerText = `أرسلنا كود التحقق إلى الإيميل: ${hiddenEmail}`;
                        })
                        .catch(err => alert("❌ فشل إرسال الإيميل!"));
                } else {
                    alert("❌ هذا الرقم غير مسجل لدينا!");
                }
                btn.innerText = "بحث وإرسال الكود ✉️"; btn.disabled = false;
            });
        }

        // الخطوة 2: مراجعة الكود
        function verifyOTP() {
            const input = document.getElementById('otpInput').value.trim();
            if (input === generatedOTP) {
                document.getElementById('step2').classList.remove('active-step');
                document.getElementById('step3').classList.add('active-step');
            } else {
                alert("❌ الكود غير صحيح!");
            }
        }

        // الخطوة 3: تغيير الباسورد في الداتا بيز
        function updatePassword() {
            const newPass = document.getElementById('newPassword').value.trim();
            if(newPass.length < 4) return alert("كلمة المرور قصيرة جداً!");

            database.ref('students/' + targetStudentPhone + '/password').set(newPass)
                .then(() => {
                    alert("🎉 تم تغيير كلمة المرور بنجاح! يمكنك الآن تسجيل الدخول.");
                    window.location.href = "login.html";
                });
        }
    </script>
</body>
</html>
