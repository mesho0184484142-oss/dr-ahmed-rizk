<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - منصة د. أحمد رزق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- مكتبة EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            // وضع مفتاح Public Key الخاص بك هنا
            emailjs.init("VEo02s7LwqIyYPG7i");
        })();
    </script>
    
    <style>
        body { font-family: 'Cairo', sans-serif !important; background-color: #f4f7fe; color: #2b3674; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .container { background: #ffffff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 500px; border: 1px solid #e0e5f2; }
        h2 { font-weight: 800; color: #4318FF; text-align: center; margin-bottom: 30px; font-size: 24px; margin-top: 0; }
        label { font-weight: 700; margin-bottom: 8px; display: block; color: #2b3674; font-size: 14px; }
        input, select { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #e0e5f2; background: #f9fbfd; color: #2b3674; font-family: 'Cairo', sans-serif; font-weight: 600; margin-bottom: 20px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: #4318FF; background: #ffffff; box-shadow: 0 0 0 3px rgba(67, 24, 255, 0.1); }
        button { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 800; font-family: 'Cairo', sans-serif; font-size: 16px; cursor: pointer; transition: 0.3s; color: white; display: block; }
        .btn-submit { background: #4318FF; box-shadow: 0 10px 20px rgba(67, 24, 255, 0.2); }
        .btn-submit:hover { background: #2b3674; transform: translateY(-2px); }
        .btn-cancel { background: transparent; color: #EE5D50; margin-top: 15px; border: 2px solid #EE5D50; box-shadow: none; }
        .btn-cancel:hover { background: #EE5D50; color: white; }
        .otp-container { display: none; text-align: center; }
        .otp-input { width: 100%; font-size: 30px; letter-spacing: 20px; text-align: center; padding: 15px; color: #4318FF; font-weight: 800; background: #f4f7fe; }
        .login-link { text-align: center; margin-top: 20px; font-size: 15px; font-weight: 600; color: #a3aed1; }
        .login-link a { color: #4318FF; font-weight: 800; text-decoration: none; transition: 0.3s; }
        .login-link a:hover { color: #2b3674; text-decoration: underline; }
        @media (max-width: 768px) {
            .container { padding: 30px 20px; }
            h2 { font-size: 22px; }
            input, select { padding: 12px; }
            .otp-input { font-size: 24px; letter-spacing: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة التسجيل -->
        <div id="registrationFormContainer">
            <h2>🎓 إنشاء حساب جديد</h2>
            
            <form onsubmit="initiateRegistration(event)">
                <label>اسم الطالب بالكامل:</label>
                <input type="text" id="regFullName" placeholder="اكتب اسمك الثلاثي" required>

                <label>السنتر التابع له:</label>
                <select id="regCenter" required>
                    <option value="" disabled selected>جاري تحميل السناتر...</option>
                </select>

                <label>البريد الإلكتروني (لتلقي كود التحقق):</label>
                <input type="email" id="regEmail" placeholder="example@gmail.com" required>

                <label>رقم هاتف الطالب (اسم المستخدم):</label>
                <input type="tel" id="regUsername" placeholder="مثال: 01xxxxxxxxx" required>

                <label>رقم هاتف ولي الأمر:</label>
                <input type="tel" id="regParentPhone" placeholder="للتواصل في حالة الغياب" required>

                <label>الرقم السري:</label>
                <input type="password" id="regPassword" placeholder="اكتب رقماً سرياً قوياً" required>

                <button type="submit" id="submitBtn" class="btn-submit">إرسال كود التحقق ✉️</button>
                
                <div class="login-link">
                    لديك حساب بالفعل؟ <a href="auth/login.html">تسجيل الدخول</a>
                </div>
            </form>
        </div>

        <!-- شاشة الـ OTP -->
        <div id="otpFormContainer" class="otp-container">
            <h2>✉️ تأكيد البريد الإلكتروني</h2>
            <p style="color: #a3aed1; font-weight: 600; margin-bottom: 25px;" id="otpMessage"></p>
            
            <form onsubmit="verifyOTP(event)">
                <input type="text" id="otpInput" class="otp-input" maxlength="4" placeholder="----" required autocomplete="off">
                <button type="submit" id="confirmBtn" class="btn-submit">تأكيد وإنشاء الحساب</button>
            </form>
            
            <button onclick="cancelRegistration()" class="btn-cancel">إلغاء وتعديل البريد</button>
        </div>
    </div>

    <script>
        // إعدادات فايربيز
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform",
            storageBucket: "dr-ahmed-rizk-platform.appspot.com",
            messagingSenderId: "117735726313",
            appId: "1:117735726313:web:2a58aa1c4be7137b53e478"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // جلب السناتر من السيرفر
        database.ref('centers').on('value', (snapshot) => {
            const centers = snapshot.val() || ["سنتر ألفا", "سنتر المجد"]; 
            const centerSelect = document.getElementById('regCenter');
            centerSelect.innerHTML = '<option value="" disabled selected>-- اختر السنتر التابع له --</option>';
            centers.forEach(center => {
                centerSelect.innerHTML += `<option value="${center}">${center}</option>`;
            });
        });

        // منطق التسجيل
        let generatedOTP = "";
        let pendingUserData = {};

        function initiateRegistration(event) {
            event.preventDefault(); 
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "⏳ جاري التحقق...";
            submitBtn.disabled = true;

            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();

            database.ref('students/' + username).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    alert("⚠️ رقم هاتف الطالب مسجل به حساب بالفعل!");
                    submitBtn.innerText = "إرسال كود التحقق ✉️";
                    submitBtn.disabled = false;
                    return;
                }

                pendingUserData = {
                    name: document.getElementById('regFullName').value.trim(),
                    center: document.getElementById('regCenter').value,
                    email: email,
                    parentPhone: document.getElementById('regParentPhone').value.trim(),
                    password: document.getElementById('regPassword').value,
                    username: username
                };

                generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();

                const templateParams = {
                    to_name: pendingUserData.name,
                    to_email: email,
                    otp_code: generatedOTP
                };

                submitBtn.innerText = "⏳ جاري إرسال الإيميل...";

                // ⚠️ شيل الكلمة اللي بالعربي وحط الـ Template ID بتاعك بين علامتين التنصيص
                emailjs.send('service_y9671et', 'ضع_الـ_Template_ID_هنا', templateParams)
                    .then(function(response) {
                        document.getElementById('registrationFormContainer').style.display = 'none';
                        document.getElementById('otpFormContainer').style.display = 'block';
                        document.getElementById('otpMessage').innerText = `أرسلنا كود تحقق إلى: ${email}`;
                        
                        submitBtn.innerText = "إرسال كود التحقق ✉️";
                        submitBtn.disabled = false;
                    }, function(error) {
                        // الميزة الجديدة: إظهار سبب المشكلة الحقيقي
                        alert("❌ فشل الإرسال! السيرفر بيقول: " + JSON.stringify(error));
                        submitBtn.innerText = "إرسال كود التحقق ✉️";
                        submitBtn.disabled = false;
                    });
            }).catch((error) => {
                alert("❌ حدث خطأ في الاتصال بالسيرفر.");
                submitBtn.innerText = "إرسال كود التحقق ✉️";
                submitBtn.disabled = false;
            });
        }

        function verifyOTP(event) {
            event.preventDefault();
            const confirmBtn = document.getElementById('confirmBtn');
            confirmBtn.innerText = "⏳ جاري الإنشاء...";
            confirmBtn.disabled = true;

            const enteredOTP = document.getElementById('otpInput').value.trim();

            if (enteredOTP === generatedOTP) {
                database.ref('students/' + pendingUserData.username).set({
                    name: pendingUserData.name,
                    center: pendingUserData.center,
                    email: pendingUserData.email,
                    parentPhone: pendingUserData.parentPhone,
                    password: pendingUserData.password,
                    registerDate: new Date().toLocaleDateString('ar-EG')
                }).then(() => {
                    alert(`🎉 تم إنشاء الحساب بنجاح! مرحباً بك يا ${pendingUserData.name}`);
                    window.location.href = "auth/login.html"; 
                }).catch((error) => {
                    alert("❌ حدث خطأ أثناء حفظ البيانات.");
                    confirmBtn.innerText = "تأكيد وإنشاء الحساب";
                    confirmBtn.disabled = false;
                });
            } else {
                alert("❌ كود التحقق غير صحيح!");
                confirmBtn.innerText = "تأكيد وإنشاء الحساب";
                confirmBtn.disabled = false;
            }
        }

        function cancelRegistration() {
            document.getElementById('otpFormContainer').style.display = 'none';
            document.getElementById('registrationFormContainer').style.display = 'block';
            document.getElementById('otpInput').value = ""; 
        }
    </script>
</body>
</html>
