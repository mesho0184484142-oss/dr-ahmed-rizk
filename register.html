<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - منصة د. أحمد رزق</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* تنسيقات إضافية لشاشة التحقق */
        .otp-container {
            display: none; /* مخفية في البداية */
            text-align: center;
        }
        .otp-input {
            width: 150px;
            font-size: 24px;
            letter-spacing: 10px;
            text-align: center;
            padding: 10px;
            margin: 20px auto;
            display: block;
            border: 2px solid #3498db;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ==============================
             الشاشة الأولى: فورم التسجيل 
             ============================== -->
        <div id="registrationFormContainer">
            <h2 style="text-align: center; color: #2c3e50; margin-bottom: 20px;">🎓 تسجيل حساب طالب جديد</h2>
            
            <form onsubmit="initiateRegistration(event)">
                <div>
                    <label>اسم الطالب بالكامل:</label>
                    <input type="text" id="regFullName" placeholder="اكتب اسمك الثلاثي" required>
                </div>

                <div>
                    <label>السنتر التابع له:</label>
                    <select id="regCenter" required style="width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px;">
                        <option value="" disabled selected>-- اختر السنتر التابع له --</option>
                    </select>
                </div>

                <div>
                    <label>البريد الإلكتروني (سنرسل كود التحقق إليه):</label>
                    <input type="email" id="regEmail" placeholder="example@gmail.com" required>
                </div>

                <div>
                    <label>رقم هاتف الطالب (اسم المستخدم):</label>
                    <input type="tel" id="regUsername" placeholder="رقم هاتف الطالب" required>
                </div>

                <div>
                    <label>رقم هاتف ولي الأمر:</label>
                    <input type="tel" id="regParentPhone" placeholder="رقم هاتف الأب أو الأم" required>
                </div>

                <div>
                    <label>الرقم السري:</label>
                    <input type="password" id="regPassword" placeholder="اكتب رقماً سرياً قوياً" required>
                </div>

                <button type="submit" style="background-color: #28a745; margin-top: 10px;">إرسال كود التحقق ✉️</button>
                
                <p style="text-align: center; margin-top: 15px; font-size: 15px;">
                    لديك حساب بالفعل؟ <a href="auth/login.html" style="color: #0056b3; font-weight: bold; text-decoration: none;">تسجيل الدخول</a>
                </p>
            </form>
        </div>

        <!-- ==============================
             الشاشة الثانية: التحقق بالـ OTP 
             ============================== -->
        <div id="otpFormContainer" class="otp-container">
            <h2 style="color: #2c3e50;">✉️ تأكيد البريد الإلكتروني</h2>
            <p style="color: #64748b; margin-top: 10px;" id="otpMessage">
                لقد أرسلنا كود تحقق مكون من 4 أرقام إلى بريدك الإلكتروني.
            </p>
            
            <form onsubmit="verifyOTP(event)">
                <input type="text" id="otpInput" class="otp-input" maxlength="4" placeholder="----" required autocomplete="off">
                <button type="submit" style="background-color: #3498db; width: 100%;">تأكيد الحساب</button>
            </form>
            
            <button onclick="cancelRegistration()" style="background-color: transparent; color: #dc3545; border: none; margin-top: 15px; cursor: pointer; text-decoration: underline;">
                إلغاء وتعديل البريد الإلكتروني
            </button>
        </div>

    </div>

    <script>
        // متغيرات عامة لحفظ البيانات المؤقتة وكود الـ OTP
        let generatedOTP = "";
        let pendingUserData = {};

        // 1. تحميل السناتر تلقائياً
        window.onload = function() {
            const centerSelect = document.getElementById('regCenter');
            const savedCenters = JSON.parse(localStorage.getItem('savedCenters')) || ["سنتر ألفا", "سنتر المجد"];
            savedCenters.forEach(center => {
                const opt = document.createElement('option');
                opt.value = center;
                opt.textContent = center;
                centerSelect.appendChild(opt);
            });
        };

        // 2. دالة بدء التسجيل وإرسال الـ OTP
        function initiateRegistration(event) {
            event.preventDefault(); 

            // سحب البيانات من الفورم
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            
            let students = JSON.parse(localStorage.getItem('students')) || {};

            // التحقق من أن رقم الهاتف غير مسجل مسبقاً
            if (students[username]) {
                alert("⚠️ رقم هاتف الطالب مسجل به حساب بالفعل!");
                return;
            }

            // حفظ البيانات مؤقتاً لحين تأكيد الـ OTP
            pendingUserData = {
                name: document.getElementById('regFullName').value.trim(),
                center: document.getElementById('regCenter').value,
                email: email,
                parentPhone: document.getElementById('regParentPhone').value.trim(),
                password: document.getElementById('regPassword').value,
                username: username
            };

            // إنشاء كود عشوائي من 4 أرقام (مثال: 4829)
            generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();

            // 🔴 محاكاة الإيميل: هنطلع رسالة للمستخدم بالكود كأنه فتح الإيميل بتاعه وشافه
            alert(`[محاكاة نظام الإيميل]\nرسالة جديدة من منصة د. أحمد رزق:\n\nكود التحقق الخاص بك هو: ${generatedOTP}`);

            // إخفاء فورم التسجيل وإظهار فورم الـ OTP
            document.getElementById('registrationFormContainer').style.display = 'none';
            document.getElementById('otpFormContainer').style.display = 'block';
            document.getElementById('otpMessage').innerText = `لقد أرسلنا كود تحقق إلى البريد: ${email}`;
        }

        // 3. دالة التحقق من الـ OTP
        function verifyOTP(event) {
            event.preventDefault();
            
            const enteredOTP = document.getElementById('otpInput').value.trim();

            if (enteredOTP === generatedOTP) {
                // الكود صحيح، نقوم بحفظ المستخدم في قاعدة البيانات (LocalStorage)
                let students = JSON.parse(localStorage.getItem('students')) || {};
                
                // حفظ البيانات بالاسم المستخدم (رقم الهاتف)
                students[pendingUserData.username] = {
                    name: pendingUserData.name,
                    center: pendingUserData.center,
                    email: pendingUserData.email,
                    parentPhone: pendingUserData.parentPhone,
                    password: pendingUserData.password
                };
                
                localStorage.setItem('students', JSON.stringify(students));

                alert(`🎉 تم تأكيد البريد الإلكتروني وإنشاء الحساب بنجاح يا ${pendingUserData.name}!`);
                window.location.href = "auth/login.html"; 
            } else {
                alert("❌ كود التحقق غير صحيح، يرجى المحاولة مرة أخرى.");
            }
        }

        // 4. دالة الإلغاء للرجوع للفورم
        function cancelRegistration() {
            document.getElementById('otpFormContainer').style.display = 'none';
            document.getElementById('registrationFormContainer').style.display = 'block';
            document.getElementById('otpInput').value = ""; // تفريغ الحقل
        }
    </script>
</body>
</html>
