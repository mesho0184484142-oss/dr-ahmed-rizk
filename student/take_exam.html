<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداء الامتحان - منصة د. أحمد رزق</title>
    
    <!-- خطوط جوجل (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* التنسيقات الأساسية */
        body { 
            font-family: 'Cairo', sans-serif !important; 
            background-color: #f4f7fe !important; 
            color: #2b3674 !important; 
            margin: 0 !important; 
            padding-bottom: 60px; 
            user-select: none; /* منع تحديد النص للغش */
        }
        
        /* ترويسة الامتحان (الهيدر) */
        .exam-header { 
            background: #ffffff; 
            padding: 15px 40px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 4px solid #4318FF; 
        }
        .exam-title { font-size: 22px; font-weight: 800; color: #4318FF; display: flex; align-items: center; gap: 10px; }
        .exam-timer { 
            background: rgba(238, 93, 80, 0.1); 
            color: #EE5D50; 
            padding: 10px 25px; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 18px; 
            border: 2px solid #EE5D50; 
            transition: all 0.3s ease; 
        }
        
        /* تأثير النبض للوقت الحرج */
        .exam-timer.danger { 
            background: #EE5D50; 
            color: #ffffff; 
            animation: pulse 1s infinite; 
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(238, 93, 80, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(238, 93, 80, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(238, 93, 80, 0); }
        }

        /* حاوية الأسئلة */
        .exam-container { max-width: 850px; margin: 40px auto; padding: 0 20px; }
        
        .loader { text-align: center; margin-top: 100px; font-size: 22px; font-weight: 800; color: #a3aed1; animation: fadeIn 1s infinite alternate; }
        @keyframes fadeIn { from { opacity: 0.5; } to { opacity: 1; } }

        /* صندوق السؤال */
        .question-box { 
            background: #ffffff; 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
            margin-bottom: 30px; 
            border: 1px solid #e0e5f2; 
            transition: transform 0.3s ease, border-color 0.3s ease; 
        }
        .question-box:hover { border-color: #4318FF; transform: translateY(-3px); }
        .question-box h3 { 
            margin-top: 0; 
            color: #2b3674; 
            line-height: 1.6; 
            font-size: 20px; 
            border-bottom: 2px dashed #e0e5f2; 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
        }
        
        /* الاختيارات والتفاعلات */
        .options-list { display: flex; flex-direction: column; gap: 15px; }
        .option-label { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            background: #f4f7fe; 
            padding: 16px 20px; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            border: 2px solid transparent; 
            font-weight: 700; 
            font-size: 16px; 
            color: #2b3674; 
        }
        .option-label:hover { background: #eef2fa; border-color: #a3aed1; transform: translateX(-5px); }
        
        /* تفاعل CSS الحديث عند اختيار الإجابة */
        .option-label:has(input[type="radio"]:checked) {
            background: rgba(67, 24, 255, 0.05);
            border-color: #4318FF;
            color: #4318FF;
            box-shadow: 0 5px 15px rgba(67, 24, 255, 0.1);
        }
        .option-label input[type="radio"] { width: 22px; height: 22px; accent-color: #4318FF; cursor: pointer; }
        
        /* زر التسليم النهائي */
        .submit-exam-btn { 
            background: linear-gradient(135deg, #05CD99 0%, #04b082 100%); 
            color: white; 
            border: none; 
            padding: 20px; 
            border-radius: 15px; 
            font-weight: 800; 
            cursor: pointer; 
            width: 100%; 
            font-size: 22px; 
            margin-top: 30px; 
            transition: all 0.3s ease; 
            font-family: 'Cairo'; 
            box-shadow: 0 10px 25px rgba(5, 205, 153, 0.3); 
        }
        .submit-exam-btn:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(5, 205, 153, 0.4); }

        /* التجاوب مع شاشات الموبايل (Responsive) */
        @media (max-width: 768px) {
            .exam-header { flex-direction: column; gap: 15px; padding: 15px 20px; text-align: center; position: relative; }
            .exam-title { font-size: 18px; justify-content: center; }
            .exam-timer { width: 100%; justify-content: center; box-sizing: border-box; font-size: 16px; padding: 12px; }
            .exam-container { margin: 20px auto; padding: 0 15px; }
            .question-box { padding: 20px; border-radius: 15px; }
            .question-box h3 { font-size: 18px; }
            .option-label { font-size: 15px; padding: 12px 15px; }
            .submit-exam-btn { font-size: 18px; padding: 15px; }
        }
    </style>
</head>
<body class="exam-mode">

    <!-- الترويسة العلوية -->
    <div class="exam-header">
        <div class="exam-title" id="displayExamName">📝 جاري تحميل الامتحان...</div>
        <div class="exam-timer" id="timerDisplay">⏳ الوقت: --:--</div>
    </div>

    <!-- الحاوية الرئيسية للامتحان -->
    <div class="exam-container">
        <div id="loader" class="loader">جاري تجهيز الأسئلة... برجاء الانتظار ⏳</div>
        <form id="examForm" style="display: none;">
            <!-- سيتم توليد الأسئلة هنا ديناميكياً بواسطة الجافاسكريبت -->
        </form>
    </div>

    <script>
        // إعدادات Firebase الخاصة بمنصتك
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform",
            storageBucket: "dr-ahmed-rizk-platform.appspot.com",
            messagingSenderId: "117735726313",
            appId: "1:117735726313:web:2a58aa1c4be7137b53e478"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const currentPhone = localStorage.getItem('currentLoggedInStudent');
        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('id');

        let currentExamData = null;
        let timerInterval;
        let isSubmitting = false;

        // حماية الصفحة من الدخول المباشر بدون تسجيل دخول أو بدون رابط للامتحان
        if (!currentPhone || !examId) {
            window.location.href = "index.html";
        } else {
            checkIfAlreadyTaken();
        }

        // 1. التحقق: هل أدى الطالب هذا الامتحان من قبل؟
        function checkIfAlreadyTaken() {
            database.ref(`students/${currentPhone}/results/${examId}`).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    alert("❌ لقد قمت بأداء هذا الامتحان مسبقاً، لا يمكنك إعادته مرة أخرى.");
                    window.location.href = "index.html";
                } else {
                    fetchExamData();
                }
            });
        }

        // 2. جلب بيانات الامتحان من السيرفر
        function fetchExamData() {
            database.ref('exams/' + examId).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    currentExamData = snapshot.val();
                    document.getElementById('displayExamName').innerText = `📝 ${currentExamData.name}`;
                    renderQuestions(currentExamData.questions);
                    startTimer(currentExamData.duration);
                } else {
                    alert("⚠️ عذراً، هذا الامتحان لم يعد متاحاً.");
                    window.location.href = "index.html";
                }
            });
        }

        // 3. رسم الأسئلة على الشاشة باحترافية
        function renderQuestions(questions) {
            const form = document.getElementById('examForm');
            let htmlContent = '';
            
            // معالجة مصفوفة الأسئلة (لتفادي أي أخطاء من فايربيز)
            const questionsList = Array.isArray(questions) ? questions : Object.values(questions || {});

            questionsList.forEach((q, index) => {
                htmlContent += `
                <div class="question-box">
                    <h3>${index + 1}. ${q.questionText}</h3>
                    <div class="options-list">
                `;
                
                q.options.forEach((opt, optIndex) => {
                    htmlContent += `
                        <label class="option-label">
                            <input type="radio" name="q${index}" value="${optIndex}"> 
                            ${opt}
                        </label>
                    `;
                });

                htmlContent += `</div></div>`;
            });
            
            htmlContent += `<button type="button" class="submit-exam-btn" onclick="submitExam()">📤 تسليم الامتحان النهائي</button>`;
            
            form.innerHTML = htmlContent;
            document.getElementById('loader').style.display = 'none';
            form.style.display = 'block';
        }

        // 4. العداد التنازلي الذكي
        function startTimer(durationInMinutes) {
            let timeInSeconds = durationInMinutes * 60;
            const timerDisplay = document.getElementById('timerDisplay');

            timerInterval = setInterval(() => {
                timeInSeconds--;
                const minutes = Math.floor(timeInSeconds / 60);
                const seconds = timeInSeconds % 60;
                const formattedSeconds = seconds < 10 ? '0' + seconds : seconds;
                
                timerDisplay.innerText = `⏳ الوقت المتبقي: ${minutes}:${formattedSeconds}`;

                // تفعيل وضع الخطر في آخر 3 دقائق (180 ثانية)
                if (timeInSeconds <= 180 && !timerDisplay.classList.contains('danger')) {
                    timerDisplay.classList.add('danger');
                }

                // سحب الورقة تلقائياً عند انتهاء الوقت
                if (timeInSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert("⏱️ انتهى الوقت! سيتم تسليم إجاباتك الحالية تلقائياً.");
                    submitExam();
                }
            }, 1000);
        }

        // 5. التصحيح وتسجيل الإجابات في السيرفر (الجزء الأهم ليعمل الـ PDF)
        function submitExam() {
            if (isSubmitting) return; 
            isSubmitting = true;
            clearInterval(timerInterval); 
            
            let score = 0;
            let studentAnswersArray = []; // مصفوفة لحفظ الاختيارات لطباعتها في التقرير

            const questionsList = Array.isArray(currentExamData.questions) ? currentExamData.questions : Object.values(currentExamData.questions || {});
            
            questionsList.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
                
                if (selectedOption) {
                    let answerIndex = parseInt(selectedOption.value);
                    studentAnswersArray.push(answerIndex); // حفظ إجابة الطالب

                    if (answerIndex === q.correctAnswerIndex) {
                        score++;
                    }
                } else {
                    studentAnswersArray.push(null); // ترك السؤال فارغاً
                }
            });

            // تجهيز حزمة البيانات للرفع على السيرفر
            const resultData = {
                examName: currentExamData.name,
                score: score,
                total: questionsList.length,
                dateTaken: new Date().toLocaleString('ar-EG'),
                answers: studentAnswersArray // 🔥 مصفوفة الإجابات تم دمجها هنا 🔥
            };

            const updates = {};
            updates[`students/${currentPhone}/results/${examId}`] = resultData;
            updates[`exams/${examId}/results/${currentPhone}`] = score; // للإحصائيات الخاصة بلوحة التحكم

            // رفع البيانات وتوجيه الطالب لصفحة التقرير
            database.ref().update(updates).then(() => {
                localStorage.setItem('studentLastResult', JSON.stringify(resultData));
                alert(`🎉 تم تسليم الامتحان بنجاح!`);
                window.location.href = "result.html"; 
            }).catch(error => {
                alert("❌ حدث خطأ أثناء إرسال النتيجة. تأكد من اتصالك بالإنترنت.");
                isSubmitting = false;
            });
        }

        // ==========================================
        // نظام المراقبة الصارم ومنع الغش
        // ==========================================
        document.addEventListener('contextmenu', event => event.preventDefault()); // منع كليك يمين
        document.addEventListener('copy', event => event.preventDefault()); // منع النسخ
        document.addEventListener('cut', event => event.preventDefault()); 
        document.addEventListener('paste', event => event.preventDefault()); 

        let cheatWarnings = 0;
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && !isSubmitting) {
                cheatWarnings++;
                if (cheatWarnings === 1) {
                    alert("⚠️ تحذير: لقد قمت بالخروج من شاشة الامتحان! ممنوع فتح تطبيقات أو صفحات أخرى، يرجى عدم تكرار ذلك وإلا سيتم سحب الورقة تلقائياً."); 
                } else if (cheatWarnings >= 2) {
                    alert("❌ تم سحب ورقة الامتحان لانتهاك قواعد المراقبة (الخروج المتكرر من الصفحة)."); 
                    submitExam(); 
                }
            }
        });
    </script>
</body>
</html>
