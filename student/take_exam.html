<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداء الامتحان - منصة د. أحمد رزق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif !important; background-color: #f4f7fe !important; color: #2b3674 !important; margin: 0 !important; padding-bottom: 50px; user-select: none; }
        
        .exam-header { background: #ffffff; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 3px solid #4318FF; }
        .exam-title { font-size: 20px; font-weight: 800; color: #4318FF; }
        .exam-timer { background: rgba(238, 93, 80, 0.1); color: #EE5D50; padding: 10px 20px; border-radius: 12px; font-weight: 800; font-size: 18px; border: 1px solid #EE5D50; }
        
        .exam-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .question-box { background: #ffffff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); margin-bottom: 25px; border: 1px solid #e0e5f2; }
        .question-box h3 { margin-top: 0; color: #2b3674; line-height: 1.5; font-size: 18px; }
        
        .options-list { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .option-label { display: flex; align-items: center; gap: 10px; background: #f4f7fe; padding: 15px; border-radius: 12px; cursor: pointer; transition: 0.3s; border: 1px solid transparent; font-weight: 600; }
        .option-label:hover { background: #eef2fa; border-color: #4318FF; }
        .option-label input[type="radio"] { width: 20px; height: 20px; accent-color: #4318FF; cursor: pointer; }
        
        .submit-exam-btn { background: #05CD99; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; font-size: 18px; margin-top: 20px; transition: 0.3s; font-family: 'Cairo'; box-shadow: 0 10px 20px rgba(5, 205, 153, 0.2); }
        .submit-exam-btn:hover { background: #04b082; transform: translateY(-3px); }

        .loader { text-align: center; margin-top: 100px; font-size: 20px; font-weight: 700; color: #a3aed1; }

        @media (max-width: 768px) {
            .exam-header { flex-direction: column; gap: 15px; text-align: center; }
            .exam-container { margin: 20px auto; }
            .question-box { padding: 20px; }
        }
    </style>
</head>
<body class="exam-mode">

    <div class="exam-header">
        <div class="exam-title" id="displayExamName">📝 جاري تحميل الامتحان...</div>
        <div class="exam-timer" id="timerDisplay">⏳ الوقت: --:--</div>
    </div>

    <div class="exam-container">
        <div id="loader" class="loader">جاري تجهيز الأسئلة... برجاء الانتظار ⏳</div>
        <form id="examForm" style="display: none;">
            <!-- سيتم توليد الأسئلة هنا ديناميكياً -->
        </form>
    </div>

    <script>
        // إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform",
            storageBucket: "dr-ahmed-rizk-platform.appspot.com",
            messagingSenderId: "117735726313",
            appId: "1:117735726313:web:2a58aa1c4be7137b53e478"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const currentPhone = localStorage.getItem('currentLoggedInStudent');
        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('id');

        let currentExamData = null;
        let timerInterval;
        let isSubmitting = false;

        // حماية الصفحة من الدخول المباشر
        if (!currentPhone || !examId) {
            window.location.href = "index.html";
        } else {
            checkIfAlreadyTaken();
        }

        // 1. التحقق الذكي: هل الطالب امتحن قبل كده؟
        function checkIfAlreadyTaken() {
            database.ref(`students/${currentPhone}/results/${examId}`).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    alert("❌ لقد قمت بأداء هذا الامتحان مسبقاً، لا يمكنك إعادته.");
                    window.location.href = "index.html";
                } else {
                    fetchExamData();
                }
            });
        }

        // 2. جلب بيانات الامتحان من السيرفر
        function fetchExamData() {
            database.ref('exams/' + examId).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    currentExamData = snapshot.val();
                    document.getElementById('displayExamName').innerText = `📝 ${currentExamData.name}`;
                    renderQuestions(currentExamData.questions);
                    startTimer(currentExamData.duration);
                } else {
                    alert("⚠️ هذا الامتحان لم يعد متاحاً.");
                    window.location.href = "index.html";
                }
            });
        }

        // 3. رسم الأسئلة على الشاشة
        function renderQuestions(questions) {
            const form = document.getElementById('examForm');
            let htmlContent = '';
            
            questions.forEach((q, index) => {
                htmlContent += `
                <div class="question-box">
                    <h3>${index + 1}. ${q.questionText}</h3>
                    <div class="options-list">
                `;
                
                q.options.forEach((opt, optIndex) => {
                    htmlContent += `
                        <label class="option-label">
                            <input type="radio" name="q${index}" value="${optIndex}"> 
                            ${opt}
                        </label>
                    `;
                });

                htmlContent += `</div></div>`;
            });
            
            htmlContent += `<button type="button" class="submit-exam-btn" onclick="submitExam()">📤 تسليم الامتحان النهائي</button>`;
            
            form.innerHTML = htmlContent;
            document.getElementById('loader').style.display = 'none';
            form.style.display = 'block';
        }

        // 4. العداد التنازلي
        function startTimer(durationInMinutes) {
            let timeInSeconds = durationInMinutes * 60;
            const timerDisplay = document.getElementById('timerDisplay');

            timerInterval = setInterval(() => {
                timeInSeconds--;
                const minutes = Math.floor(timeInSeconds / 60);
                const seconds = timeInSeconds % 60;
                const formattedSeconds = seconds < 10 ? '0' + seconds : seconds;
                
                timerDisplay.innerText = `⏳ الوقت المتبقي: ${minutes}:${formattedSeconds}`;

                if (timeInSeconds <= 180) {
                    timerDisplay.style.background = "#EE5D50";
                    timerDisplay.style.color = "white";
                }

                if (timeInSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert("انتهى الوقت! سيتم تسليم الامتحان تلقائياً.");
                    submitExam();
                }
            }, 1000);
        }

        // 5. التصحيح ورفع النتيجة للسيرفر
        function submitExam() {
            if (isSubmitting) return; 
            isSubmitting = true;
            clearInterval(timerInterval); 
            
            let score = 0;
            const questions = currentExamData.questions;
            
            questions.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
                if (selectedOption && parseInt(selectedOption.value) === q.correctAnswerIndex) {
                    score++;
                }
            });

            const resultData = {
                examName: currentExamData.name,
                score: score,
                total: questions.length,
                dateTaken: new Date().toLocaleString('ar-EG')
            };

            const updates = {};
            updates[`students/${currentPhone}/results/${examId}`] = resultData;
            updates[`exams/${examId}/results/${currentPhone}`] = score;

            database.ref().update(updates).then(() => {
                localStorage.setItem('studentLastResult', JSON.stringify(resultData));
                alert(`تم تسليم الامتحان بنجاح!`);
                window.location.href = "result.html"; 
            }).catch(error => {
                alert("❌ حدث خطأ أثناء إرسال النتيجة. تأكد من اتصالك بالإنترنت.");
                isSubmitting = false;
            });
        }

        // منع الغش
        document.addEventListener('contextmenu', event => event.preventDefault()); 
        document.addEventListener('copy', event => event.preventDefault()); 
        document.addEventListener('cut', event => event.preventDefault()); 
        document.addEventListener('paste', event => event.preventDefault()); 

        let cheatWarnings = 0;
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && !isSubmitting) {
                cheatWarnings++;
                if (cheatWarnings === 1) {
                    alert("⚠️ تحذير: لقد قمت بالخروج من شاشة الامتحان للتو! يرجى عدم تكرار ذلك وإلا سيتم سحب الورقة تلقائياً."); 
                } else if (cheatWarnings >= 2) {
                    alert("❌ تم سحب ورقة الامتحان لانتهاك قواعد المراقبة (الخروج المتكرر من الصفحة)."); 
                    submitExam(); 
                }
            }
        });
    </script>
</body>
</html>
