<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب - المنصة التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- مكتبات Firebase و PDF -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #4318FF;
            --primary-hover: #2b3674;
            --success: #05CD99;
            --danger: #EE5D50;
            --dark-text: #2b3674;
            --bg-light: #f4f7fe;
            --card-bg: #ffffff;
            --border-color: #e0e5f2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body { background-color: var(--bg-light); color: var(--dark-text); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* القائمة الجانبية */
        .sidebar {
            width: 280px; background: var(--card-bg); padding: 30px 20px; 
            border-left: 1px solid var(--border-color); position: fixed; height: 100vh;
            box-shadow: 4px 0 20px rgba(0,0,0,0.02); z-index: 1000; transition: 0.3s;
        }
        
        .sidebar h3 { color: var(--primary); font-size: 24px; font-weight: 900; margin-bottom: 40px; text-align: center; }
        .sidebar ul { list-style: none; display: flex; flex-direction: column; gap: 15px; }
        .sidebar ul li a {
            display: flex; align-items: center; padding: 15px 20px; text-decoration: none;
            color: #a3aed1; font-weight: 700; border-radius: 12px; transition: 0.3s; font-size: 16px;
        }
        .sidebar ul li a.active, .sidebar ul li a:hover {
            background: rgba(67, 24, 255, 0.05); color: var(--primary);
        }

        /* المحتوى الرئيسي */
        .main-content {
            flex: 1; margin-right: 280px; padding: 40px 5%; width: calc(100% - 280px);
            animation: fadeIn 0.6s ease-out;
        }

        /* 🚀 الجزء الجديد: كارت الدكتور الأنيق */
        .doctor-header {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg); padding: 15px 25px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        .doctor-profile { display: flex; align-items: center; gap: 15px; }
        .doctor-profile img {
            width: 65px; height: 65px; border-radius: 50%; border: 3px solid var(--primary);
            object-fit: cover; box-shadow: 0 5px 15px rgba(67, 24, 255, 0.2);
        }
        .doctor-info h3 { margin: 0; color: var(--primary); font-size: 20px; font-weight: 900; }
        .doctor-info p { margin: 0; color: #64748b; font-size: 14px; font-weight: 700; }
        .platform-logo { font-size: 30px; }

        /* شريط المعلومات */
        .info-badge {
            background: var(--card-bg); padding: 20px 25px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid var(--border-color);
            display: inline-flex; align-items: center; gap: 15px; margin-bottom: 40px; flex-wrap: wrap;
        }
        .info-badge span { font-weight: 800; font-size: 16px; }

        /* العناوين والشبكة */
        .section-title { font-size: 22px; font-weight: 900; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }

        /* الكروت العصرية */
        .exam-card {
            background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid var(--border-color);
            box-shadow: 0 8px 25px rgba(0,0,0,0.03); transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .exam-card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(67, 24, 255, 0.08); border-color: var(--primary); }
        .exam-card.completed { border-top: 5px solid var(--success); background: #fdfdfd; }
        .exam-card.completed:hover { border-color: var(--success); }
        
        .exam-card h4 { font-size: 20px; font-weight: 800; margin-bottom: 15px; color: var(--dark-text); }
        .exam-card p { font-size: 15px; font-weight: 600; color: #64748b; margin-bottom: 10px; }
        .exam-card strong { color: var(--primary); }

        /* الأزرار القوية */
        .action-btn {
            display: block; width: 100%; text-align: center; padding: 14px; border-radius: 12px;
            font-weight: 800; font-size: 16px; transition: 0.3s; border: none; cursor: pointer; margin-top: 20px; font-family: 'Cairo';
        }
        .start-btn { background: linear-gradient(135deg, var(--primary) 0%, #6b4cff 100%); color: white; box-shadow: 0 5px 15px rgba(67, 24, 255, 0.2); }
        .start-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(67, 24, 255, 0.3); }
        
        .download-btn { background: rgba(5, 205, 153, 0.1); color: var(--success); border: 2px solid var(--success); }
        .download-btn:hover { background: var(--success); color: white; transform: translateY(-2px); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* استجابة الموبايل */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%; height: auto; position: relative; border-left: none; border-bottom: 1px solid var(--border-color);
                padding: 15px; display: flex; justify-content: space-between; align-items: center;
            }
            .sidebar h3 { margin: 0; font-size: 20px; }
            .sidebar ul { display: none; }
            .main-content { margin-right: 0; width: 100%; padding: 20px 5%; }
            .doctor-header { flex-direction: column; gap: 15px; text-align: center; align-items: center; }
            .doctor-profile { flex-direction: column; }
            .info-badge { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3 id="sidebarTitle">🎓 بوابة الطالب</h3>
        <ul>
            <li><a href="index.html" class="active">🏠 الرئيسية (اللوحة)</a></li>
            <li><a href="result.html">📊 تقارير الدرجات</a></li>
            <li><a href="#" onclick="logoutUser()" style="color: var(--danger);">🚪 تسجيل الخروج</a></li>
        </ul>
    </div>

    <div class="main-content">
        
        <!-- 🚀 كارت الدكتور في أعلى الصفحة -->
        <div class="doctor-header">
            <div class="doctor-profile">
                <!-- يمكنك تغيير رابط الصورة هنا بصورة الدكتور الحقيقية -->
             <img src="../assets/images/myphoto.jpg" alt="صورة د. أحمد رزق" id="doctorImage" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3774/3774299.png'">
                <div class="doctor-info">
                    <h3 id="doctorNameDisplay">د. أحمد رزق</h3>
                    <p>أستاذ المادة - منصة الامتحانات التفاعلية</p>
                </div>
            </div>
            <div class="platform-logo">👨‍🏫</div>
        </div>

        <h2 id="welcomeMessage" style="color: var(--primary); font-weight: 900; margin-bottom: 20px;">جاري تحميل البيانات... ⏳</h2>
        
        <div class="info-badge" id="studentInfoBadge">
            <span id="studentUniversityDisplay" style="color: var(--dark-text);"></span>
            <span id="studentSecondaryDisplay" style="color: var(--primary);"></span>
        </div>

        <div id="examsSection">
            <div class="section-title">📝 الامتحانات المتاحة الآن</div>
            <div class="cards-grid" id="availableExamsContainer">
                <p style="text-align: right; width: 100%; color: #64748b; font-weight: 600;">جاري البحث عن امتحانات تناسب مرحلتك...</p>
            </div>
        </div>

        <div style="margin-top: 60px;">
            <div class="section-title" style="color: var(--success);">✅ الامتحانات التي تم إنجازها</div>
            <div class="cards-grid" id="completedExamsContainer">
                <p style="text-align: right; width: 100%; color: #64748b; font-weight: 600;">جاري البحث عن سجل امتحاناتك...</p>
            </div>
        </div>
    </div>

    <script>
        // إعدادات فايربيز
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const currentPhone = localStorage.getItem('currentLoggedInStudent');
        let currentStudentData = null;

        // تطبيق الألوان واسم المنصة المحفوظ
        const savedColor = localStorage.getItem('primaryColor') || "#4318FF";
        document.documentElement.style.setProperty('--primary', savedColor);
        
        const platformName = localStorage.getItem('platformName') || "منصة د. أحمد رزق";
        document.title = `بوابة الطالب - ${platformName}`;
        
        // 🚀 جعل اسم الدكتور ديناميكي بناءً على إعدادات المنصة
        document.getElementById('doctorNameDisplay').innerText = platformName;

        const uniTranslations = { 'alex_uni': 'جامعة الإسكندرية', 'damanhour_uni': 'جامعة دمنهور', 'bachelor': 'بكالوريا', 'baccalaureate': 'بكالوريا' };
        const gradeTranslations = { 'year_1': 'الفرقة الأولى', 'year_2': 'الفرقة الثانية', 'year_3': 'الفرقة الثالثة', 'year_4': 'الفرقة الرابعة' };

        if (!currentPhone) {
            window.location.href = "../auth/login.html";
        } else {
            database.ref('students/' + currentPhone).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    currentStudentData = snapshot.val();
                    document.getElementById('welcomeMessage').innerText = `أهلاً بك يا بطل: ${currentStudentData.name} 🚀`;
                    
                    const uniKey = currentStudentData.university;
                    const gradeKey = currentStudentData.grade;
                    const centerVal = currentStudentData.center;
                    
                    document.getElementById('studentUniversityDisplay').innerText = `📍 ${uniTranslations[uniKey] || 'مرحلة غير محددة'}`;
                    
                    if (uniKey === 'bachelor' || uniKey === 'baccalaureate') {
                        document.getElementById('studentSecondaryDisplay').innerText = `| 🏢 السنتر: ${centerVal}`;
                    } else {
                        document.getElementById('studentSecondaryDisplay').innerText = `| 📚 ${gradeTranslations[gradeKey] || gradeKey}`;
                    }
                    
                    loadExams();
                } else {
                    logoutUser();
                }
            });
        }

      function loadExams() {
            const availableContainer = document.getElementById('availableExamsContainer');
            const completedContainer = document.getElementById('completedExamsContainer');
            
            database.ref(`students/${currentPhone}/results`).once('value').then(resultsSnapshot => {
                const studentResults = resultsSnapshot.val() || {};
                const completedExamIds = Object.keys(studentResults); 

                database.ref('exams').on('value', examsSnapshot => {
                    availableContainer.innerHTML = ''; completedContainer.innerHTML = '';
                    
                    if (examsSnapshot.exists()) {
                        const exams = examsSnapshot.val();
                        let hasAvailable = false, hasCompleted = false;

                        for (let examId in exams) {
                            const exam = exams[examId];
                            let isEligible = false;

                            // 1. توحيد مسمى البكالوريا لمنع خطأ عدم ظهور الامتحان
                            let studentUni = currentStudentData.university === 'bachelor' ? 'baccalaureate' : currentStudentData.university;
                            let examUni = exam.university === 'bachelor' ? 'baccalaureate' : exam.university;

                            // 2. الفلترة حسب المرحلة والسنتر
                            if (examUni === studentUni) {
                                if (studentUni === 'baccalaureate') {
                                    if (exam.center === currentStudentData.center || exam.center === "all") isEligible = true;
                                } else {
                                    if (exam.grade === currentStudentData.grade) isEligible = true;
                                }
                            }

                            // 3. فلترة الأرشيف والمواعيد (عشان الامتحان يظهر في وقته بس)
                            if (exam.isArchived === true) isEligible = false;

                            if (isEligible && exam.startDate && exam.endDate) {
                                const now = new Date();
                                const start = new Date(exam.startDate);
                                const end = new Date(exam.endDate);
                                
                                // لو الوقت لسه مجاش أو خلص، نخفي الامتحان
                                if (now < start || now > end) {
                                    isEligible = false; 
                                }
                            }

                            // 4. عرض الامتحان لو اجتاز كل الفلاتر
                            if (isEligible) {
                                if (completedExamIds.includes(examId)) {
                                    hasCompleted = true;
                                    const res = studentResults[examId];
                                    completedContainer.innerHTML += `
                                        <div class="exam-card completed">
                                            <h4 style="color: var(--success);"><span style="font-size: 22px;">✅</span> ${exam.name}</h4>
                                            <p>📌 درجتك: <strong style="color: var(--success); font-size: 16px;">${res.score} / ${res.total}</strong></p>
                                            <p>📅 تاريخ الحل: ${res.dateTaken.split(',')[0]}</p>
                                            <button class="action-btn download-btn" onclick="downloadExamReport('${examId}')">📥 تحميل تقرير الإجابات</button>
                                        </div>`;
                                } else {
                                    hasAvailable = true;
                                    availableContainer.innerHTML += `
                                        <div class="exam-card">
                                            <h4>${exam.name}</h4>
                                            <p>⏳ المدة: <strong>${exam.duration} دقيقة</strong></p>
                                            <p>📋 عدد الأسئلة: <strong>${exam.totalQuestions} سؤال</strong></p>
                                            <button class="action-btn start-btn" onclick="goToExam('${examId}')">▶️ ابدأ الامتحان الآن</button>
                                        </div>`;
                                }
                            }
                        }
                        if (!hasAvailable) availableContainer.innerHTML = '<p style="text-align: right; width: 100%; color: #64748b; font-weight: 600;">لا توجد امتحانات متاحة لمرحلتك الدراسية حالياً أو لم يحن موعدها بعد.</p>';
                        if (!hasCompleted) completedContainer.innerHTML = '<p style="text-align: right; width: 100%; color: #64748b; font-weight: 600;">لم تقم بإنجاز أي امتحانات حتى الآن.</p>';
                    }
                });
            });
        }
        
        function goToExam(examId) { window.location.href = `take_exam.html?id=${examId}`; }
        function logoutUser() { localStorage.removeItem('currentLoggedInStudent'); window.location.href = "../auth/login.html"; }
        
        function downloadExamReport(examId) {
            alert("⏳ جاري تجهيز التقرير التفصيلي... يرجى الانتظار ثواني قليلة.");
            database.ref('exams/' + examId).once('value').then(examSnap => {
                const examData = examSnap.val();
                database.ref(`students/${currentPhone}/results/${examId}`).once('value').then(resSnap => {
                    const resData = resSnap.val();
                    const percentage = ((resData.score / resData.total) * 100).toFixed(1);
                    const statusColor = percentage >= 50 ? "#05CD99" : "#EE5D50";
                    const statusText = percentage >= 50 ? "ناجح" : "راسب";

                    let htmlContent = `
                        <div style="width: 800px; padding: 20px; font-family: 'Cairo', sans-serif; direction: rtl; text-align: right; background-color: #fff; color: #2b3674;">
                            <div style="text-align: center; border-bottom: 3px solid #4318FF; padding-bottom: 15px; margin-bottom: 30px;">
                                <h1 style="color: #4318FF; margin: 0; font-size: 28px;">${platformName}</h1>
                                <h2 style="color: #a3aed1; margin: 10px 0 0 0; font-size: 18px;">تقرير أداء طالب ونموذج الإجابة</h2>
                            </div>
                            <div style="background: #f4f7fe; padding: 20px; border-radius: 15px; margin-bottom: 30px; border: 1px solid #e0e5f2;">
                                <table style="width: 100%; font-size: 16px; font-weight: bold; border:none; text-align: right;">
                                    <tr>
                                        <td style="padding: 10px; border:none;">👨‍🎓 اسم الطالب: <span style="color: #4318FF;">${currentStudentData.name}</span></td>
                                        <td style="padding: 10px; border:none;">📝 اسم الامتحان: ${resData.examName || examData.name}</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 10px; border:none;">📅 تاريخ الأداء: ${resData.dateTaken.split(',')[0]}</td>
                                        <td style="padding: 10px; border:none;">📌 الدرجة المحصلة: <span style="color: ${statusColor};">${resData.score} / ${resData.total}</span></td>
                                    </tr>
                                    <tr>
                                        <td colspan="2" style="padding: 10px; border:none;">📊 النسبة المئوية: <span style="color: ${statusColor};">${percentage}%</span> (${statusText})</td>
                                    </tr>
                                </table>
                            </div>
                            <h3 style="border-bottom: 2px dashed #e0e5f2; padding-bottom: 10px; margin-bottom: 20px; color: #2b3674;">📝 تفاصيل الإجابات:</h3>
                    `;

                    const questionsList = Array.isArray(examData.questions) ? examData.questions : Object.values(examData.questions || {});
                    const studentAnswers = resData.answers || {}; 

                    questionsList.forEach((q, idx) => {
                        let studentAnswerIndex = studentAnswers[idx];
                        let isCorrect = (studentAnswerIndex == q.correctAnswerIndex);
                        let answerColor = isCorrect ? "#05CD99" : "#EE5D50"; 
                        let studentAnswerText = (studentAnswerIndex !== undefined && studentAnswerIndex !== null) ? q.options[studentAnswerIndex] : "لم يقم بالإجابة";

                        htmlContent += `
                            <div style="margin-bottom: 15px; padding: 15px; border: 1px solid #e0e5f2; border-radius: 10px; background: #f9fbfd; page-break-inside: avoid;">
                                <h4 style="margin: 0 0 10px 0; color: #2b3674; font-size: 16px;">س${idx + 1}: ${q.questionText}</h4>
                                <p style="margin: 5px 0; color: ${answerColor}; font-weight: 700; font-size: 14px;">
                                    ${isCorrect ? '✅ إجابتك صحيحة:' : '❌ إجابتك خاطئة:'} ${studentAnswerText}
                                </p>
                                ${!isCorrect ? `
                                <p style="margin: 5px 0; color: #05CD99; font-weight: 800; font-size: 14px;">
                                    🎯 الإجابة الصحيحة هي: ${q.options[q.correctAnswerIndex]}
                                </p>` : ''}
                            </div>
                        `;
                    });

                    htmlContent += `</div>`;

                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = htmlContent;
                    tempDiv.style.width = "800px"; tempDiv.style.position = "absolute"; tempDiv.style.top = "0"; tempDiv.style.left = "0"; tempDiv.style.opacity = "0"; tempDiv.style.pointerEvents = "none"; tempDiv.style.zIndex = "-9999";
                    document.body.appendChild(tempDiv);

                    const opt = {
                        margin: 10, filename: `تقرير_${currentStudentData.name}_الامتحان.pdf`, image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true, windowWidth: 800 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };

                    html2pdf().set(opt).from(tempDiv).save().then(() => { document.body.removeChild(tempDiv); });
                });
            });
        }
    </script>
</body>
</html>
