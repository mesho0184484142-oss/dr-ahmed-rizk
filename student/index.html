<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب - منصة د. أحمد رزق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- ربط ملف التصميم الموحد للطالب -->
    <link rel="stylesheet" href="../assets/css/student.css">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- مكتبة تحويل HTML إلى PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <h3 id="sidebarTitle">🎓 بوابة الطالب</h3>
        <ul>
            <li><a href="index.html" class="active">🏠 الرئيسية (اللوحة)</a></li>
            <li><a href="#examsSection">📝 امتحاناتي</a></li>
            <li><a href="result.html">📊 تقارير الدرجات</a></li>
            <li><a href="#" onclick="logoutUser()">🚪 تسجيل الخروج</a></li>
        </ul>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <h2 id="welcomeMessage">جاري تحميل البيانات... ⏳</h2>
        <p id="studentCenter" style="color: var(--secondary); font-weight: 700; margin-bottom: 30px; font-size: 16px;"></p>

        <!-- قسم الامتحانات المتاحة -->
        <div id="examsSection">
            <div class="section-title">📝 الامتحانات المتاحة الآن</div>
            <div class="cards-grid" id="availableExamsContainer">
                <p style="text-align: right; width: 100%; color: var(--secondary);">جاري البحث عن امتحانات...</p>
            </div>
        </div>

        <!-- قسم الامتحانات المنجزة -->
        <div style="margin-top: 50px;">
            <div class="section-title" style="border-bottom-color: var(--success); color: var(--success);">✅ الامتحانات التي تم إنجازها</div>
            <div class="cards-grid" id="completedExamsContainer">
                <p style="text-align: right; width: 100%; color: var(--secondary);">جاري البحث عن امتحانات سابقة...</p>
            </div>
        </div>
    </div>

    <script>
        // إعدادات فايربيز
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform",
            storageBucket: "dr-ahmed-rizk-platform.appspot.com",
            messagingSenderId: "117735726313",
            appId: "1:117735726313:web:2a58aa1c4be7137b53e478"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const currentPhone = localStorage.getItem('currentLoggedInStudent');
        let currentStudentData = null;

        // تطبيق إعدادات الاسم للمنصة
        const platformName = localStorage.getItem('platformName') || "منصة د. أحمد رزق";
        document.title = `بوابة الطالب - ${platformName}`;

        if (!currentPhone) {
            window.location.href = "../auth/login.html";
        } else {
            database.ref('students/' + currentPhone).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    currentStudentData = snapshot.val();
                    document.getElementById('welcomeMessage').innerText = `أهلاً بك يا بطل: ${currentStudentData.name} 🚀`;
                    document.getElementById('studentCenter').innerText = `📍 السنتر: ${currentStudentData.center}`;
                    loadExams();
                } else {
                    alert("⚠️ تم إغلاق أو حذف حسابك من قبل الإدارة.");
                    logoutUser();
                }
            });
        }

        function loadExams() {
            const availableContainer = document.getElementById('availableExamsContainer');
            const completedContainer = document.getElementById('completedExamsContainer');
            
            database.ref(`students/${currentPhone}/results`).once('value').then(resultsSnapshot => {
                const studentResults = resultsSnapshot.val() || {};
                const completedExamIds = Object.keys(studentResults); 

                database.ref('exams').on('value', examsSnapshot => {
                    availableContainer.innerHTML = ''; 
                    completedContainer.innerHTML = '';

                    if (examsSnapshot.exists()) {
                        const exams = examsSnapshot.val();
                        let hasAvailable = false;
                        let hasCompleted = false;

                        for (let examId in exams) {
                            const exam = exams[examId];
                            
                            if (exam.center === "all" || exam.center === currentStudentData.center) {
                                if (completedExamIds.includes(examId)) {
                                    hasCompleted = true;
                                    const res = studentResults[examId];
                                    completedContainer.innerHTML += `
                                        <div class="exam-card" style="border-top-color: var(--success); background: #f4fff9;">
                                            <h4 style="color: var(--success);">✅ ${exam.name}</h4>
                                            <p>📌 درجتك: <strong style="color: var(--success);">${res.score} / ${res.total}</strong></p>
                                            <p>📅 تاريخ الحل: ${res.dateTaken.split(',')[0]}</p>
                                            <button class="download-btn" onclick="downloadExamReport('${examId}')">📥 تحميل تقرير الإجابات</button>
                                        </div>
                                    `;
                                } else {
                                    hasAvailable = true;
                                    availableContainer.innerHTML += `
                                        <div class="exam-card">
                                            <h4>${exam.name}</h4>
                                            <p>⏳ المدة: ${exam.duration} دقيقة</p>
                                            <p>📋 عدد الأسئلة: ${exam.totalQuestions} سؤال</p>
                                            <button class="start-btn" onclick="goToExam('${exam.id}')">▶️ ابدأ الامتحان الآن</button>
                                        </div>
                                    `;
                                }
                            }
                        }

                        if (!hasAvailable) availableContainer.innerHTML = '<p style="text-align: right; width: 100%; color: var(--secondary);">لا توجد امتحانات متاحة لك حالياً.</p>';
                        if (!hasCompleted) completedContainer.innerHTML = '<p style="text-align: right; width: 100%; color: var(--secondary);">لم تقم بإنجاز أي امتحانات حتى الآن.</p>';

                    } else {
                        availableContainer.innerHTML = '<p style="text-align: right; width: 100%; color: var(--secondary);">لا توجد امتحانات في النظام.</p>';
                        completedContainer.innerHTML = '<p style="text-align: right; width: 100%; color: var(--secondary);">لم تقم بإنجاز امتحانات.</p>';
                    }
                });
            });
        }

// =========================================
        // وظيفة توليد وتحميل ملف الـ PDF (النسخة المعدلة 🚀)
        // =========================================
        function downloadExamReport(examId) {
            alert("⏳ جاري تجهيز التقرير التفصيلي... يرجى الانتظار ثواني قليلة.");

            database.ref('exams/' + examId).once('value').then(examSnap => {
                const examData = examSnap.val();

                database.ref(`students/${currentPhone}/results/${examId}`).once('value').then(resSnap => {
                    const resData = resSnap.val();
                    const percentage = ((resData.score / resData.total) * 100).toFixed(1);
                    const statusColor = percentage >= 50 ? "#05CD99" : "#EE5D50";
                    const statusText = percentage >= 50 ? "ناجح" : "راسب";

                    // تجهيز كود الـ HTML كنص مباشر (بدون إضافته للشاشة)
                    let htmlContent = `
                        <div style="width: 100%; max-width: 800px; padding: 20px; font-family: 'Cairo', sans-serif; direction: rtl; text-align: right; background-color: #fff; color: #2b3674;">
                            
                            <div style="text-align: center; border-bottom: 3px solid #4318FF; padding-bottom: 15px; margin-bottom: 30px;">
                                <h1 style="color: #4318FF; margin: 0; font-size: 28px;">${platformName}</h1>
                                <h2 style="color: #a3aed1; margin: 10px 0 0 0; font-size: 18px;">تقرير أداء طالب ونموذج الإجابة</h2>
                            </div>

                            <div style="background: #f4f7fe; padding: 20px; border-radius: 15px; margin-bottom: 30px; border: 1px solid #e0e5f2;">
                                <table style="width: 100%; font-size: 16px; font-weight: bold; border:none; text-align: right;">
                                    <tr>
                                        <td style="padding: 10px; border:none;">👨‍🎓 اسم الطالب: <span style="color: #4318FF;">${currentStudentData.name}</span></td>
                                        <td style="padding: 10px; border:none;">📝 اسم الامتحان: ${resData.examName}</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 10px; border:none;">📅 تاريخ الأداء: ${resData.dateTaken.split(',')[0]}</td>
                                        <td style="padding: 10px; border:none;">📌 الدرجة المحصلة: <span style="color: ${statusColor};">${resData.score} / ${resData.total}</span></td>
                                    </tr>
                                    <tr>
                                        <td colspan="2" style="padding: 10px; border:none;">📊 النسبة المئوية: <span style="color: ${statusColor};">${percentage}%</span> (${statusText})</td>
                                    </tr>
                                </table>
                            </div>

                            <h3 style="border-bottom: 2px dashed #e0e5f2; padding-bottom: 10px; margin-bottom: 20px; color: #2b3674;">📝 تفاصيل الإجابات:</h3>
                    `;

                    // جلب الأسئلة وإجابات الطالب
                    const questionsList = Array.isArray(examData.questions) ? examData.questions : Object.values(examData.questions || {});
                    const studentAnswers = resData.answers || {}; 

                    questionsList.forEach((q, idx) => {
                        let studentAnswerIndex = studentAnswers[idx];
                        let isCorrect = (studentAnswerIndex == q.correctAnswerIndex);
                        let answerColor = isCorrect ? "#05CD99" : "#EE5D50"; 
                        
                        let studentAnswerText = (studentAnswerIndex !== undefined && studentAnswerIndex !== null) 
                                                ? q.options[studentAnswerIndex] 
                                                : "لم يقم بالإجابة";

                        // إضافة الأسئلة للتقرير (page-break-inside: avoid تمنع قص السؤال بين صفحتين)
                        htmlContent += `
                            <div style="margin-bottom: 15px; padding: 15px; border: 1px solid #e0e5f2; border-radius: 10px; background: #f9fbfd; page-break-inside: avoid;">
                                <h4 style="margin: 0 0 10px 0; color: #2b3674; font-size: 16px;">س${idx + 1}: ${q.questionText}</h4>
                                <p style="margin: 5px 0; color: ${answerColor}; font-weight: 700; font-size: 14px;">
                                    ${isCorrect ? '✅ إجابتك صحيحة:' : '❌ إجابتك خاطئة:'} ${studentAnswerText}
                                </p>
                                ${!isCorrect ? `
                                <p style="margin: 5px 0; color: #05CD99; font-weight: 800; font-size: 14px;">
                                    🎯 الإجابة الصحيحة هي: ${q.options[q.correctAnswerIndex]}
                                </p>
                                ` : ''}
                            </div>
                        `;
                    });

                    // إغلاق الديف الرئيسي
                    htmlContent += `</div>`;

                    // إعدادات الطباعة
                    const opt = {
                        margin:       10,
                        filename:     `تقرير_${currentStudentData.name}_${resData.examName}.pdf`,
                        image:        { type: 'jpeg', quality: 1 },
                        html2canvas:  { scale: 2, useCORS: true }, 
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };

                    // توليد الـ PDF من النص مباشرة بدون اللعب في الشاشة
                    html2pdf().set(opt).from(htmlContent).save();
                });
            });
        }

        function goToExam(examId) { window.location.href = `take_exam.html?id=${examId}`; }
        
        function logoutUser() { 
            localStorage.removeItem('currentLoggedInStudent'); 
            window.location.href = "../auth/login.html"; 
        }
    </script>
</body>
</html>
