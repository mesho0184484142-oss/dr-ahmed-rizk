<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب - المنصة التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- ربط ملف التصميم الموحد للطالب -->
    <link rel="stylesheet" href="../assets/css/student.css">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- مكتبة تحويل HTML إلى PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <h3 id="sidebarTitle">🎓 بوابة الطالب</h3>
        <ul>
            <li><a href="index.html" class="active">🏠 الرئيسية (اللوحة)</a></li>
            <li><a href="#examsSection">📝 امتحاناتي</a></li>
            <li><a href="result.html">📊 تقارير الدرجات</a></li>
            <li><a href="#" onclick="logoutUser()" style="color: #ee5d50;">🚪 تسجيل الخروج</a></li>
        </ul>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <h2 id="welcomeMessage" style="color: var(--primary); font-weight: 800;">جاري تحميل البيانات... ⏳</h2>
        
        <!-- شريط معلومات الطالب الديناميكي -->
        <div id="studentInfoBadge" style="background: #f4f7fe; padding: 15px 20px; border-radius: 10px; margin-bottom: 30px; border: 1px solid #e0e5f2; display: inline-block;">
            <span id="studentUniversityDisplay" style="color: #2b3674; font-weight: 700; font-size: 16px; margin-left: 15px;"></span>
            <span id="studentSecondaryDisplay" style="color: #4318FF; font-weight: 800; font-size: 16px;"></span>
        </div>

        <!-- قسم الامتحانات المتاحة -->
        <div id="examsSection">
            <div class="section-title">📝 الامتحانات المتاحة الآن</div>
            <div class="cards-grid" id="availableExamsContainer">
                <p style="text-align: right; width: 100%; color: var(--secondary);">جاري البحث عن امتحانات تناسب مرحلتك...</p>
            </div>
        </div>

        <!-- قسم الامتحانات المنجزة -->
        <div style="margin-top: 50px;">
            <div class="section-title" style="border-bottom-color: #05CD99; color: #05CD99;">✅ الامتحانات التي تم إنجازها</div>
            <div class="cards-grid" id="completedExamsContainer">
                <p style="text-align: right; width: 100%; color: var(--secondary);">جاري البحث عن سجل امتحاناتك...</p>
            </div>
        </div>
    </div>

    <script>
        // إعدادات فايربيز
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform",
            storageBucket: "dr-ahmed-rizk-platform.appspot.com",
            messagingSenderId: "117735726313",
            appId: "1:117735726313:web:2a58aa1c4be7137b53e478"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const currentPhone = localStorage.getItem('currentLoggedInStudent');
        let currentStudentData = null;

        // تطبيق إعدادات الاسم للمنصة
        const platformName = localStorage.getItem('platformName') || "منصة د. أحمد رزق";
        document.title = `بوابة الطالب - ${platformName}`;

        // قواميس لترجمة المصطلحات البرمجية إلى نصوص عربية للواجهة
        const uniTranslations = {
            'alex_uni': 'جامعة الإسكندرية',
            'damanhour_uni': 'جامعة دمنهور',
            'bachelor': 'بكالوريا',
            'baccalaureate': 'بكالوريا'
        };

        const gradeTranslations = {
            'year_1': 'الفرقة الأولى',
            'year_2': 'الفرقة الثانية',
            'year_3': 'الفرقة الثالثة',
            'year_4': 'الفرقة الرابعة'
        };

        if (!currentPhone) {
            window.location.href = "../auth/login.html";
        } else {
            database.ref('students/' + currentPhone).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    currentStudentData = snapshot.val();
                    
                    // 1. تحديث رسالة الترحيب
                    document.getElementById('welcomeMessage').innerText = `أهلاً بك يا بطل: ${currentStudentData.name} 🚀`;
                    
                    // 2. تحديث شريط المعلومات ديناميكياً بناءً على الجامعة/المرحلة
                    const uniKey = currentStudentData.university;
                    const gradeKey = currentStudentData.grade;
                    const centerVal = currentStudentData.center;
                    
                    document.getElementById('studentUniversityDisplay').innerText = `📍 ${uniTranslations[uniKey] || 'مرحلة غير محددة'}`;
                    
                    if (uniKey === 'bachelor' || uniKey === 'baccalaureate') {
                        // طالب بكالوريا يظهر له السنتر
                        document.getElementById('studentSecondaryDisplay').innerText = `| 🏢 السنتر: ${centerVal}`;
                    } else {
                        // طالب جامعة يظهر له الفرقة
                        document.getElementById('studentSecondaryDisplay').innerText = `| 📚 ${gradeTranslations[gradeKey] || gradeKey}`;
                    }

                    // 3. جلب الامتحانات
                    loadExams();
                } else {
                    alert("⚠️ تم إغلاق أو حذف حسابك من قبل الإدارة.");
                    logoutUser();
                }
            });
        }

        function loadExams() {
            const availableContainer = document.getElementById('availableExamsContainer');
            const completedContainer = document.getElementById('completedExamsContainer');
            
            database.ref(`students/${currentPhone}/results`).once('value').then(resultsSnapshot => {
                const studentResults = resultsSnapshot.val() || {};
                const completedExamIds = Object.keys(studentResults); 

                database.ref('exams').on('value', examsSnapshot => {
                    availableContainer.innerHTML = ''; 
                    completedContainer.innerHTML = '';

                    if (examsSnapshot.exists()) {
                        const exams = examsSnapshot.val();
                        let hasAvailable = false;
                        let hasCompleted = false;

                        for (let examId in exams) {
                            const exam = exams[examId];
                            let isEligible = false;

                            // 🌟 خوارزمية الفلترة الذكية (الجامعة vs البكالوريا)
                            if (exam.university === currentStudentData.university) {
                                
                                if (currentStudentData.university === 'bachelor' || currentStudentData.university === 'baccalaureate') {
                                    // إذا كان بكالوريا: نقارن بالسنتر فقط
                                    if (exam.center === currentStudentData.center || exam.center === "all") {
                                        isEligible = true;
                                    }
                                } else {
                                    // إذا كان جامعة إسكندرية أو دمنهور: نقارن بالفرقة الدراسية فقط
                                    if (exam.grade === currentStudentData.grade) {
                                        isEligible = true;
                                    }
                                }
                            }

                            // إذا كان الطالب يحق له رؤية هذا الامتحان بناءً على الفلترة السابقة
                            if (isEligible) {
                                if (completedExamIds.includes(examId)) {
                                    hasCompleted = true;
                                    const res = studentResults[examId];
                                    completedContainer.innerHTML += `
                                        <div class="exam-card" style="border-top-color: #05CD99; background: #f4fff9; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                                            <h4 style="color: #05CD99; margin-top: 0;">✅ ${exam.name}</h4>
                                            <p style="margin: 8px 0; font-weight: 600;">📌 درجتك: <strong style="color: #05CD99;">${res.score} / ${res.total}</strong></p>
                                            <p style="margin: 8px 0; font-size: 14px; color: #666;">📅 تاريخ الحل: ${res.dateTaken.split(',')[0]}</p>
                                            <button class="download-btn" onclick="downloadExamReport('${examId}')" style="width: 100%; margin-top: 15px; background: transparent; border: 2px solid #05CD99; color: #05CD99; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer;">📥 تحميل تقرير الإجابات</button>
                                        </div>
                                    `;
                                } else {
                                    hasAvailable = true;
                                    availableContainer.innerHTML += `
                                        <div class="exam-card" style="padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); background: #fff;">
                                            <h4 style="color: var(--primary); margin-top: 0;">${exam.name}</h4>
                                            <p style="margin: 8px 0; font-size: 14px; color: #555;">⏳ المدة: <strong>${exam.duration} دقيقة</strong></p>
                                            <p style="margin: 8px 0; font-size: 14px; color: #555;">📋 عدد الأسئلة: <strong>${exam.totalQuestions} سؤال</strong></p>
                                            <button class="start-btn" onclick="goToExam('${examId}')" style="width: 100%; margin-top: 15px; background: var(--primary); border: none; color: #fff; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">▶️ ابدأ الامتحان الآن</button>
                                        </div>
                                    `;
                                }
                            }
                        }

                        if (!hasAvailable) availableContainer.innerHTML = '<p style="text-align: right; width: 100%; color: #888; font-weight: 600;">لا توجد امتحانات متاحة لمرحلتك الدراسية حالياً.</p>';
                        if (!hasCompleted) completedContainer.innerHTML = '<p style="text-align: right; width: 100%; color: #888; font-weight: 600;">لم تقم بإنجاز أي امتحانات حتى الآن.</p>';

                    } else {
                        availableContainer.innerHTML = '<p style="text-align: right; width: 100%; color: #888; font-weight: 600;">لا توجد امتحانات في النظام.</p>';
                        completedContainer.innerHTML = '<p style="text-align: right; width: 100%; color: #888; font-weight: 600;">لم تقم بإنجاز امتحانات.</p>';
                    }
                });
            });
        }

        // وظيفة توليد وتحميل ملف الـ PDF (نفس الكود الاحترافي السابق)
        function downloadExamReport(examId) {
            alert("⏳ جاري تجهيز التقرير التفصيلي... يرجى الانتظار ثواني قليلة.");

            database.ref('exams/' + examId).once('value').then(examSnap => {
                const examData = examSnap.val();

                database.ref(`students/${currentPhone}/results/${examId}`).once('value').then(resSnap => {
                    const resData = resSnap.val();
                    const percentage = ((resData.score / resData.total) * 100).toFixed(1);
                    const statusColor = percentage >= 50 ? "#05CD99" : "#EE5D50";
                    const statusText = percentage >= 50 ? "ناجح" : "راسب";

                    let htmlContent = `
                        <div style="width: 800px; padding: 20px; font-family: 'Cairo', sans-serif; direction: rtl; text-align: right; background-color: #fff; color: #2b3674;">
                            
                            <div style="text-align: center; border-bottom: 3px solid #4318FF; padding-bottom: 15px; margin-bottom: 30px;">
                                <h1 style="color: #4318FF; margin: 0; font-size: 28px;">${platformName}</h1>
                                <h2 style="color: #a3aed1; margin: 10px 0 0 0; font-size: 18px;">تقرير أداء طالب ونموذج الإجابة</h2>
                            </div>

                            <div style="background: #f4f7fe; padding: 20px; border-radius: 15px; margin-bottom: 30px; border: 1px solid #e0e5f2;">
                                <table style="width: 100%; font-size: 16px; font-weight: bold; border:none; text-align: right;">
                                    <tr>
                                        <td style="padding: 10px; border:none;">👨‍🎓 اسم الطالب: <span style="color: #4318FF;">${currentStudentData.name}</span></td>
                                        <td style="padding: 10px; border:none;">📝 اسم الامتحان: ${resData.examName || examData.name}</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 10px; border:none;">📅 تاريخ الأداء: ${resData.dateTaken.split(',')[0]}</td>
                                        <td style="padding: 10px; border:none;">📌 الدرجة المحصلة: <span style="color: ${statusColor};">${resData.score} / ${resData.total}</span></td>
                                    </tr>
                                    <tr>
                                        <td colspan="2" style="padding: 10px; border:none;">📊 النسبة المئوية: <span style="color: ${statusColor};">${percentage}%</span> (${statusText})</td>
                                    </tr>
                                </table>
                            </div>

                            <h3 style="border-bottom: 2px dashed #e0e5f2; padding-bottom: 10px; margin-bottom: 20px; color: #2b3674;">📝 تفاصيل الإجابات:</h3>
                    `;

                    const questionsList = Array.isArray(examData.questions) ? examData.questions : Object.values(examData.questions || {});
                    const studentAnswers = resData.answers || {}; 

                    questionsList.forEach((q, idx) => {
                        let studentAnswerIndex = studentAnswers[idx];
                        let isCorrect = (studentAnswerIndex == q.correctAnswerIndex);
                        let answerColor = isCorrect ? "#05CD99" : "#EE5D50"; 
                        
                        let studentAnswerText = (studentAnswerIndex !== undefined && studentAnswerIndex !== null) 
                                                ? q.options[studentAnswerIndex] 
                                                : "لم يقم بالإجابة";

                        htmlContent += `
                            <div style="margin-bottom: 15px; padding: 15px; border: 1px solid #e0e5f2; border-radius: 10px; background: #f9fbfd; page-break-inside: avoid;">
                                <h4 style="margin: 0 0 10px 0; color: #2b3674; font-size: 16px;">س${idx + 1}: ${q.questionText}</h4>
                                <p style="margin: 5px 0; color: ${answerColor}; font-weight: 700; font-size: 14px;">
                                    ${isCorrect ? '✅ إجابتك صحيحة:' : '❌ إجابتك خاطئة:'} ${studentAnswerText}
                                </p>
                                ${!isCorrect ? `
                                <p style="margin: 5px 0; color: #05CD99; font-weight: 800; font-size: 14px;">
                                    🎯 الإجابة الصحيحة هي: ${q.options[q.correctAnswerIndex]}
                                </p>
                                ` : ''}
                            </div>
                        `;
                    });

                    htmlContent += `</div>`;

                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = htmlContent;
                    tempDiv.style.width = "800px"; 
                    tempDiv.style.position = "absolute";
                    tempDiv.style.top = "0";
                    tempDiv.style.left = "0";
                    tempDiv.style.opacity = "0"; 
                    tempDiv.style.pointerEvents = "none"; 
                    tempDiv.style.zIndex = "-9999";
                    
                    document.body.appendChild(tempDiv);

                    const opt = {
                        margin:       10,
                        filename:     `تقرير_${currentStudentData.name}_الامتحان.pdf`,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2, useCORS: true, windowWidth: 800 }, 
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };

                    html2pdf().set(opt).from(tempDiv).save().then(() => {
                        document.body.removeChild(tempDiv); 
                    });
                });
            });
        }

        function goToExam(examId) { window.location.href = `take_exam.html?id=${examId}`; }
        
        function logoutUser() { 
            localStorage.removeItem('currentLoggedInStudent'); 
            window.location.href = "../auth/login.html"; 
        }
    </script>
</body>
</html>
