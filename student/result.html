<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير الدرجات - منصة د. أحمد رزق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- ربط ملف التصميم الموحد للطالب -->
    <link rel="stylesheet" href="../assets/css/student.css">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* تنسيقات إضافية خاصة بكروت النتائج */
        .result-card { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
            margin-bottom: 25px; 
            border: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 20px; 
            transition: all 0.3s ease; 
        }
        
        .result-card:hover { 
            transform: translateY(-5px); 
            border-color: var(--primary); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
        }
        
        .exam-info h4 { 
            margin: 0 0 15px 0; 
            color: var(--primary); 
            font-size: 22px; 
            font-weight: 800;
        }
        
        .exam-info p { 
            margin: 8px 0; 
            color: var(--secondary); 
            font-weight: 700; 
            font-size: 15px; 
        }
        
        .score-circle { 
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            font-size: 24px; 
            font-weight: 800; 
            color: white; 
            direction: ltr; 
        }

        .score-circle span {
            font-size: 14px;
            font-weight: 600;
            opacity: 0.9;
        }
        
        .score-pass { 
            background: linear-gradient(135deg, var(--success) 0%, #43E794 100%); 
            box-shadow: 0 10px 20px rgba(5, 205, 153, 0.3); 
        }
        .score-fail { 
            background: linear-gradient(135deg, var(--danger) 0%, #FF7F74 100%); 
            box-shadow: 0 10px 20px rgba(238, 93, 80, 0.3); 
        }

        .empty-state { 
            text-align: center; 
            padding: 60px 20px; 
            background: var(--card-bg); 
            border-radius: 20px; 
            color: var(--secondary); 
            font-weight: 800; 
            font-size: 18px;
            border: 2px dashed var(--border-color); 
        }

        @media (max-width: 768px) {
            .result-card { 
                flex-direction: column; 
                text-align: center; 
                justify-content: center; 
            }
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <h3 id="sidebarTitle">🎓 بوابة الطالب</h3>
        <ul>
            <li><a href="index.html">🏠 الرئيسية (اللوحة)</a></li>
            <li><a href="index.html#examsSection">📝 امتحاناتي</a></li>
            <li><a href="result.html" class="active">📊 تقارير الدرجات</a></li>
            <li><a href="#" onclick="logoutUser()">🚪 تسجيل الخروج</a></li>
        </ul>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <h2>📊 تقرير أداء الطالب</h2>
        <div class="alert-box" style="background: rgba(67, 24, 255, 0.05); border-color: var(--primary); color: var(--primary);">
            <span id="studentNameDisplay">جاري التحميل... ⏳</span>
        </div>

        <div id="resultsContainer">
            <div class="empty-state">⏳ جاري سحب النتائج المعتمدة من قاعدة البيانات...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform",
            storageBucket: "dr-ahmed-rizk-platform.appspot.com",
            messagingSenderId: "117735726313",
            appId: "1:117735726313:web:2a58aa1c4be7137b53e478"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const currentPhone = localStorage.getItem('currentLoggedInStudent');
        
        // تطبيق إعدادات الاسم للمنصة
        const platformName = localStorage.getItem('platformName') || "منصة د. أحمد رزق";
        document.title = `تقارير الدرجات - ${platformName}`;

        if (!currentPhone) {
            window.location.href = "../auth/login.html";
        } else {
            database.ref('students/' + currentPhone).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    const studentData = snapshot.val();
                    document.getElementById('studentNameDisplay').innerHTML = `👨‍🎓 الطالب: <strong>${studentData.name}</strong> &nbsp;|&nbsp; 📱 رقم الهاتف: <strong>${currentPhone}</strong>`;
                    loadResults();
                } else {
                    logoutUser();
                }
            });
        }

        function loadResults() {
            const container = document.getElementById('resultsContainer');
            
            database.ref(`students/${currentPhone}/results`).once('value').then(snapshot => {
                container.innerHTML = ''; 

                if (snapshot.exists()) {
                    const results = snapshot.val();
                    // استخدام reverse لعرض أحدث الامتحانات في الأعلى
                    const resultsArray = Object.values(results).reverse();

                    resultsArray.forEach(res => {
                        const percentage = (res.score / res.total) * 100;
                        const statusClass = percentage >= 50 ? 'score-pass' : 'score-fail';
                        const statusWord = percentage >= 50 ? 'ناجح' : 'راسب';

                        container.innerHTML += `
                            <div class="result-card">
                                <div class="exam-info">
                                    <h4>📝 ${res.examName}</h4>
                                    <p>📅 تاريخ الأداء: <span style="color:var(--dark-text);">${res.dateTaken}</span></p>
                                    <p>📌 إجمالي الأسئلة: <span style="color:var(--dark-text);">${res.total}</span> | الإجابات الصحيحة: <span style="color:var(--dark-text);">${res.score}</span></p>
                                </div>
                                <div class="score-circle ${statusClass}">
                                    ${res.score}/${res.total}
                                    <span>${statusWord}</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            📭 لا توجد نتائج مسجلة حتى الآن.<br>
                            <span style="font-size:15px; font-weight:600; opacity:0.8; margin-top:10px; display:block;">لم تقم بأداء أي امتحانات على المنصة بعد.</span>
                        </div>
                    `;
                }
            });
        }

        function logoutUser() {
            localStorage.removeItem('currentLoggedInStudent');
            window.location.href = "../auth/login.html";
        }
    </script>
</body>
</html>
