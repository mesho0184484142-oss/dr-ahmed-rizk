<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير الدرجات - منصة د. أحمد رزق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif !important; background-color: #f4f7fe !important; color: #2b3674 !important; margin: 0 !important; display: flex !important; min-height: 100vh !important; }
        
        .sidebar { width: 250px !important; background: #ffffff !important; box-shadow: -5px 0 20px rgba(0,0,0,0.05) !important; position: fixed !important; right: 0 !important; top: 0 !important; height: 100vh !important; padding: 30px 20px !important; z-index: 1000 !important; box-sizing: border-box !important; overflow-y: auto !important; }
        .sidebar h3 { color: #2b3674 !important; font-weight: 800 !important; text-align: center !important; margin-bottom: 40px !important; font-size: 20px !important; }
        .sidebar ul { list-style: none !important; padding: 0 !important; margin: 0 !important; }
        .sidebar ul li { margin-bottom: 10px !important; }
        .sidebar ul li a { display: block !important; padding: 12px 15px !important; color: #a3aed1 !important; text-decoration: none !important; font-weight: 700 !important; border-radius: 12px !important; transition: all 0.3s ease !important; text-align: right !important; }
        .sidebar ul li a.active, .sidebar ul li a:hover { background: #4318FF !important; color: #ffffff !important; box-shadow: 0 10px 20px rgba(67, 24, 255, 0.2) !important; }
        
        .main-content { margin-right: 250px !important; padding: 40px !important; width: calc(100% - 250px) !important; box-sizing: border-box !important; text-align: right !important; }
        h2 { font-weight: 800; color: #2b3674; margin-bottom: 5px; font-size: 26px; margin-top: 0; }
        
        .result-card { background: #ffffff; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); margin-bottom: 20px; border: 1px solid #e0e5f2; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; transition: transform 0.3s; }
        .result-card:hover { transform: translateY(-3px); border-color: #4318FF; }
        .exam-info h4 { margin: 0 0 10px 0; color: #4318FF; font-size: 20px; text-align: right; }
        .exam-info p { margin: 0; color: #a3aed1; font-weight: 600; font-size: 14px; text-align: right; }
        
        .score-circle { width: 80px; height: 80px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: 800; color: white; direction: ltr; }
        .score-pass { background: linear-gradient(135deg, #05CD99 0%, #43E794 100%); box-shadow: 0 10px 20px rgba(5, 205, 153, 0.3); }
        .score-fail { background: linear-gradient(135deg, #EE5D50 0%, #FF7F74 100%); box-shadow: 0 10px 20px rgba(238, 93, 80, 0.3); }

        .empty-state { text-align: center; padding: 50px; background: #ffffff; border-radius: 20px; color: #a3aed1; font-weight: 700; border: 1px dashed #e0e5f2; }

        @media (max-width: 768px) {
            body { flex-direction: column !important; }
            .sidebar { position: relative !important; width: 100% !important; height: auto !important; padding: 20px !important; box-shadow: 0 5px 15px rgba(0,0,0,0.05) !important; z-index: 10 !important; }
            .sidebar ul { display: flex !important; flex-wrap: wrap !important; gap: 10px !important; justify-content: center !important; }
            .sidebar ul li a { padding: 10px 15px !important; font-size: 13px !important; text-align: center !important; }
            .main-content { margin-right: 0 !important; width: 100% !important; padding: 20px !important; }
            .result-card { flex-direction: column; text-align: center; justify-content: center; }
            .exam-info h4, .exam-info p { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>🎓 بوابة الطالب</h3>
        <ul>
            <li><a href="index.html">🏠 الرئيسية (اللوحة)</a></li>
            <li><a href="index.html">📝 امتحاناتي</a></li>
            <li><a href="#">📚 المذكرات والشيتات</a></li>
            <li><a href="result.html" class="active">📊 تقارير الدرجات</a></li>
            <li><a href="#" onclick="logoutUser()">🚪 تسجيل الخروج</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h2>📊 تقرير أداء الطالب</h2>
        <p style="color: #a3aed1; font-weight: 700; margin-bottom: 30px;" id="studentNameDisplay">جاري التحميل...</p>

        <div id="resultsContainer">
            <div class="empty-state">⏳ جاري سحب النتائج من السيرفر...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform",
            storageBucket: "dr-ahmed-rizk-platform.appspot.com",
            messagingSenderId: "117735726313",
            appId: "1:117735726313:web:2a58aa1c4be7137b53e478"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const currentPhone = localStorage.getItem('currentLoggedInStudent');

        if (!currentPhone) {
            window.location.href = "../auth/login.html";
        } else {
            database.ref('students/' + currentPhone).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    const studentData = snapshot.val();
                    document.getElementById('studentNameDisplay').innerText = `الطالب: ${studentData.name} | رقم الهاتف: ${currentPhone}`;
                    loadResults();
                } else {
                    logoutUser();
                }
            });
        }

        function loadResults() {
            const container = document.getElementById('resultsContainer');
            
            database.ref(`students/${currentPhone}/results`).once('value').then(snapshot => {
                container.innerHTML = ''; 

                if (snapshot.exists()) {
                    const results = snapshot.val();
                    const resultsArray = Object.values(results).reverse();

                    resultsArray.forEach(res => {
                        const percentage = (res.score / res.total) * 100;
                        const statusClass = percentage >= 50 ? 'score-pass' : 'score-fail';

                        container.innerHTML += `
                            <div class="result-card">
                                <div class="exam-info">
                                    <h4>📝 ${res.examName}</h4>
                                    <p>📅 تاريخ الأداء: ${res.dateTaken}</p>
                                    <p>📌 عدد الأسئلة الكلي: ${res.total} | الإجابات الصحيحة: ${res.score}</p>
                                </div>
                                <div class="score-circle ${statusClass}">
                                    ${res.score}/${res.total}
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            📭 لا توجد نتائج مسجلة حتى الآن.<br>
                            لم تقم بأداء أي امتحانات على المنصة.
                        </div>
                    `;
                }
            });
        }

        function logoutUser() {
            localStorage.removeItem('currentLoggedInStudent');
            window.location.href = "../auth/login.html";
        }
    </script>
</body>
</html>
