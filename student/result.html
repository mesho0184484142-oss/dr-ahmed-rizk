<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير الدرجات - المنصة التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- ربط ملف التصميم الموحد للطالب -->
    <link rel="stylesheet" href="../assets/css/student.css">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* تنسيقات إضافية خاصة بكروت النتائج */
        :root {
            --primary: #4318FF;
            --secondary: #a3aed1;
            --success: #05CD99;
            --danger: #EE5D50;
            --card-bg: #ffffff;
            --bg-light: #f4f7fe;
            --border-color: #e0e5f2;
            --dark-text: #2b3674;
        }

        body { font-family: 'Cairo', sans-serif; background: var(--bg-light); color: var(--dark-text); }

        .result-card { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
            margin-bottom: 25px; 
            border: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 20px; 
            transition: all 0.3s ease; 
        }
        
        .result-card:hover { 
            transform: translateY(-5px); 
            border-color: var(--primary); 
            box-shadow: 0 15px 35px rgba(67, 24, 255, 0.08);
        }
        
        .exam-info h4 { 
            margin: 0 0 15px 0; 
            color: var(--primary); 
            font-size: 22px; 
            font-weight: 800;
        }
        
        .exam-info p { 
            margin: 8px 0; 
            color: var(--secondary); 
            font-weight: 700; 
            font-size: 15px; 
        }

        .exam-info strong { color: var(--dark-text); }
        
        .score-section {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .score-circle { 
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            font-size: 24px; 
            font-weight: 800; 
            color: white; 
            direction: ltr; 
        }

        .score-circle span {
            font-size: 14px;
            font-weight: 700;
            opacity: 0.95;
            margin-top: -2px;
        }
        
        .score-pass { 
            background: linear-gradient(135deg, var(--success) 0%, #43E794 100%); 
            box-shadow: 0 10px 20px rgba(5, 205, 153, 0.3); 
        }
        .score-fail { 
            background: linear-gradient(135deg, var(--danger) 0%, #FF7F74 100%); 
            box-shadow: 0 10px 20px rgba(238, 93, 80, 0.3); 
        }

        .print-report-btn {
            background: var(--bg-light);
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 10px 20px;
            border-radius: 12px;
            font-family: 'Cairo';
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .print-report-btn:hover { background: var(--primary); color: white; }

        .empty-state { 
            text-align: center; 
            padding: 60px 20px; 
            background: var(--card-bg); 
            border-radius: 20px; 
            color: var(--secondary); 
            font-weight: 800; 
            font-size: 18px;
            border: 2px dashed var(--border-color); 
        }

        /* تنسيقات الطباعة */
        @media print {
            .sidebar, .print-report-btn { display: none !important; }
            .main-content { margin: 0 !important; padding: 0 !important; width: 100% !important; }
            .result-card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
            body { background: white; }
        }

        @media (max-width: 768px) {
            .result-card { flex-direction: column; text-align: center; justify-content: center; }
            .score-section { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <h3 id="sidebarTitle">🎓 بوابة الطالب</h3>
        <ul>
            <li><a href="index.html">🏠 الرئيسية (اللوحة)</a></li>
            <li><a href="index.html#examsSection">📝 امتحاناتي</a></li>
            <li><a href="result.html" class="active">📊 تقارير الدرجات</a></li>
            <li><a href="#" onclick="logoutUser()" style="color: var(--danger);">🚪 تسجيل الخروج</a></li>
        </ul>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;">
            <h2 style="margin: 0;">📊 السجل الأكاديمي وتقرير الدرجات</h2>
            <button class="print-report-btn" onclick="window.print()">🖨️ طباعة السجل بالكامل</button>
        </div>
        
        <div class="alert-box" style="background: rgba(67, 24, 255, 0.05); border: 1px solid var(--primary); color: var(--primary); padding: 15px; border-radius: 12px; margin-bottom: 30px;">
            <span id="studentNameDisplay" style="font-weight: 700; font-size: 16px;">جاري تحميل بيانات الطالب... ⏳</span>
        </div>

        <div id="resultsContainer">
            <div class="empty-state">⏳ جاري سحب النتائج المعتمدة من قاعدة البيانات...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2_IFn95PC962G1CFxEvugRD1ysZZaDqw",
            authDomain: "dr-ahmed-rizk-platform.firebaseapp.com",
            databaseURL: "https://dr-ahmed-rizk-platform-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dr-ahmed-rizk-platform"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const currentPhone = localStorage.getItem('currentLoggedInStudent');
        
        const platformName = localStorage.getItem('platformName') || "المنصة التعليمية";
        document.title = `تقارير الدرجات - ${platformName}`;

        if (!currentPhone) {
            window.location.href = "../auth/login.html";
        } else {
            database.ref('students/' + currentPhone).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    const studentData = snapshot.val();
                    let stageText = studentData.university === 'bachelor' || studentData.university === 'baccalaureate' ? 'بكالوريا' : 'طالب جامعي';
                    
                    document.getElementById('studentNameDisplay').innerHTML = `👨‍🎓 الاسم: <strong>${studentData.name}</strong> &nbsp;|&nbsp; 📱 الهاتف: <strong>${currentPhone}</strong> &nbsp;|&nbsp; 📚 المرحلة: <strong>${stageText}</strong>`;
                    loadResults();
                } else {
                    logoutUser();
                }
            });
        }

        function loadResults() {
            const container = document.getElementById('resultsContainer');
            
            database.ref(`students/${currentPhone}/results`).once('value').then(snapshot => {
                container.innerHTML = ''; 

                if (snapshot.exists()) {
                    const results = snapshot.val();
                    const resultsArray = Object.values(results).reverse();

                    resultsArray.forEach(res => {
                        // حساب النسبة المئوية بناءً على الدرجات (Points) وليس عدد الأسئلة
                        const percentage = ((res.score / res.total) * 100).toFixed(1);
                        const statusClass = percentage >= 50 ? 'score-pass' : 'score-fail';
                        const statusWord = percentage >= 50 ? 'ناجح' : 'راسب';

                        container.innerHTML += `
                            <div class="result-card">
                                <div class="exam-info">
                                    <h4>📝 ${res.examName}</h4>
                                    <p>📅 تاريخ ووقت الأداء: <strong>${res.dateTaken}</strong></p>
                                    <p>🎯 الدرجة النهائية للامتحان: <strong>${res.total} درجة</strong></p>
                                    <p>📌 الدرجة المحصلة: <strong style="color: ${percentage >= 50 ? 'var(--success)' : 'var(--danger)'};">${res.score} درجة</strong></p>
                                </div>
                                <div class="score-section">
                                    <div style="text-align: center; font-weight: 800; color: var(--secondary);">
                                        النسبة<br><span style="font-size: 20px; color: var(--dark-text);">${percentage}%</span>
                                    </div>
                                    <div class="score-circle ${statusClass}">
                                        ${res.score}/${res.total}
                                        <span>${statusWord}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            📭 السجل الأكاديمي فارغ حالياً.<br>
                            <span style="font-size:15px; font-weight:600; opacity:0.8; margin-top:10px; display:block;">لم يتم رصد أي نتائج امتحانات لك على المنصة حتى هذه اللحظة.</span>
                        </div>
                    `;
                }
            });
        }

        function logoutUser() {
            localStorage.removeItem('currentLoggedInStudent');
            window.location.href = "../auth/login.html";
        }
    </script>
</body>
</html>
